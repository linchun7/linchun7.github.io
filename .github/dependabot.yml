version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/icloud_price_comparison
    schedule:
      interval: weekly
      day: monday
      time: "10:20"
      timezone: Asia/Shanghai
    # Keep each dependency in its own PR. Major/minor/patch are all eligible;
    # the trusted auto-merge gate decides from the tested candidate.
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /tools/browser-tests
    schedule:
      interval: weekly
      day: monday
      time: "11:20"
      timezone: Asia/Shanghai
    # Playwright is test infrastructure. Its PR installs the candidate package,
    # installs that version's browsers, and runs the full three-browser suite.
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:20"
      timezone: Asia/Shanghai
    # Keep each official Action in its own PR. Routine updates may auto-merge;
    # major updates remain gated because not every production-only Action is
    # exercised by the validation workflow.
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "actions/*"
