version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/icloud_price_comparison
    schedule:
      interval: weekly
      day: monday
      time: "10:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # Keep npm updates independent so one incompatible package cannot block unrelated upgrades.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "actions/*"
    groups:
      official-github-actions:
        patterns:
          - "actions/*"
