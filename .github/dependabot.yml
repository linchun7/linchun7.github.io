version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/icloud_price_comparison
    schedule:
      interval: weekly
      day: monday
      time: "10:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk version maintenance; major updates remain separate for manual review.
      routine-icloud-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "actions/*"
    groups:
      official-github-actions:
        patterns:
          - "actions/*"
