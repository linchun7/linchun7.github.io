name: Adversarial iCloud UI seal

on:
  push:
    branches:
      - verify/icloud-minimum-history-20260926

permissions:
  contents: read

jobs:
  ui-adversarial:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact sealed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aef75165ff5d0b7cf048a692acf1a9602f84c790
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          check-latest: false

      - name: Install locked dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Install browser
        working-directory: tools/icloud_price_comparison
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Start local sealed site
        working-directory: tools/icloud_price_comparison
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/icloud-http.log 2>&1 &
          echo $! > /tmp/icloud-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/icloud-http.log
          exit 1

      - name: Attack responsive geometry
        working-directory: tools/icloud_price_comparison
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          cat > ./.adversarial-ui.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium, firefox, webkit } from 'playwright';

          const engine = { chromium, firefox, webkit }[process.env.BROWSER];
          const browser = await engine.launch({ headless: true });
          const widths = [320, 390, 640, 641, 1280];

          function overlapArea(a, b) {
            return Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left))
              * Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
          }

          try {
            for (const width of widths) {
              const page = await browser.newPage({ viewport: { width, height: 900 } });
              const errors = [];
              page.on('pageerror', (error) => errors.push(error.message));
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.querySelectorAll('#priceRows tr[data-market-id]').length >= 150);
              await page.waitForFunction(() => document.querySelector('#loadStatus')?.hidden === true);

              assert.equal(errors.length, 0, `${width}px page errors: ${errors.join('; ')}`);
              const preOverflow = await page.evaluate(() => {
                const root = document.documentElement;
                const viewport = root.clientWidth;
                const offenders = [...document.querySelectorAll('body *')].map((el) => {
                  const rect = el.getBoundingClientRect();
                  return {
                    tag: el.tagName,
                    id: el.id,
                    className: typeof el.className === 'string' ? el.className : '',
                    left: rect.left,
                    right: rect.right,
                    width: rect.width,
                    scrollWidth: el.scrollWidth,
                    clientWidth: el.clientWidth
                  };
                }).filter((item) => item.right > viewport + 1 || item.left < -1)
                  .sort((a, b) => (b.right - viewport) - (a.right - viewport))
                  .slice(0, 25);
                return { scrollWidth: root.scrollWidth, clientWidth: viewport, offenders };
              });
              if (preOverflow.scrollWidth > preOverflow.clientWidth + 1) {
                console.log('OVERFLOW_DIAGNOSTIC', JSON.stringify({ width, ...preOverflow }, null, 2));
              }
              assert.ok(preOverflow.scrollWidth <= preOverflow.clientWidth + 1,
                `${width}px page has horizontal overflow before sorting`);

              if (width <= 1100) {
                await page.locator('button[data-sort="country"]').click();
                await page.waitForFunction(() => document.querySelector('.mobile-rank')?.textContent === '序1');

                const rows = await page.locator('#priceRows tr[data-market-id]').evaluateAll((nodes) => nodes.map((row) => {
                  const button = row.querySelector('.country-history-button');
                  const nameEl = button.querySelector('.country-name');
                  const subtitleEl = button.querySelector('.country-name-en');
                  const rankEl = button.querySelector('.mobile-rank');
                  const arrowEl = button.querySelector('.history-affordance');
                  const priceCell = row.querySelector('.price-cell.is-active-tier');
                  const priceCny = priceCell?.querySelector('.price-cny');
                  const priceLocal = priceCell?.querySelector('.price-local');
                  const rect = (el) => el ? el.getBoundingClientRect() : null;
                  return {
                    marketId: row.dataset.marketId,
                    rankText: rankEl?.textContent ?? '',
                    name: rect(nameEl),
                    subtitle: rect(subtitleEl),
                    rank: rect(rankEl),
                    arrow: rect(arrowEl),
                    cell: rect(priceCell),
                    priceCny: rect(priceCny),
                    priceLocal: rect(priceLocal),
                    nameGridRow: getComputedStyle(nameEl).gridRowStart,
                    rankGridRow: getComputedStyle(rankEl).gridRowStart
                  };
                }));

                assert.ok(rows.length >= 150, `${width}px did not exercise the full country set`);
                assert.ok(rows.some((row) => /^序1\d\d$/.test(row.rankText)), `${width}px never exercised a three-digit sequence badge`);

                for (const row of rows) {
                  assert.equal(row.nameGridRow, '1', `${width}px ${row.marketId}: country name escaped grid row 1`);
                  assert.equal(row.rankGridRow, '2', `${width}px ${row.marketId}: sequence escaped grid row 2`);
                  assert.equal(overlapArea(row.name, row.rank), 0, `${width}px ${row.marketId}: name overlaps sequence`);
                  assert.equal(overlapArea(row.name, row.arrow), 0, `${width}px ${row.marketId}: name overlaps history affordance`);
                  if (row.cell && row.priceCny) {
                    assert.ok(row.priceCny.left >= row.cell.left - 1 && row.priceCny.right <= row.cell.right + 1,
                      `${width}px ${row.marketId}: CNY price escapes active price cell`);
                  }
                  if (row.cell && row.priceLocal) {
                    assert.ok(row.priceLocal.left >= row.cell.left - 1 && row.priceLocal.right <= row.cell.right + 1,
                      `${width}px ${row.marketId}: local price escapes active price cell`);
                  }
                }

                if (width <= 640) {
                  const share = await page.locator('.price-table').evaluate((table) => {
                    const row = table.querySelector('#priceRows tr[data-market-id]');
                    return row.cells[1].getBoundingClientRect().width / table.getBoundingClientRect().width;
                  });
                  assert.ok(share >= 0.46 && share <= 0.49, `${width}px country-column share drifted to ${share}`);
                }

                assert.ok(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1),
                  `${width}px page has horizontal overflow after country sorting`);
              }

              await page.locator('#minimumHistoryButton').click();
              await page.waitForFunction(() => document.querySelector('#minimumHistoryDialog')?.open === true);
              await page.waitForFunction(() => document.querySelectorAll('#minimumHistoryEvents .minimum-history-event').length > 0);

              const history = await page.locator('#minimumHistoryDialog').evaluate((dialog) => {
                const header = dialog.querySelector('.dialog-header');
                const title = dialog.querySelector('#minimumHistoryTitle').getBoundingClientRect();
                const toolbar = dialog.querySelector('#minimumHistoryToolbar').getBoundingClientRect();
                const close = dialog.querySelector('#closeMinimumHistory').getBoundingClientRect();
                const list = dialog.querySelector('#minimumHistoryEvents');
                const note = dialog.querySelector('#minimumHistoryNote');
                const events = [...dialog.querySelectorAll('.minimum-history-event')];
                return {
                  dialogScrollWidth: dialog.scrollWidth,
                  dialogClientWidth: dialog.clientWidth,
                  title, toolbar, close,
                  listBorderTop: getComputedStyle(list).borderTopWidth,
                  noteBorderTop: getComputedStyle(note).borderTopWidth,
                  noteBackground: getComputedStyle(note).backgroundColor,
                  eventTopBorders: events.map((event) => getComputedStyle(event).borderTopWidth),
                  eventBottomBorders: events.map((event) => getComputedStyle(event).borderBottomWidth)
                };
              });

              assert.ok(history.dialogScrollWidth <= history.dialogClientWidth + 1, `${width}px history dialog overflows horizontally`);
              assert.equal(history.listBorderTop, '0px', `${width}px history regained redundant list top rule`);
              assert.equal(history.noteBorderTop, '0px', `${width}px note regained redundant top rule`);
              assert.notEqual(history.noteBackground, 'rgba(0, 0, 0, 0)', `${width}px note lost soft background`);
              assert.ok(history.eventBottomBorders.every((value) => value === '0px'), `${width}px events regained bottom rules`);
              assert.equal(history.eventTopBorders.filter((value) => value !== '0px').length, Math.max(0, history.eventTopBorders.length - 1),
                `${width}px history separators are not exactly N-1`);

              if (width <= 640) {
                assert.ok(history.toolbar.top >= history.title.bottom + 3, `${width}px history filter did not move below title`);
              } else {
                assert.ok(Math.abs(history.toolbar.top - history.title.top) < 12, `${width}px history filter is not on title row`);
                assert.ok(history.toolbar.right < history.close.left - 4, `${width}px history filter crowds close button`);
              }

              await page.close();
            }
          } finally {
            await browser.close();
          }

          console.log(`Adversarial UI geometry passed for ${process.env.BROWSER}: ${widths.join(', ')}px`);
          NODE
          node ./.adversarial-ui.mjs
          rm -f ./.adversarial-ui.mjs

      - name: Stop local site
        if: always()
        run: |
          if [ -f /tmp/icloud-http.pid ]; then kill "$(cat /tmp/icloud-http.pid)" || true; fi
