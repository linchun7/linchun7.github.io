name: Final adversarial iCloud seal

on:
  push:
    branches:
      - verify/icloud-minimum-history-20260926

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8f1ccfd4413baa356fdbd5d6cc1172ad131794dd
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          check-latest: false
      - name: Install locked validation dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify canonical production
        working-directory: tools/icloud_price_comparison
        run: |
          node scripts/verify-production-deployment.mjs \
            --expected-data-dir data \
            --run-id "$GITHUB_RUN_ID" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --max-wait-ms 300000 \
            --interval-ms 5000

  ui-adversarial:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8f1ccfd4413baa356fdbd5d6cc1172ad131794dd
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          check-latest: false
      - name: Install locked dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser
        working-directory: tools/icloud_price_comparison
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start local sealed site
        working-directory: tools/icloud_price_comparison
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/icloud-http.log 2>&1 &
          echo $! > /tmp/icloud-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Attack responsive seams
        working-directory: tools/icloud_price_comparison
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          cat > ./.final-adversarial-ui.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium, firefox, webkit } from 'playwright';

          const engine = { chromium, firefox, webkit }[process.env.BROWSER];
          const browser = await engine.launch({ headless: true });
          const widths = [320,390,640,641,720,721,1100,1101,1280];

          const overlapArea = (a,b) =>
            Math.max(0, Math.min(a.right,b.right)-Math.max(a.left,b.left)) *
            Math.max(0, Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));

          try {
            for (const width of widths) {
              const page = await browser.newPage({viewport:{width,height:900}});
              const errors=[]; page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelectorAll('#priceRows tr[data-market-id]').length>=150);
              await page.waitForFunction(()=>document.querySelector('#loadStatus')?.hidden===true);

              const root = await page.evaluate(()=>({
                scrollWidth:document.documentElement.scrollWidth,
                clientWidth:document.documentElement.clientWidth,
                updatedAt:document.querySelector('#updatedAt')?.getBoundingClientRect(),
                viewport:document.documentElement.clientWidth
              }));
              assert.equal(errors.length,0,`${width}px page errors: ${errors.join('; ')}`);
              assert.ok(root.scrollWidth<=root.clientWidth+1,`${width}px root overflow: ${root.scrollWidth} > ${root.clientWidth}`);
              assert.ok(!root.updatedAt || root.updatedAt.right<=root.viewport+1,`${width}px updatedAt escapes viewport`);

              if (width<=1100) {
                await page.locator('button[data-sort="country"]').click();
                await page.waitForFunction(()=>document.querySelector('.mobile-rank')?.textContent==='序1');
                const rows=await page.locator('#priceRows tr[data-market-id]').evaluateAll(nodes=>nodes.map(row=>{
                  const b=row.querySelector('.country-history-button');
                  const name=b.querySelector('.country-name'), rank=b.querySelector('.mobile-rank'), arrow=b.querySelector('.history-affordance');
                  return {rankText:rank?.textContent??'',name:name.getBoundingClientRect(),rank:rank.getBoundingClientRect(),arrow:arrow.getBoundingClientRect()};
                }));
                assert.ok(rows.some(r=>/^序1\d\d$/.test(r.rankText)),`${width}px did not reach 3-digit sequence`);
                for (const row of rows) {
                  assert.equal(overlapArea(row.name,row.rank),0,`${width}px country name overlaps sequence`);
                  assert.equal(overlapArea(row.name,row.arrow),0,`${width}px country name overlaps arrow`);
                }
                assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),
                  `${width}px overflow after country sorting`);
              }

              await page.locator('#minimumHistoryButton').click();
              await page.waitForFunction(()=>document.querySelector('#minimumHistoryDialog')?.open===true);
              await page.waitForFunction(()=>document.querySelectorAll('#minimumHistoryEvents .minimum-history-event').length>0);
              const h=await page.locator('#minimumHistoryDialog').evaluate(dialog=>{
                const title=dialog.querySelector('#minimumHistoryTitle').getBoundingClientRect();
                const toolbar=dialog.querySelector('#minimumHistoryToolbar').getBoundingClientRect();
                const close=dialog.querySelector('#closeMinimumHistory').getBoundingClientRect();
                const list=dialog.querySelector('#minimumHistoryEvents');
                const note=dialog.querySelector('#minimumHistoryNote');
                const events=[...dialog.querySelectorAll('.minimum-history-event')];
                return {
                  scrollWidth:dialog.scrollWidth,clientWidth:dialog.clientWidth,title,toolbar,close,
                  listTop:getComputedStyle(list).borderTopWidth,
                  noteTop:getComputedStyle(note).borderTopWidth,
                  eventTop:events.map(e=>getComputedStyle(e).borderTopWidth),
                  eventBottom:events.map(e=>getComputedStyle(e).borderBottomWidth)
                };
              });
              assert.ok(h.scrollWidth<=h.clientWidth+1,`${width}px history dialog overflow`);
              assert.equal(h.listTop,'0px');
              assert.equal(h.noteTop,'0px');
              assert.ok(h.eventBottom.every(v=>v==='0px'));
              assert.equal(h.eventTop.filter(v=>v!=='0px').length,Math.max(0,h.eventTop.length-1));
              if (width<=640) assert.ok(h.toolbar.top>=h.title.bottom+3,`${width}px history filter should be below title`);
              else {
                assert.ok(Math.abs(h.toolbar.top-h.title.top)<12,`${width}px history filter should share title row`);
                assert.ok(h.toolbar.right<h.close.left-4,`${width}px history filter crowds close button`);
              }
              await page.close();
            }
          } finally { await browser.close(); }

          console.log(`Final adversarial UI seal passed for ${process.env.BROWSER}`);
          NODE
          node ./.final-adversarial-ui.mjs
          rm -f ./.final-adversarial-ui.mjs
      - name: Stop local site
        if: always()
        run: |
          if [ -f /tmp/icloud-http.pid ]; then kill "$(cat /tmp/icloud-http.pid)" || true; fi
