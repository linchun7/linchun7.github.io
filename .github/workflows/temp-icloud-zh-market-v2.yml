name: TEMP iCloud zh market v2

on:
  push:
    branches:
      - fix/icloud-zh-market-monitor-v2

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect current Apple Chinese HTML around candidate names
        working-directory: tools/icloud_price_comparison
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://support.apple.com/zh-cn/108047';
          const response = await fetch(url, { cache: 'no-store', headers: { 'cache-control': 'no-cache' } });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const html = await response.text();
          for (const needle of ['刚果共和国', '毛里求斯', '莫尔多瓦', '摩尔多瓦', '隐藏邮件地址', '自定义电子邮件域']) {
            const at = html.indexOf(needle);
            console.log(`\n===== ${needle} @ ${at} =====`);
            console.log(at >= 0 ? html.slice(Math.max(0, at - 500), at + 900).replace(/\s+/g, ' ') : 'NOT FOUND');
          }
          NODE
