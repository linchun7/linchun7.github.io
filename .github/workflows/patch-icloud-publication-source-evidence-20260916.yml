name: Patch iCloud publication source evidence 20260916

on:
  push:
    branches:
      - fix/icloud-publication-source-evidence-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出修复分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 精确修复 publication source evidence 语义
        run: |
          python - <<'PY'
          from pathlib import Path

          updater = Path('tools/icloud_price_comparison/scripts/update-prices.mjs')
          text = updater.read_text(encoding='utf-8')
          replacements = [
              (
                  "  const marketKey = (country) => country.marketId ?? country.country;\n  const previousByCountry = new Map((previousData?.countries ?? []).map((country) => [marketKey(country), country]));\n  const currentByCountry = new Map(countries.map((country) => [marketKey(country), country]));",
                  "  // Publication history is Apple source evidence. Source-name changes must remain visible even when a stable marketId is preserved for price history.\n  const previousByCountry = new Map((previousData?.countries ?? []).map((country) => [country.country, country]));\n  const currentByCountry = new Map(countries.map((country) => [country.country, country]));"
              ),
              (".filter((country) => !previousByCountry.has(marketKey(country)))", ".filter((country) => !previousByCountry.has(country.country))"),
              (".filter((country) => !currentByCountry.has(marketKey(country)))", ".filter((country) => !currentByCountry.has(country.country))"),
              ("const previous = previousByCountry.get(marketKey(country));", "const previous = previousByCountry.get(country.country);")
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one updater match, got {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          updater.write_text(text, encoding='utf-8')

          test_file = Path('tools/icloud_price_comparison/test/update-prices.test.mjs')
          tests = test_file.read_text(encoding='utf-8')
          marker = "publication snapshot changes keep Apple source-name renames visible even when marketId stays stable"
          if marker in tests:
              raise SystemExit('regression test already exists unexpectedly')
          tests += r'''

test('publication snapshot changes keep Apple source-name renames visible even when marketId stays stable', () => {
  const previousData = {
    tiers: [{ id: '50GB', label: '50 GB' }],
    countries: [{
      marketId: 'ci',
      country: 'Ivory Coast',
      nameZh: '科特迪瓦',
      region: 'Europe, Middle East & Africa',
      currency: 'USD',
      plans: { '50GB': { price: 0.99, formattedPrice: '$0.99' } }
    }]
  };
  const currentCountries = [{
    marketId: 'ci',
    country: "Cote D'Ivoire",
    nameZh: '科特迪瓦',
    region: 'Europe, Middle East & Africa',
    currency: 'USD',
    plans: { '50GB': { price: 0.99, formattedPrice: '$0.99' } }
  }];

  const changes = buildSnapshotChanges(previousData, currentCountries, [{ id: '50GB', label: '50 GB' }]);
  assert.deepEqual(changes.addedCountries, [{ country: "Cote D'Ivoire", nameZh: '科特迪瓦' }]);
  assert.deepEqual(changes.removedCountries, [{ country: 'Ivory Coast', nameZh: '科特迪瓦' }]);
  assert.deepEqual(changes.changedCountries, []);
});
'''
          test_file.write_text(tests, encoding='utf-8')
          PY

      - name: 提交修复并移除一次性工作流
        run: |
          git config user.name linchun7
          git config user.email 104673731+linchun7@users.noreply.github.com
          git add tools/icloud_price_comparison/scripts/update-prices.mjs tools/icloud_price_comparison/test/update-prices.test.mjs
          git rm .github/workflows/patch-icloud-publication-source-evidence-20260916.yml
          git commit -m "fix: preserve Apple source renames in publication evidence"
          git push origin HEAD:fix/icloud-publication-source-evidence-20260916
