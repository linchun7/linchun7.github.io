name: Validate iCloud price comparison

on:
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'tools/icloud_price_comparison/**'
  push:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'tools/icloud_price_comparison/**'
  workflow_dispatch:
  schedule:
    # 北京时间每周一 06:05；GitHub cron 使用 UTC，因此为周日 22:05。
    - cron: '5 22 * * 0'

permissions:
  contents: read

concurrency:
  group: validate-icloud-price-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: 核心、数据与依赖安全测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 启用并校验 pnpm
        run: |
          corepack enable
          pnpm --version
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 运行核心与数据测试
        run: pnpm test:core
      - name: 深度验证当前完整数据工件
        run: pnpm validate:artifact
      - name: 深度审计全部 Apple 快照
        run: pnpm validate:snapshots
      - name: 检查依赖漏洞
        run: pnpm audit --audit-level low
      - name: 检查工作区差异格式
        working-directory: .
        run: git diff --check

  browser:
    name: 浏览器测试 (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 启用并校验 pnpm
        run: |
          corepack enable
          pnpm --version
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 安装 ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: 运行 ${{ matrix.browser }} 测试
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: node --test test/ui-smoke.test.mjs test/static-descending-url-state.test.mjs

  seo-sync:
    name: 一次性同步 SEO 元数据
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/icloud-seo-cleanup'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 精确更新 SEO 与分享卡片元数据
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/icloud_price_comparison/index.html')
          html = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '  <meta name="description" content="查看 Apple iCloud+ 在全球不同国家和地区的月费，并换算为人民币，支持容量比较、地区搜索和价格历史。">',
                  '  <meta name="description" content="比较 Apple iCloud+ 全球各国家和地区价格，覆盖 50GB、200GB、2TB、6TB、12TB 月费，提供当地币价、人民币参考价、最低价排名和价格历史。">'
              ),
              (
                  '  <meta property="og:description" content="查看 Apple iCloud+ 全球各地区月费、人民币换算价与价格历史。">',
                  '  <meta property="og:description" content="比较 Apple iCloud+ 全球各国家和地区价格，覆盖 50GB、200GB、2TB、6TB、12TB 月费、人民币参考价、最低价排名和价格历史。">'
              ),
              (
                  '  <meta property="og:image" content="https://www.linchun.com.cn/images/favicon-192x192.png">\n  <meta property="og:image:width" content="192">\n  <meta property="og:image:height" content="192">\n  <meta name="twitter:card" content="summary">',
                  '  <meta property="og:image" content="https://www.linchun.com.cn/tools/icloud_price_comparison/og-image.jpg">\n  <meta property="og:image:type" content="image/jpeg">\n  <meta property="og:image:width" content="600">\n  <meta property="og:image:height" content="315">\n  <meta property="og:image:alt" content="iCloud+ 全球价格对比：50GB、200GB、2TB、6TB、12TB">\n  <meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:title" content="iCloud+ 全球价格对比｜各地区月费与人民币换算价">\n  <meta name="twitter:description" content="比较 Apple iCloud+ 全球各国家和地区价格，覆盖 50GB、200GB、2TB、6TB、12TB 月费、人民币参考价、最低价排名和价格历史。">\n  <meta name="twitter:image" content="https://www.linchun.com.cn/tools/icloud_price_comparison/og-image.jpg">\n  <meta name="twitter:image:alt" content="iCloud+ 全球价格对比：50GB、200GB、2TB、6TB、12TB">'
              ),
              (
                  '          <p>比较 Apple iCloud+ 在全球不同国家和地区的月费，并换算为人民币。</p>',
                  '          <p>覆盖 Apple iCloud+ 50GB、200GB、2TB、6TB 和 12TB 套餐，比较全球各地区当地月费与人民币参考价。</p>'
              ),
          ]

          for old, new in replacements:
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one SEO target, found {count}: {old[:80]}')
              html = html.replace(old, new)

          if not Path('tools/icloud_price_comparison/og-image.jpg').is_file():
              raise SystemExit('og-image.jpg is missing')
          path.write_text(html, encoding='utf-8')
          PY

      - name: 恢复工作流自身并提交页面变更
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/validate-icloud-price-comparison.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/index.html .github/workflows/validate-icloud-price-comparison.yml
          if git diff --cached --quiet; then
            echo "No SEO changes to commit"
            exit 0
          fi
          git commit -m "feat: improve iCloud SEO and social metadata"
          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:${GITHUB_HEAD_REF}
