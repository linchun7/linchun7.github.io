name: Validate iCloud price comparison

on:
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'tools/icloud_price_comparison/**'
  push:
    branches:
      - main
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'tools/icloud_price_comparison/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-icloud-price-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 核心、Chrome 与 WebKit 测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 安装 pnpm
        run: npm install --global pnpm@10.14.0

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: 运行核心与数据测试
        run: pnpm test:core

      - name: 运行真实 Chrome 测试
        run: pnpm test:ui

      - name: 运行 WebKit 测试
        run: pnpm test:webkit

      - name: 检查依赖漏洞
        run: pnpm audit --audit-level low
