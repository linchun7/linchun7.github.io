name: Temporary iCloud hermetic test patch

on:
  pull_request:
    paths:
      - '.github/workflows/_temporary-icloud-hermetic-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/icloud-fallback-hermetic-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact hermetic clock patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/icloud_price_comparison/test/update-prices.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = """test('publishes with stale previous CNY values when every online FX candidate fails sanity', async () => {\n  const { root, paths } = await createTemporaryProductionPaths();\n  const data = JSON.parse(await readFile(paths.currentDataPath, 'utf8'));\n  const rates = compatibleExchangeRates(data);"""
          new = """test('publishes with stale previous CNY values when every online FX candidate fails sanity', async (t) => {\n  const { root, paths } = await createTemporaryProductionPaths();\n  const data = JSON.parse(await readFile(paths.currentDataPath, 'utf8'));\n  t.mock.timers.enable({ apis: ['Date'], now: new Date(Date.parse(data.generatedAt) + 60_000) });\n  const rates = compatibleExchangeRates(data);"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- tools/icloud_price_comparison/test/update-prices.test.mjs
          test "$(git diff --numstat -- tools/icloud_price_comparison/test/update-prices.test.mjs)" = $'2\t1\ttools/icloud_price_comparison/test/update-prices.test.mjs'

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/icloud_price_comparison/test/update-prices.test.mjs
          git commit -m 'test(icloud): make stale fallback clock hermetic'
          git push origin HEAD:${{ github.head_ref }}
