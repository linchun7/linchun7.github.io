name: Agent identity simplification

on:
  push:
    branches: [agent/icloud-identity-simplify]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-identity-simplify
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Harden temporary patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/icloud_price_comparison/scripts/agent-identity-simplify.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
            (
              "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
            ),
            (
              "text = replace_once(text, old_checkout, new_checkout, 'validation documentation gate')",
              "if text.count(old_checkout) != 2:\n    raise SystemExit(f'validation documentation gate: expected 2 checkout matches, found {text.count(old_checkout)}')\ntext = text.replace(old_checkout, new_checkout, 1)"
            )
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'temporary helper shape changed: {old[:40]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply reviewed simplification
        run: python tools/icloud_price_comparison/scripts/agent-identity-simplify.py
      - name: Simplify documentation gate and repair workflow assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow_path = Path('.github/workflows/validate-icloud-price-comparison.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start = workflow.index('      - name: 强制关键架构更新同步文档\n')
          end = workflow.index('      - name: 配置 Node.js\n', start)
          clean_gate = '\n'.join([
            '      - name: 强制关键架构更新同步文档',
            "        if: github.event_name == 'pull_request'",
            '        working-directory: .',
            '        env:',
            '          BASE_SHA: ${{ github.event.pull_request.base.sha }}',
            '        run: |',
            '          changed="$(git diff --name-only "$BASE_SHA" HEAD)"',
            '          needs_docs=false',
            '          while IFS= read -r file; do',
            '            case "$file" in',
            '              .github/workflows/update-icloud-prices.yml|.github/workflows/validate-icloud-price-comparison.yml|tools/icloud_price_comparison/data-contract.js|tools/icloud_price_comparison/data-model.js|tools/icloud_price_comparison/script.js|tools/icloud_price_comparison/scripts/market-registry.mjs|tools/icloud_price_comparison/scripts/reserved-market-registry.mjs|tools/icloud_price_comparison/scripts/update-prices.mjs|tools/icloud_price_comparison/scripts/parse-prices.mjs|tools/icloud_price_comparison/scripts/render-static-page.mjs|tools/icloud_price_comparison/scripts/static-page.mjs|tools/icloud_price_comparison/scripts/validate-data-artifact.mjs)',
            '                needs_docs=true',
            '                ;;',
            '            esac',
            '          done <<< "$changed"',
            '          if [ "$needs_docs" = true ]; then',
            '            for doc in tools/icloud_price_comparison/README.md tools/icloud_price_comparison/OPERATIONS.md; do',
            '              if ! printf \'%s\\n\' "$changed" | grep -Fxq "$doc"; then',
            '                echo "Critical iCloud architecture changed without required documentation update: $doc" >&2',
            '                exit 1',
            '              fi',
            '            done',
            '          fi',
            ''
          ])
          workflow = workflow[:start] + clean_gate + workflow[end:]
          workflow_path.write_text(workflow, encoding='utf-8')

          test_path = Path('tools/icloud_price_comparison/test/workflow.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          test, count = re.subn(
            r"  assert\.doesNotMatch\(ciWorkflow, /if: github\.event_name == 'schedule'.*?workflow_dispatch'/\);",
            "  assert.equal(ciWorkflow.includes(\"if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'\"), false);",
            test,
            count=1
          )
          if count != 1:
            raise SystemExit(f'workflow assertion replacement count={count}')
          needle = "  assert.match(coreJob, /run: git diff --check/);\n"
          addition = "  assert.match(coreJob, /name: 强制关键架构更新同步文档[\\s\\S]*?if: github\\.event_name == 'pull_request'/);\n  assert.match(coreJob, /fetch-depth: 0/);\n"
          if test.count(needle) != 1:
            raise SystemExit('workflow core assertion anchor changed')
          test = test.replace(needle, needle + addition, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Refresh generated asset hashes
        working-directory: tools/icloud_price_comparison
        run: pnpm assets:update
      - name: Run core tests
        working-directory: tools/icloud_price_comparison
        run: pnpm test:core
      - name: Validate complete artifact
        working-directory: tools/icloud_price_comparison
        run: pnpm validate:artifact
      - name: Validate all snapshots
        working-directory: tools/icloud_price_comparison
        run: pnpm validate:snapshots
      - name: Check diff and commit
        run: |
          git diff --check
          test ! -e .github/workflows/agent-identity-simplify.yml
          test ! -e tools/icloud_price_comparison/scripts/agent-identity-simplify.py
          test ! -e tools/icloud_price_comparison/scripts/migrate-market-id.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify immutable iCloud market identities'
          git push origin HEAD:agent/icloud-identity-simplify
