name: Verify iCloud mobile layout release

on:
  push:
    branches:
      - verify/icloud-minimum-history-20260926

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f11bc277c479108f4b6609dd925babf384cf9d5f
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          check-latest: false
      - name: Install locked validation dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify canonical production against merged release
        working-directory: tools/icloud_price_comparison
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production-deployment.mjs \
            --expected-data-dir data \
            --run-id "$GITHUB_RUN_ID" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --max-wait-ms 300000 \
            --interval-ms 5000
          cat "$GITHUB_STEP_SUMMARY"
