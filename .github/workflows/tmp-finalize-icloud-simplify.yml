name: Temporary finalize iCloud simplification

on:
  push:
    branches:
      - agent/icloud-simplify-market-identity
    paths:
      - '.github/workflows/tmp-finalize-icloud-simplify.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-simplify-market-identity
      - name: Apply final review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tools/icloud_price_comparison/test/update-prices.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          test_path.write_text(text.rstrip() + '\n', encoding='utf-8')

          updater_path = Path('tools/icloud_price_comparison/scripts/update-prices.mjs')
          text = updater_path.read_text(encoding='utf-8')
          old = """        const message = `sourceName=${warning.sourceName}; generatedMarketId=${warning.generatedMarketId}; region=${warning.region}; currency=${warning.currency}; requires registry review`;
                  console.log(`::warning title=Unknown Apple market requires registry review::${escapeGitHubCommandMessage(message)}`);"""
          new = """        const message = `sourceName=${warning.sourceName}; generatedMarketId=${warning.generatedMarketId}; region=${warning.region}; currency=${warning.currency}; published with permanent fallback identity; review Apple source naming if an alias is needed`;
                  console.log(`::warning title=Unknown Apple market published with fallback identity::${escapeGitHubCommandMessage(message)}`);"""
          if old not in text:
              raise SystemExit('Expected unknown-market warning block was not found')
          updater_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/tmp-finalize-icloud-simplify.yml
      - name: Commit cleanup
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows/tmp-finalize-icloud-simplify.yml tools/icloud_price_comparison/test/update-prices.test.mjs tools/icloud_price_comparison/scripts/update-prices.mjs
          git commit -m 'Finish market identity simplification review'
          git push origin HEAD:agent/icloud-simplify-market-identity
