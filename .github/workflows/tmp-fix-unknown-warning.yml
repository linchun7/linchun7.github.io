name: Temporary refine unknown-market warning

on:
  push:
    branches:
      - agent/icloud-simplify-market-identity
    paths:
      - '.github/workflows/tmp-fix-unknown-warning.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-simplify-market-identity
      - name: Refine warning
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/icloud_price_comparison/scripts/update-prices.mjs')
          text = path.read_text(encoding='utf-8')
          old = """        const message = `sourceName=${warning.sourceName}; generatedMarketId=${warning.generatedMarketId}; region=${warning.region}; currency=${warning.currency}; published with permanent fallback identity; review Apple source naming if an alias is needed`;
                  console.log(`::warning title=Unknown Apple market published with fallback identity::${escapeGitHubCommandMessage(message)}`);"""
          new = """        const message = `sourceName=${warning.sourceName}; generatedMarketId=${warning.generatedMarketId}; region=${warning.region}; currency=${warning.currency}; candidate uses permanent fallback identity; normal publication validation still applies; review Apple source naming if an alias is needed`;
                  console.log(`::warning title=Unknown Apple market uses fallback identity::${escapeGitHubCommandMessage(message)}`);"""
          if old not in text:
              raise SystemExit('Expected unknown-market warning block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/tmp-fix-unknown-warning.yml
      - name: Commit cleanup
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows/tmp-fix-unknown-warning.yml tools/icloud_price_comparison/scripts/update-prices.mjs
          git commit -m 'Refine unknown-market fallback warning'
          git push origin HEAD:agent/icloud-simplify-market-identity
