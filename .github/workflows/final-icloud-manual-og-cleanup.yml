name: Final iCloud manual OG cleanup

on:
  push:
    branches:
      - agent/final-og-doc-correction
    paths:
      - .github/workflows/final-icloud-manual-og-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/final-og-doc-correction
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Remove OG-image automation and fix UI-test escaping
        run: |
          git fetch origin main
          git checkout origin/main -- tools/icloud_price_comparison/og-image.png tools/icloud_price_comparison/package.json
          rm -f tools/icloud_price_comparison/test/og-image.test.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/icloud_price_comparison/test/ui-smoke.test.mjs')
          text = path.read_text()
          text = text.replace('\\\\`http://127.0.0.1:\\\\${port}/?tier=12TB\\\\`', '`http://127.0.0.1:${port}/?tier=12TB`')
          text = text.replace('\\\\`http://127.0.0.1:\\\\${port}/\\\\`', '`http://127.0.0.1:${port}/`')
          path.write_text(text)
          PY

      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run core tests
        working-directory: tools/icloud_price_comparison
        run: pnpm test:core

      - name: Commit cleanup
        run: |
          rm .github/workflows/final-icloud-manual-og-cleanup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore: leave social image for manual upload'
          git push origin HEAD:agent/final-og-doc-correction
