name: Temporary tools asset preparation

on:
  pull_request:
    paths:
      - 'tools/icloud_price_comparison/**'
      - '.github/workflows/prepare-tools-review-assets.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: github.head_ref == 'fix/tools-adversarial-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Generate asset references
        run: |
          node tools/icloud_price_comparison/scripts/update-asset-versions.mjs --write
          git diff -- tools/icloud_price_comparison/index.html tools/icloud_price_comparison/script.js tools/icloud_price_comparison/data-contract.js
          sha256sum tools/icloud_price_comparison/index.html tools/icloud_price_comparison/script.js tools/icloud_price_comparison/data-contract.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tools-review-generated-assets
          path: |
            tools/icloud_price_comparison/index.html
            tools/icloud_price_comparison/script.js
            tools/icloud_price_comparison/data-contract.js
          if-no-files-found: error
          retention-days: 3
