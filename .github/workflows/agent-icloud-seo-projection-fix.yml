name: Apply iCloud SEO projection enhancement

on:
  push:
    branches:
      - agent/icloud-seo-country-terms
    paths:
      - .github/workflows/agent-icloud-seo-projection-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-seo-country-terms
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          check-latest: false

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Enhance SEO projection and regression coverage
        shell: python
        run: |
          from pathlib import Path

          renderer = Path('tools/icloud_price_comparison/scripts/render-static-page.mjs')
          text = renderer.read_text(encoding='utf-8')
          old = "    description: `比较 Apple iCloud+ 全球各国家和地区价格，覆盖 ${tiers} 月费，提供当地币价、人民币参考价、最低价排名和价格历史。`,"
          new = "    description: `比较 Apple iCloud+ 全球各国家和地区价格，可查看日本、美国、俄罗斯、土耳其、尼日利亚等市场的 ${tiers} 月费，提供当地币价、人民币参考价、最低价排名和价格历史。`,"
          if text.count(old) != 1:
            raise SystemExit('SEO projection description source did not match exactly once')
          renderer.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tools/icloud_price_comparison/test/render-static-page.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          marker = "\ntest('social metadata points to one valid 1200x630 PNG contract', async () => {"
          if marker not in test_text:
            raise SystemExit('render-static-page test insertion point missing')
          regression = r'''

test('SEO projection keeps curated country intent while tiers remain data-driven', async () => {
  const [html, payload] = await Promise.all([
    readFile(indexUrl, 'utf8'),
    readFile(pricesUrl, 'utf8').then(JSON.parse)
  ]);
  const rendered = renderSeoProjection(html, payload);
  const $ = load(rendered);
  const countryTerms = ['日本', '美国', '俄罗斯', '土耳其', '尼日利亚'];
  const descriptionSelectors = [
    'meta[name="description"]',
    'meta[property="og:description"]',
    'meta[name="twitter:description"]'
  ];
  for (const selector of descriptionSelectors) {
    const text = $(selector).attr('content') ?? '';
    for (const country of countryTerms) assert.ok(text.includes(country), `${selector} must include ${country}`);
    for (const { id } of payload.tiers) assert.ok(text.includes(id), `${selector} must include dynamic tier ${id}`);
  }
  const brandDescription = $('#brandDescription').text();
  for (const country of countryTerms) assert.equal(brandDescription.includes(country), false, 'visible brand copy must remain free of SEO country terms');
});
'''
          test_path.write_text(test_text.replace(marker, regression + marker), encoding='utf-8')

      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Regenerate deterministic static page
        working-directory: tools/icloud_price_comparison
        run: pnpm render:static

      - name: Remove temporary workflow before repository checks
        run: rm .github/workflows/agent-icloud-seo-projection-fix.yml

      - name: Run core checks
        working-directory: tools/icloud_price_comparison
        run: pnpm test:core

      - name: Check clean final diff
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit final SEO projection change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/index.html \
                  tools/icloud_price_comparison/scripts/render-static-page.mjs \
                  tools/icloud_price_comparison/test/render-static-page.test.mjs \
                  .github/workflows/agent-icloud-seo-projection-fix.yml
          git commit -m "Enhance iCloud SEO country projection"
          git push origin HEAD:agent/icloud-seo-country-terms
