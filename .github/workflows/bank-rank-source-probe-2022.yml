name: Patch bank rank 2022 official source

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-source-probe-2022.yml'
      - 'tools/bank_rank/**'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Patch 2022 CBA provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch 2022 provenance and regenerate static metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('tools/bank_rank')
          data_dir = root / 'data'
          exact = 'https://china-cba.net/Index/show/catid/14/id/40979.html'
          archive = 'https://www.china-cba.net/Index/lists/catid/14/p/27.html'
          report_toc = 'https://www.china-cba.net/Uploads/ueditor/file/20220928/6333fcbfc26df.pdf'

          def load(name):
              return json.loads((data_dir / name).read_text(encoding='utf-8'))

          def save(name, obj):
              (data_dir / name).write_text(
                  json.dumps(obj, ensure_ascii=False, separators=(',', ':')),
                  encoding='utf-8',
              )

          rankings = load('rankings.json')
          rankings['datasetVersion'] = '2026-08-20-v3.1'
          rankings['generatedAt'] = '2026-08-20'
          year = next(item for item in rankings['years'] if item['rankingYear'] == 2022)
          year['officialUrl'] = exact
          year['note'] = (
              '中国银行业协会2022年榜单正式详情页 exact URL 已恢复为 id/40979；'
              '协会新闻归档仍记录发布日期为2022-06-17。完整100强继续使用新浪搜索版与Maigoo独立转录逐行交叉核验。'
          )
          save('rankings.json', rankings)

          snapshot = load('source-snapshot.json')
          snapshot['generatedAt'] = '2026-08-20'
          snap_year = next(item for item in snapshot['years'] if item['rankingYear'] == 2022)
          snap_year['officialUrl'] = exact
          save('source-snapshot.json', snapshot)

          verification = load('verification-v4.json')
          verification['auditVersion'] = '2026-08-20-v4.1'
          verification['verifiedAt'] = '2026-08-20'
          audit_year = next(item for item in verification['years'] if item['rankingYear'] == 2022)
          audit_year['status'] = 'verified'
          audit_year['authoritativeSources'] = [
              {
                  'url': exact,
                  'role': '中国银行业协会2022年榜单正式详情页 exact URL；与协会历史归档的同名2022-06-17条目对应。',
                  'grade': 'A1',
              },
              {
                  'url': archive,
                  'role': '协会历史归档稳定保留“2022年中国银行业100强榜单”标题及2022-06-17发布日期，作为详情页冗余官方锚点。',
                  'grade': 'A1',
              },
              {
                  'url': report_toc,
                  'role': '协会《2022年度中国银行业发展报告》官方目录附件，明确将“2022年度中国银行业100强榜单”列为附录2。',
                  'grade': 'A1',
              },
          ]
          audit_year['aggregateChecks'] = [
              '协会历史归档锁定榜单标题与2022-06-17发布日期；协会《2022年度中国银行业发展报告》官方目录再次将该榜单列为附录2。',
              '结构/排序/SHA及正式机构构成由validator锁定；完整100行继续由新浪搜索版与Maigoo独立完整表逐行交叉。',
          ]
          audit_year['limitations'] = [
              '协会正式详情页 exact URL 已恢复；当前部分自动化运行环境访问 china-cba.net:443 会连接超时，因此保留协会归档页和官方报告目录附件作为冗余官方锚点。该网络可达性问题不再属于历史页面ID缺失。'
          ]
          save('verification-v4.json', verification)

          readme_path = data_dir / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          old = (
              '2017、2022 两个年度目前仍标记为 `verified_with_legacy_primary_gap`：协会历史归档/发布事实可以确认，'
              '但旧详情页或附件无法稳定回查，因此明确记录缺口，不猜测历史页面 ID。两年的正式100行仍通过完整表交叉、'
              '实体连续性、排序/SHA 及可取得的权威材料验证。'
          )
          new = (
              '2017 年目前仍标记为 `verified_with_legacy_primary_gap`：协会历史归档/发布事实可以确认，但旧详情页或附件仍无法稳定回查，'
              '因此继续明确记录缺口，不猜测历史页面 ID。2017 年正式100行仍通过完整表交叉、实体连续性、排序/SHA 及可取得的权威材料验证。\n\n'
              '2022 年的协会正式详情页 exact URL 已恢复为 `https://china-cba.net/Index/show/catid/14/id/40979.html`，并由协会历史归档中的同名条目与 '
              '《2022年度中国银行业发展报告》官方目录附件（附录2“2022年度中国银行业100强榜单”）形成冗余官方锚点，因此 V4 状态提升为 `verified`。'
              '需要注意，部分自动化运行环境当前连接 `china-cba.net:443` 会超时；这是网络可达性限制，不再是历史页面 ID 缺失。'
          )
          if old not in readme:
              raise SystemExit('README legacy-gap paragraph not found')
          readme_path.write_text(readme.replace(old, new), encoding='utf-8')
          PY

          python3 tools/bank_rank/scripts/render_static.py
          python3 tools/bank_rank/scripts/validate_data.py
          python3 tools/bank_rank/scripts/validate_verification.py
          python3 tools/bank_rank/scripts/test_future_year.py
          python3 tools/bank_rank/scripts/render_static.py --check
          git diff --check

      - name: Commit patched production evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/bank_rank/data/rankings.json \
            tools/bank_rank/data/source-snapshot.json \
            tools/bank_rank/data/verification-v4.json \
            tools/bank_rank/data/README.md \
            tools/bank_rank/index.html
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'audit(bank-rank): recover 2022 official detail source'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
