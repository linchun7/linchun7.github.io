name: Probe bank rank 2017 official source

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-source-probe-2017.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe CBA 2017 via Bing RSS
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Parse Bing RSS targets and snippets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import html
          import json
          import re
          import ssl
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          ctx = ssl.create_default_context()
          queries = [
              '"2017中国银行业100强榜单" site:china-cba.net',
              '"2017年中国银行业100强榜单" site:china-cba.net',
              '"连续第二年发布" "中国银行业100强榜单" site:china-cba.net',
              '"中国银行业100强榜单" "2017-11" site:china-cba.net',
              '"2017中国银行业100强榜单" "中国银行业协会"',
              '"中国银行业协会研究部" "2017中国银行业100强榜单"',
              '"2017中国银行业100强榜单" "18800"',
              '"2017中国银行业100强榜单" "18799"',
              '"2017中国银行业100强榜单" "18801"',
              'site:china-cba.net/Index/lists/catid/14/p/ "2017-11-11"',
              'site:china-cba.net/Index/lists/catid/14/p/ "2017-11-13"',
          ]

          def fetch(url: str, timeout: float = 20.0):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/rss+xml,application/xml,text/xml,*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                      return r.status, r.geturl(), r.read()
              except Exception as e:
                  return None, url, f'{type(e).__name__}: {e}'.encode()

          def decode(body: bytes):
              for enc in ('utf-8','gb18030','gbk'):
                  try: return body.decode(enc)
                  except UnicodeDecodeError: pass
              return body.decode('utf-8', errors='replace')

          all_items = []
          for q in queries:
              url = 'https://www.bing.com/search?' + urllib.parse.urlencode({'q': q, 'format': 'rss', 'count': 50})
              status, final, body = fetch(url)
              print('RSS_QUERY:', json.dumps({'q':q,'status':status,'final':final}, ensure_ascii=False))
              if status != 200:
                  print('RSS_ERROR:', decode(body)[:600])
                  continue
              text = decode(body)
              try:
                  root = ET.fromstring(text)
              except Exception as e:
                  print('RSS_PARSE_ERROR:', repr(e), text[:800])
                  continue
              items = root.findall('.//item')
              print('RSS_ITEM_COUNT:', len(items))
              for item in items:
                  title = item.findtext('title') or ''
                  link = item.findtext('link') or ''
                  desc = item.findtext('description') or ''
                  row = {'q':q,'title':html.unescape(title),'link':html.unescape(link),'description':html.unescape(desc)}
                  all_items.append(row)
                  if ('银行业100强' in title or '银行业100强' in desc or 'china-cba.net' in link or 'china-cba.net' in desc or '18800' in link or '18800' in desc):
                      print('RSS_ITEM:', json.dumps(row, ensure_ascii=False))

          print('=== CBA URL EXTRACTION ===')
          blobs = '\n'.join(json.dumps(x, ensure_ascii=False) for x in all_items)
          decoded = urllib.parse.unquote(html.unescape(blobs))
          direct_urls = sorted(set(re.findall(r'https?://(?:www\.)?china-cba\.net/Index/(?:show|showw)/[^\s"<>]+', decoded, re.I)))
          ids = sorted(set(re.findall(r'(?:china-cba\.net[^\s"<>]{0,200}?/id/|id/)(\d{4,6})', decoded, re.I)), key=int)
          list_pages = sorted(set(re.findall(r'https?://(?:www\.)?china-cba\.net/Index/lists/catid/14/p/\d+\.html', decoded, re.I)))
          print('DIRECT_CBA_URLS:', json.dumps(direct_urls, ensure_ascii=False))
          print('CBA_IDS:', json.dumps(ids, ensure_ascii=False))
          print('LIST_PAGES:', json.dumps(list_pages, ensure_ascii=False))

          print('=== EXACT CANDIDATE SEARCH ===')
          for candidate in (18798,18799,18800,18801,18802,18803,18804,18805):
              matches = [x for x in all_items if str(candidate) in (x['title'] + x['link'] + x['description'])]
              print('CANDIDATE', candidate, 'MATCHES', len(matches))
              for x in matches[:10]:
                  print(json.dumps(x, ensure_ascii=False))

          print('=== KEYWORD RESULTS WITHOUT CBA URL ===')
          ranked = []
          for x in all_items:
              blob = x['title'] + ' ' + x['description']
              score = 0
              if '2017中国银行业100强榜单' in blob or '2017年中国银行业100强榜单' in blob: score += 10
              if '中国银行业100强榜单' in blob: score += 4
              if '中国银行业协会' in blob: score += 2
              if '核心一级资本' in blob: score += 1
              if score: ranked.append((score,x))
          seen = set()
          for score,x in sorted(ranked, key=lambda t:-t[0]):
              key=(x['title'],x['link'])
              if key in seen: continue
              seen.add(key)
              print('KEYWORD_ITEM score=',score,json.dumps(x, ensure_ascii=False))
              if len(seen) >= 30: break
          PY
