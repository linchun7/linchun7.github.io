name: Probe bank rank 2017 official source

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-source-probe-2017.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe CBA 2017 via alternate fetchers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Jina Reader and search engines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import html
          import json
          import re
          import ssl
          import urllib.parse
          import urllib.request

          IDS = range(18795, 18806)
          TERMS = ('2017中国银行业100强榜单', '2017年中国银行业100强榜单', '中国银行业100强榜单')
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          ctx = ssl.create_default_context()

          def fetch(url: str, timeout: float = 15.0):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                      return r.status, r.geturl(), r.read()
              except Exception as e:
                  return None, url, f'{type(e).__name__}: {e}'.encode()

          def decode(body: bytes) -> str:
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return body.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return body.decode('utf-8', errors='replace')

          def score_text(text: str) -> int:
              score = 0
              for term in TERMS:
                  if term in text:
                      score += 10
              if '100强' in text and '银行业' in text:
                  score += 5
              if '核心一级资本' in text:
                  score += 3
              if '中国工商银行' in text and '中国建设银行' in text:
                  score += 2
              return score

          print('=== JINA READER PER-ID ===')
          reader_targets = []
          for i in IDS:
              for scheme in ('https','http'):
                  for host in ('china-cba.net','www.china-cba.net'):
                      origin = f'{scheme}://{host}/Index/show/catid/14/id/{i}.html'
                      reader_targets.append((i, origin, 'https://r.jina.ai/' + origin))

          reader_hits = []
          def probe_reader(item):
              i, origin, reader = item
              status, final, body = fetch(reader, 20.0)
              text = decode(body)
              return i, origin, reader, status, final, text

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for i, origin, reader, status, final, text in ex.map(probe_reader, reader_targets):
                  s = score_text(text)
                  # Always print compact metadata for the critical gap around 18799-18801.
                  if i in (18798,18799,18800,18801,18802) or s:
                      first = re.sub(r'\s+', ' ', text[:900])
                      print('READER_RESULT:', json.dumps({'id':i,'origin':origin,'status':status,'final':final,'score':s,'first':first}, ensure_ascii=False))
                  if s:
                      reader_hits.append((i, origin, s, text))

          print('READER_HIT_COUNT:', len(reader_hits))
          for i, origin, s, text in reader_hits:
              p_candidates = [text.find(t) for t in TERMS if text.find(t) >= 0]
              p = min(p_candidates) if p_candidates else text.find('100强')
              print('*** READER_HIT:', i, origin, 'score=', s)
              print(re.sub(r'\s+', ' ', text[max(0,p-400):p+2200] if p >= 0 else text[:2200]))

          print('=== SEARCH ENGINE HTML ===')
          queries = [
              '"2017中国银行业100强榜单" site:china-cba.net/Index/show',
              '"2017年中国银行业100强榜单" site:china-cba.net/Index/show',
              '"中国银行业协会" "2017中国银行业100强榜单"',
              '"18800" "中国银行业协会"',
          ]
          engines = []
          for q in queries:
              enc = urllib.parse.quote_plus(q)
              engines.extend([
                  ('bing', q, f'https://www.bing.com/search?q={enc}&count=50'),
                  ('google', q, f'https://www.google.com/search?q={enc}&num=50'),
                  ('baidu', q, f'https://www.baidu.com/s?wd={enc}&rn=50'),
                  ('sogou', q, f'https://www.sogou.com/web?query={enc}&num=50'),
              ])

          def probe_engine(item):
              name, q, url = item
              status, final, body = fetch(url, 20.0)
              text = decode(body)
              return name, q, url, status, final, text

          found_urls = set()
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for name, q, url, status, final, text in ex.map(probe_engine, engines):
                  ids = sorted(set(re.findall(r'(?:china-cba\.net[^\s"<>]{0,120}?/id/|id%2F)(\d{4,6})', text, re.I)))
                  urls = re.findall(r'https?://(?:www\.)?china-cba\.net/Index/show/(?:catid/\d+/)?id/\d+\.html', html.unescape(text), re.I)
                  found_urls.update(urls)
                  snippet_score = score_text(html.unescape(re.sub(r'<[^>]+>', ' ', text)))
                  print('ENGINE_RESULT:', json.dumps({'engine':name,'query':q,'status':status,'ids':ids[:60],'url_hits':urls[:30],'score':snippet_score}, ensure_ascii=False))

          print('FOUND_CBA_URLS:', json.dumps(sorted(found_urls), ensure_ascii=False))
          print('=== SEQUENCE EVIDENCE ===')
          print('KNOWN: id/18799 = 2017-11-11 association-dynamics article')
          print('KNOWN: id/18801 = 2017-11-13 association-dynamics article')
          print('KNOWN: id/18802 = 2017-11-13 speech article (catid 32)')
          print('KNOWN: id/18803 = 2017-11-13 notice (catid 15)')
          print('KNOWN: id/18804 = 2017-11-13 notice (catid 15)')
          print('KNOWN: id/18805 = 2017-11-13 association-dynamics article')
          print('CANDIDATE_GAP: id/18800 is the only integer ID between 18799 and 18801 and is not indexed by current search results')
          PY
