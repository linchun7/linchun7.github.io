name: Probe bank rank 2017 official source

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-source-probe-2017.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe CBA 2017 via historical crawls
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan exact IDs in Common Crawl and Wayback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import gzip
          import html
          import json
          import re
          import ssl
          import urllib.parse
          import urllib.request

          IDS = range(18790, 18811)
          INDEXES = [
              'CC-MAIN-2017-43', 'CC-MAIN-2017-47', 'CC-MAIN-2017-51',
              'CC-MAIN-2018-05', 'CC-MAIN-2018-09', 'CC-MAIN-2018-13',
          ]
          TERMS = ('2017中国银行业100强榜单', '2017年中国银行业100强榜单', '中国银行业100强榜单')
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          ctx = ssl.create_default_context()

          def fetch(url: str, timeout: float = 10.0, headers: dict | None = None):
              h = {'User-Agent': UA, 'Accept': '*/*'}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                      return r.status, r.geturl(), r.read()
              except Exception as e:
                  return None, url, f'{type(e).__name__}: {e}'.encode()

          def decode(body: bytes) -> str:
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return body.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return body.decode('utf-8', errors='replace')

          def inspect_payload(label: str, source_url: str, body: bytes):
              text = decode(body)
              title_m = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
              title = html.unescape(re.sub(r'<[^>]+>', '', title_m.group(1))).strip() if title_m else ''
              score = 0
              for term in TERMS:
                  if term in text or term in title:
                      score += 10
              if '100强' in text and '银行业' in text:
                  score += 5
              if '核心一级资本' in text:
                  score += 3
              if '中国工商银行' in text and '中国建设银行' in text:
                  score += 2
              if score:
                  media = []
                  for attr in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, re.I):
                      low = attr.lower()
                      if any(x in low for x in ('.jpg', '.jpeg', '.png', '.gif', '.pdf', '.xls', '.xlsx', '/upload', '/uploads', '/attached', '/attachment')):
                          media.append(urllib.parse.urljoin(source_url, html.unescape(attr)))
                  plain = re.sub(r'(?is)<script.*?</script>|<style.*?</style>', ' ', text)
                  plain = html.unescape(re.sub(r'(?s)<[^>]+>', ' ', plain))
                  plain = re.sub(r'\s+', ' ', plain)
                  positions = [plain.find(t) for t in TERMS if plain.find(t) >= 0]
                  p = min(positions) if positions else plain.find('100强')
                  print(f'*** CONTENT HIT score={score} {label}')
                  print('SOURCE:', source_url)
                  print('TITLE:', title[:300])
                  print('MEDIA:', json.dumps(list(dict.fromkeys(media))[:80], ensure_ascii=False))
                  print('CONTEXT:', plain[max(0,p-300):p+1800] if p >= 0 else plain[:1800])
              return score, title

          print('=== COMMON CRAWL INDEX LOOKUP ===')
          queries = []
          for idx in INDEXES:
              for i in IDS:
                  for host in ('china-cba.net', 'www.china-cba.net'):
                      original = f'https://{host}/Index/show/catid/14/id/{i}.html'
                      q = f'https://index.commoncrawl.org/{idx}-index?' + urllib.parse.urlencode({'url': original, 'output': 'json'})
                      queries.append((idx, i, original, q))

          records = []
          def query_cc(item):
              idx, i, original, q = item
              status, _, body = fetch(q, 8.0)
              if status != 200:
                  return []
              out = []
              for line in decode(body).splitlines():
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      row = json.loads(line)
                  except Exception:
                      continue
                  row['_index'] = idx
                  row['_candidate_id'] = i
                  row['_query_original'] = original
                  out.append(row)
              return out

          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
              for rows in ex.map(query_cc, queries):
                  records.extend(rows)

          # Deduplicate captures and prioritize successful HTML responses near Nov 2017.
          dedup = {}
          for r in records:
              key = (r.get('filename'), r.get('offset'), r.get('length'))
              dedup[key] = r
          records = list(dedup.values())
          records.sort(key=lambda r: (r.get('_candidate_id', 0), r.get('timestamp', ''), r.get('_index', '')))
          print('CC_RECORD_COUNT:', len(records))
          for r in records:
              print('CC_RECORD:', json.dumps({k:r.get(k) for k in ('_candidate_id','_index','url','timestamp','status','mime','filename','offset','length')}, ensure_ascii=False))

          print('=== COMMON CRAWL WARC CONTENT ===')
          hits = []
          def fetch_warc(r):
              try:
                  offset = int(r['offset']); length = int(r['length'])
                  warc_url = 'https://data.commoncrawl.org/' + r['filename']
                  status, _, raw = fetch(warc_url, 15.0, {'Range': f'bytes={offset}-{offset+length-1}'})
                  if status not in (200, 206):
                      return r, b'', f'http {status}'
                  try:
                      data = gzip.decompress(raw)
                  except Exception:
                      data = raw
                  # Strip WARC and HTTP headers; keeping whole decoded record is harmless for keyword search.
                  return r, data, None
              except Exception as e:
                  return r, b'', f'{type(e).__name__}: {e}'

          # Prefer 2xx HTML and snapshots from late 2017 / early 2018.
          usable = [r for r in records if str(r.get('status','')).startswith('2') and 'html' in str(r.get('mime','html'))]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for r, data, err in ex.map(fetch_warc, usable):
                  if err:
                      print('WARC_ERROR:', r.get('_candidate_id'), r.get('_index'), err)
                      continue
                  score, title = inspect_payload(f"CC id={r.get('_candidate_id')} index={r.get('_index')} ts={r.get('timestamp')}", r.get('url') or r.get('_query_original'), data)
                  if score:
                      hits.append((r, score, title))

          print('CC_HIT_COUNT:', len(hits))
          for r, score, title in sorted(hits, key=lambda x: (-x[1], x[0].get('_candidate_id', 0))):
              print('CC_HIT_SUMMARY:', json.dumps({'id':r.get('_candidate_id'),'index':r.get('_index'),'timestamp':r.get('timestamp'),'url':r.get('url'),'score':score,'title':title}, ensure_ascii=False))

          print('=== WAYBACK EXACT-ID CDX FALLBACK ===')
          wayback_rows = []
          wayback_queries = []
          for i in IDS:
              for host in ('china-cba.net','www.china-cba.net'):
                  original = f'https://{host}/Index/show/catid/14/id/{i}.html'
                  q = 'https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode({
                      'url': original, 'from':'2017', 'to':'2019', 'output':'json',
                      'filter':'statuscode:200', 'fl':'timestamp,original,statuscode,digest', 'limit':'20'
                  })
                  wayback_queries.append((i, original, q))

          def query_wb(item):
              i, original, q = item
              status, _, body = fetch(q, 8.0)
              if status != 200:
                  return []
              try:
                  data = json.loads(decode(body))
              except Exception:
                  return []
              return [(i, row) for row in data[1:]] if data and isinstance(data[0], list) else []

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              for rows in ex.map(query_wb, wayback_queries):
                  wayback_rows.extend(rows)
          print('WAYBACK_EXACT_COUNT:', len(wayback_rows))
          for i, row in wayback_rows:
              print('WAYBACK_EXACT:', i, row)

          if not hits:
              print('NO_CONTENT_HIT: no archived page in scanned IDs contained the ranking terms')
          PY
