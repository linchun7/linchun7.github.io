name: Probe bank rank 2017 official source

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-source-probe-2017.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe CBA 2017 detail page
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan direct IDs and web archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import html
          import json
          import re
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request

          IDS = range(18770, 18831)
          TERMS = ('2017中国银行业100强榜单', '2017年中国银行业100强榜单', '中国银行业100强榜单')
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          ctx = ssl.create_default_context()

          def fetch(url: str, timeout: float = 4.0):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                      body = r.read(2_000_000)
                      return r.status, r.geturl(), body
              except Exception as e:
                  return None, url, f'{type(e).__name__}: {e}'.encode()

          def decode(body: bytes) -> str:
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return body.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return body.decode('utf-8', errors='replace')

          def summarize(prefix: str, url: str, status, final_url: str, body: bytes):
              if status is None:
                  return None
              text = decode(body)
              title_m = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
              title = ''
              if title_m:
                  title = html.unescape(re.sub(r'<[^>]+>', '', title_m.group(1))).strip()
              hit = any(term in text or term in title for term in TERMS)
              date_hits = sorted(set(re.findall(r'2017[-年/.](?:0?9|10|11|12)[-月/.]\d{1,2}', text)))[:10]
              if hit or ('100强' in text and '银行业' in text):
                  media = []
                  for attr in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, re.I):
                      low = attr.lower()
                      if any(x in low for x in ('.jpg', '.jpeg', '.png', '.gif', '.pdf', '.xls', '.xlsx', '/upload', '/uploads', '/attached', '/attachment')):
                          media.append(urllib.parse.urljoin(final_url, html.unescape(attr)))
                  print(f'*** HIT {prefix} status={status} url={url} final={final_url}')
                  print('TITLE:', title[:300])
                  print('DATE_HITS:', date_hits)
                  print('MEDIA:', json.dumps(list(dict.fromkeys(media))[:40], ensure_ascii=False))
                  plain = re.sub(r'(?is)<script.*?</script>|<style.*?</style>', ' ', text)
                  plain = html.unescape(re.sub(r'(?s)<[^>]+>', ' ', plain))
                  plain = re.sub(r'\s+', ' ', plain)
                  p = max(plain.find(term) for term in TERMS)
                  if p < 0:
                      p = plain.find('100强')
                  print('CONTEXT:', plain[max(0,p-220):p+1200] if p >= 0 else plain[:1200])
                  return {'url': url, 'final': final_url, 'title': title}
              return None

          print('=== DIRECT SITE SCAN 18770..18830 ===')
          direct_urls = []
          for i in IDS:
              direct_urls.extend([
                  f'https://www.china-cba.net/Index/show/catid/14/id/{i}.html',
                  f'https://china-cba.net/Index/show/catid/14/id/{i}.html',
                  f'http://www.china-cba.net/Index/show/catid/14/id/{i}.html',
                  f'http://china-cba.net/Index/show/catid/14/id/{i}.html',
              ])

          direct_hits = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              futures = {ex.submit(fetch, url, 3.0): url for url in direct_urls}
              for fut in concurrent.futures.as_completed(futures):
                  url = futures[fut]
                  status, final_url, body = fut.result()
                  hit = summarize('DIRECT', url, status, final_url, body)
                  if hit:
                      direct_hits.append(hit)
          print('DIRECT_HIT_COUNT:', len(direct_hits))

          print('=== WAYBACK CDX DISCOVERY ===')
          cdx_urls = [
              'https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode({
                  'url': 'www.china-cba.net/Index/show/catid/14/id/*',
                  'from': '2017', 'to': '2019', 'output': 'json',
                  'filter': 'statuscode:200', 'fl': 'timestamp,original,statuscode,digest',
                  'collapse': 'urlkey', 'limit': '5000',
              }),
              'https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode({
                  'url': 'china-cba.net/Index/show/catid/14/id/*',
                  'from': '2017', 'to': '2019', 'output': 'json',
                  'filter': 'statuscode:200', 'fl': 'timestamp,original,statuscode,digest',
                  'collapse': 'urlkey', 'limit': '5000',
              }),
          ]
          rows = []
          for u in cdx_urls:
              status, _, body = fetch(u, 15.0)
              print('CDX_STATUS:', status, u)
              if status != 200:
                  print('CDX_ERROR:', decode(body)[:500])
                  continue
              try:
                  data = json.loads(decode(body))
              except Exception as e:
                  print('CDX_PARSE_ERROR:', e, decode(body)[:500])
                  continue
              if data and isinstance(data[0], list):
                  rows.extend(data[1:])

          candidates = []
          seen = set()
          for row in rows:
              if len(row) < 2:
                  continue
              ts, original = row[0], row[1]
              m = re.search(r'/id/(\d+)\.html', original)
              if not m:
                  continue
              i = int(m.group(1))
              if 18740 <= i <= 18860:
                  key = (i, original)
                  if key in seen:
                      continue
                  seen.add(key)
                  candidates.append((i, ts, original))
          candidates.sort()
          print('CDX_NEARBY_COUNT:', len(candidates))
          for item in candidates:
              print('CDX_CANDIDATE:', item)

          print('=== WAYBACK SNAPSHOT CONTENT SCAN ===')
          archive_hits = []
          def fetch_archive(item):
              i, ts, original = item
              archive = f'https://web.archive.org/web/{ts}id_/{original}'
              status, final_url, body = fetch(archive, 10.0)
              return item, archive, status, final_url, body

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              futures = [ex.submit(fetch_archive, item) for item in candidates]
              for fut in concurrent.futures.as_completed(futures):
                  item, archive, status, final_url, body = fut.result()
                  hit = summarize('WAYBACK', archive, status, final_url, body)
                  if hit:
                      archive_hits.append((item, hit))
          print('WAYBACK_HIT_COUNT:', len(archive_hits))
          for item, hit in archive_hits:
              print('WAYBACK_HIT:', item, hit)

          print('=== KNOWN NEIGHBOR SANITY ===')
          for i in (18798, 18799, 18800, 18801, 18802, 18803, 18804, 18805):
              print('NEIGHBOR_ID:', i)
          PY
