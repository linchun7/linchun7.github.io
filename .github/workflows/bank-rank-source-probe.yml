name: Bank rank historical digest probe

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report yearly digests and totals
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('tools/bank_rank/data/years')
          for year in range(2016, 2026):
              path = root / f'{year}.json'
              rows = json.loads(path.read_text(encoding='utf-8'))
              raw = json.dumps(rows, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              print(json.dumps({
                  'year': year,
                  'rows': len(rows),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'coreTier1Capital': round(sum(float(r['coreTier1Capital']) for r in rows), 2),
                  'assets': round(sum(float(r['assets']) for r in rows), 2),
                  'netProfit': round(sum(float(r['netProfit']) for r in rows), 2),
              }, ensure_ascii=False))
          PY
