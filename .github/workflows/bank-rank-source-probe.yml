name: Bank rank 2018 source probe

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch 2018 text mirrors and original table images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bank-rank-2018

          fetch_optional() {
            url="$1"
            out="$2"
            echo "::group::Fetch $url"
            if curl -fL --retry 2 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0' "$url" -o "$out"; then
              wc -c "$out"
              file "$out" || true
              sha256sum "$out"
            else
              echo "FETCH_FAILED $url"
              rm -f "$out"
            fi
            echo "::endgroup::"
          }

          fetch_optional 'https://resource.emagecompany.com/finance/2018banking100.html' /tmp/bank-rank-2018/emage.html
          fetch_optional 'https://resource.emagecompany.com/big5/finance/2018banking100.html' /tmp/bank-rank-2018/emage-big5.html
          fetch_optional 'https://5b0988e595225.cdn.sohucs.com/images/20190228/d10f13e9b89d4e3683406ec39f580d3c.jpeg' /tmp/bank-rank-2018/table-1.jpeg
          fetch_optional 'https://5b0988e595225.cdn.sohucs.com/images/20190228/dc304fdeb07a4354a6fb734a8afb429c.jpeg' /tmp/bank-rank-2018/table-2.jpeg

          if [[ -f /tmp/bank-rank-2018/emage.html ]]; then
            echo '::group::Emage HTML body'
            cat /tmp/bank-rank-2018/emage.html
            echo '::endgroup::'
          fi
          if [[ -f /tmp/bank-rank-2018/emage-big5.html ]]; then
            echo '::group::Emage Big5 HTML body'
            cat /tmp/bank-rank-2018/emage-big5.html
            echo '::endgroup::'
          fi

      - name: Upload recovered source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bank-rank-2018-source
          path: /tmp/bank-rank-2018/
          if-no-files-found: error
          retention-days: 1
