name: Bank rank legacy URL probe

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve China Banking Association historical links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cba
          seq 20 65 | xargs -P12 -I{} bash -c '
            url="https://www.china-cba.net/Index/lists/catid/14/p/{}.html"
            curl -fsSL --connect-timeout 3 --max-time 8 -A "Mozilla/5.0" "$url" -o "/tmp/cba/{}.html" || true
          '
          grep -RniE -B2 -A2 '2017年中国银行业100强|2018年中国银行业100强|2022年中国银行业100强' /tmp/cba || true
          grep -RhoE 'href="[^"]+"[^>]*>[^<]*(2017年中国银行业100强|2018年中国银行业100强|2022年中国银行业100强)[^<]*' /tmp/cba || true
