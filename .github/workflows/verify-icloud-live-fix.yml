name: Verify iCloud live fix

on:
  push:
    branches:
      - 'fix/icloud-apple-table-pricing-20260916'

permissions:
  contents: read

concurrency:
  group: verify-icloud-live-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live Apple dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 启用并校验 pnpm
        run: |
          corepack enable
          pnpm --version
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 实时只读抓取并验证 Apple
        run: pnpm check:live
      - name: 确认 dry-run 未改写工作树
        working-directory: .
        run: git diff --exit-code
