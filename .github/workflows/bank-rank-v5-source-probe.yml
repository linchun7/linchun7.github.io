name: Build bank rank V5 crosschecks

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-v5-source-probe.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Build source-derived snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pandas lxml requests
          python3 - <<'PY'
          import hashlib, io, json, math
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          from urllib.parse import urlparse
          import pandas as pd
          import requests

          ROOT=Path('tools/bank_rank/data'); OUT=ROOT/'crosschecks'; OUT.mkdir(exist_ok=True)
          SOURCES={
            2016:'https://resource.emagecompany.com/finance/2016banking100.html',
            2017:'https://www.maigoo.com/news/502207.html',
            2018:'https://resource.emagecompany.com/finance/2018banking100.html',
            2019:'https://resource.emagecompany.com/finance/2019banking100.html',
            2020:'https://resource.emagecompany.com/finance/2020banking100.html',
            2021:'https://m.maigoo.com/news/599884.html',
            2022:'https://finance.sina.com.cn/zt_d/2022zgyhy/index.shtml',
            2023:'https://www.maigoo.com/news/684140.html',
            2024:'https://resource.emagecompany.com/finance/2024bank100.html',
            2025:'https://www.cnpp.cn/focus/3527597.html'}
          REASONS={
            (2017,97,'sourceName'):'完整转录将“阜新银行”误写为“埠新银行”；正式银行名称、稳定实体映射及唐山银行官网转载均支持“阜新银行”。',
            (2018,5,'assets'):'公开文本镜像漏写一位；V4已按原始榜单图片校正为90382.54。',
            (2018,7,'coreTier1Capital'):'公开文本镜像转录误差；V4已按原始榜单图片校正为3914.25。',
            (2018,25,'assets'):'公开文本镜像转录误差；V4已按原始榜单图片校正为8020.58。',
            (2018,26,'coreTier1Capital'):'公开文本镜像尾数误差；V4已按原始榜单图片校正为516.05。',
            (2018,33,'assets'):'公开文本镜像漏写一位；V4已按原始榜单图片校正为8333.39。',
            (2018,34,'assets'):'公开文本镜像尾数误差；V4已按原始榜单图片校正为5642.55。',
            (2018,36,'assets'):'公开文本镜像转录误差；V4已按原始榜单图片校正为7055.62。',
            (2018,37,'assets'):'公开文本镜像转录误差；V4已按原始榜单图片校正为5559.40。',
            (2018,39,'sourceName'):'公开文本镜像错误重复“重庆农村商业银行”；V4已按原始榜单图片确认第39名为“重庆银行”。',
            (2018,44,'assets'):'公开文本镜像转录误差；V4已按原始榜单图片校正为4358.29。',
            (2018,57,'assets'):'公开文本镜像尾数误差；V4已按原始榜单图片校正为2708.27。',
            (2018,68,'assets'):'公开文本镜像尾数误差；V4已按原始榜单图片校正为2362.95。',
            (2018,77,'assets'):'公开文本镜像首位误写；V4已按原始榜单图片校正为2139.73。',
            (2018,89,'coreTier1Capital'):'公开文本镜像字符识别错误“1P0.09”；V4已按原始榜单图片校正为120.09。',
            (2019,22,'netProfit'):'完整文本缺失小数点；V4结合宁波银行官方年报校正为112.21。',
            (2019,73,'netProfit'):'完整文本缺失小数点；V4结合银行公开经营数据校正为14.37。',
            (2019,84,'sourceName'):'完整文本机构名称漏字“广东华行银行”；按正式名称及跨年实体校正为“广东华兴银行”。',
            (2019,94,'assets'):'完整文本小数点格式错误“1.642.53”；V4交叉核验为1642.53。',
            (2021,36,'coreTier1Capital'):'完整文本漏小数点43955；按排序、相邻年份和交叉来源校正为439.55。',
            (2021,74,'netProfit'):'完整文本漏负号；V4以年报/权威披露确认蒙商银行净亏损34.94亿元。',
            (2025,71,'sourceName'):'完整转录将“广西北部湾银行”误写为“西北部湾银行”；按正式机构名称和稳定实体校正。'}
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'}

          def ukey(url):
            p=urlparse(url); h=(p.hostname or '').lower(); h=h[4:] if h.startswith('www.') else h
            return h,p.path.rstrip('/') or '/',p.query
          v4=json.loads((ROOT/'verification-v4.json').read_text(encoding='utf-8'))
          grades={(y['rankingYear'],ukey(s['url'])):s['grade'] for y in v4['years'] for s in y['completeTableCrossChecks']}
          banks=json.loads((ROOT/'banks.json').read_text(encoding='utf-8'))
          name_to_id={n:b['id'] for b in banks for n in [b['name'],*b.get('aliases',[])]}

          def dec(v):
            if v is None:return None
            s=str(v).strip().replace(',','').replace('，','')
            if not s or s.lower()=='nan':return None
            neg=s.startswith('(') and s.endswith(')'); s=s[1:-1].strip() if neg else s
            try:d=Decimal(s); return -d if neg else d
            except InvalidOperation:return None
          def raw(v):
            if v is None or (isinstance(v,float) and math.isnan(v)):return None
            s=str(v).strip(); d=dec(s)
            if d is None:return s
            return int(d) if d==d.to_integral() else float(d)
          def rank(v):
            d=dec(v)
            if d is None:return None
            i=int(d); return i if d==i and 1<=i<=100 else None
          def same(a,b):
            da,db=dec(a),dec(b)
            return da==db if da is not None and db is not None else str(a).strip()==str(b).strip()
          def table(content):
            good=[]
            for t in pd.read_html(io.BytesIO(content)):
              rows=[list(r.values) for _,r in t.iterrows() if rank(list(r.values)[0]) is not None]
              if len(rows)==100 and min(map(len,rows))>=4:good.append((max(map(len,rows)),rows))
            if not good:raise RuntimeError('no exact 100-row source table')
            return sorted(good,reverse=True,key=lambda x:x[0])[0][1]

          seen=set()
          for year,url in SOURCES.items():
            resp=requests.get(url,headers=headers,timeout=25); resp.raise_for_status(); rows=table(resp.content)
            prod=json.loads((ROOT/'years'/f'{year}.json').read_text(encoding='utf-8'))
            fields=['rank','sourceName','coreTier1Capital','assets']+(['netProfit'] if len(rows[0])>=5 else [])
            records=[]; resolved=[]
            for row_no,(src,p) in enumerate(zip(rows,prod),1):
              rec={'rank':rank(src[0]),'sourceName':str(src[1]).strip(),'coreTier1Capital':raw(src[2]),'assets':raw(src[3])}
              if 'netProfit' in fields:rec['netProfit']=raw(src[4])
              records.append(rec)
              checks=[('rank',rec['rank'],p['rank'])]
              if name_to_id.get(rec['sourceName']) != p['bankId']:
                checks.append(('sourceName',rec['sourceName'],p['sourceName']))
              for f in ('coreTier1Capital','assets','netProfit'):
                if f in fields:checks.append((f,rec[f],p[f]))
              for field,sv,pv in checks:
                equal=(sv==pv) if field in ('rank','sourceName') else same(sv,pv)
                if equal:continue
                key=(year,row_no,field); seen.add(key); reason=REASONS.get(key)
                if not reason:raise RuntimeError(f'UNEXPLAINED {key}: {sv!r} != {pv!r}')
                resolved.append({'row':row_no,'rank':p['rank'],'field':field,'sourceValue':sv,'productionValue':pv,'reason':reason})
            missing=[f for f in ('rank','sourceName','coreTier1Capital','assets','netProfit') if f not in fields]
            supplemental=[]
            if year==2018 and missing==['netProfit']:
              supplemental=[{'field':'netProfit','verifiedRows':100,'machineReadable':False,'sourceUrl':'https://www.sohu.com/a/298193321_355066','grade':'B1','method':'V4逐行回看原始榜单图片；公开文本镜像没有净利润列。'}]
            elif missing:raise RuntimeError(f'{year}: uncovered fields {missing}')
            grade=grades.get((year,ukey(url)))
            if not grade:raise RuntimeError(f'{year}: crosscheck URL not anchored in V4')
            snap={'schemaVersion':1,'rankingYear':year,'capturedAt':'2026-08-20','source':{'url':url,'grade':grade,'captureMethod':'GitHub-hosted runner HTML table normalization','sourceContentSha256':hashlib.sha256(resp.content).hexdigest()},'availableFields':fields,'records':records,'resolvedDifferences':resolved,'supplementalCoverage':supplemental}
            (OUT/f'{year}.json').write_text(json.dumps(snap,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
            print(year,'rows',len(records),'resolved',len(resolved))
          if seen!=set(REASONS):raise RuntimeError(f'allow-list drift missing={sorted(set(REASONS)-seen)} extra={sorted(seen-set(REASONS))}')
          print('V5 snapshots built: 10 years / 1000 source rows /',len(seen),'resolved source differences')
          PY
          git diff --check

      - name: Commit generated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/bank_rank/data/crosschecks/2016.json tools/bank_rank/data/crosschecks/2017.json tools/bank_rank/data/crosschecks/2018.json tools/bank_rank/data/crosschecks/2019.json tools/bank_rank/data/crosschecks/2020.json tools/bank_rank/data/crosschecks/2021.json tools/bank_rank/data/crosschecks/2022.json tools/bank_rank/data/crosschecks/2023.json tools/bank_rank/data/crosschecks/2024.json tools/bank_rank/data/crosschecks/2025.json
          git commit -m 'audit(bank-rank): freeze V5 source crosschecks'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
