name: TEMP refresh iCloud asset versions

on:
  push:
    branches:
      - fix/icloud-zh-market-monitor-v2

permissions:
  contents: write

concurrency:
  group: temp-refresh-icloud-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 安装依赖并刷新哈希
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm assets:update
      - name: 删除临时脚手架并检查差异
        shell: bash
        run: |
          rm -f .github/workflows/temp-refresh-icloud-assets.yml
          git diff --check
          git diff --cached --check
      - name: 提交哈希联动更新
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore: refresh iCloud asset versions"
          git push origin HEAD:fix/icloud-zh-market-monitor-v2
