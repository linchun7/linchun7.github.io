name: Validate static tools

on:
  pull_request:
    paths:
      - '.github/workflows/validate-static-tools.yml'
      - 'tools/index.html'
      - 'tools/scripts.js'
      - 'tools/styles.css'
      - 'tools/css/**'
      - 'tools/translation_benchmark/**'
      - 'tools/myip/**'
      - 'tools/financial_calculator/**'
      - 'tools/renovation_calculator/**'
      - 'tools/rmb_converter/**'
      - 'tools/space/**'
      - 'tools/card_number/**'
      - 'tools/card_number_new/**'
      - 'tools/pinyin/**'
      - 'tools/hospital_rank/**'
      - 'tools/bank_rank/**'
      - 'tools/vendor/**'
      - 'tools/browser-tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-static-tools.yml'
      - 'tools/index.html'
      - 'tools/scripts.js'
      - 'tools/styles.css'
      - 'tools/css/**'
      - 'tools/translation_benchmark/**'
      - 'tools/myip/**'
      - 'tools/financial_calculator/**'
      - 'tools/renovation_calculator/**'
      - 'tools/rmb_converter/**'
      - 'tools/space/**'
      - 'tools/card_number/**'
      - 'tools/card_number_new/**'
      - 'tools/pinyin/**'
      - 'tools/hospital_rank/**'
      - 'tools/bank_rank/**'
      - 'tools/vendor/**'
      - 'tools/browser-tests/**'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      run_updates:
        description: 检查并发布 pinyin-pro / Nzh / Pangu.js 更新
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: validate-static-tools-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.run_updates)
    name: 静态工具浏览器测试 (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 运行静态依赖更新器单元测试
        run: node --test tools/vendor/update-static-vendors.test.mjs

      - name: 安装浏览器测试依赖
        working-directory: tools/browser-tests
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: 安装 ${{ matrix.browser }}
        working-directory: tools/browser-tests
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: 运行 ${{ matrix.browser }} 兼容性测试
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/static-tools-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          node tools/browser-tests/static-tools-smoke.mjs
          node tools/browser-tests/card-number-core-test.mjs
          node tools/browser-tests/card-number-old-smoke.mjs
          node tools/browser-tests/card-number-new-smoke.mjs
          node tools/browser-tests/pinyin-smoke.mjs
          node tools/browser-tests/utility-tools-smoke.mjs
          python3 tools/hospital_rank/scripts/validate_data.py
          node tools/browser-tests/hospital-rank-smoke.mjs
          node tools/browser-tests/bank-rank-smoke.mjs

      - name: 检查差异格式
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD

  update-pinyin-pro:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_updates)
    name: 检查并验证 pinyin-pro 更新
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 检出 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: 记录生成基线
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 检查最新稳定版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's#.*pinyin-pro@\([^/"[:space:]]*\)/dist/index\.js.*#\1#p' tools/pinyin/index.html | head -n 1)"
          latest="$(npm view pinyin-pro version)"

          if [[ -z "$current" || -z "$latest" ]]; then
            echo '无法解析当前或最新 pinyin-pro 版本' >&2
            exit 1
          fi

          node - "$current" "$latest" <<'NODE'
          const [current, latest] = process.argv.slice(2);
          const pattern = /^(\d+)\.(\d+)\.(\d+)$/;
          const parse = (value, label) => {
            const match = value.match(pattern);
            if (!match) throw new Error(`${label} 必须是稳定 X.Y.Z 版本：${value}`);
            return match.slice(1).map(Number);
          };
          const compare = (left, right) => {
            for (let i = 0; i < 3; i += 1) {
              if (left[i] !== right[i]) return left[i] - right[i];
            }
            return 0;
          };
          const direction = compare(parse(latest, 'latest'), parse(current, 'current'));
          if (direction < 0) throw new Error(`拒绝 pinyin-pro 降级：${current} -> ${latest}`);
          NODE

          echo "当前版本: $current"
          echo "最新版本: $latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [[ "$current" == "$latest" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s#pinyin-pro@${current}/dist/index.js#pinyin-pro@${latest}/dist/index.js#" tools/pinyin/index.html
          grep -F "pinyin-pro@${latest}/dist/index.js" tools/pinyin/index.html >/dev/null
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: 安装浏览器测试依赖
        if: steps.version.outputs.changed == 'true'
        working-directory: tools/browser-tests
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: 安装三浏览器
        if: steps.version.outputs.changed == 'true'
        working-directory: tools/browser-tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 验证候选版本
        if: steps.version.outputs.changed == 'true'
        env:
          BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinyin-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          for browser in chromium firefox webkit; do
            echo "验证 $browser"
            PLAYWRIGHT_BROWSER="$browser" node tools/browser-tests/pinyin-smoke.mjs
          done

          git diff --check

      - name: 提交通过验证的版本
        if: steps.version.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "::error title=main 已在测试期间前进::本次不发布，下一次定时任务会基于最新 main 重新检查。"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pinyin/index.html
          git commit -m "chore(pinyin): update pinyin-pro to ${LATEST}"

          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:main

  update-static-vendor:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_updates)) }}
    needs: update-pinyin-pro
    name: 检查并验证 ${{ matrix.name }} 更新
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - vendor: nzh
            name: Nzh
            target: tools/rmb_converter/dist/nzh.min.js
            commit_message: 'chore(rmb): update Nzh vendor'
          - vendor: pangu
            name: Pangu.js
            target: tools/space/dist/browser/pangu.min.js
            commit_message: 'chore(space): update Pangu.js vendor'

    steps:
      - name: 检出最新 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: 记录生成基线
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 检查最新版并验证候选结构
        run: node tools/vendor/update-static-vendors.mjs --vendor '${{ matrix.vendor }}'

      - name: 判断是否有新版本
        id: changes
        env:
          TARGET: ${{ matrix.target }}
          VENDOR_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only)
          if [[ -z "$changed_files" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${VENDOR_NAME} 已是当前最新版。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$changed_files" != "$TARGET" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed_files"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: 安装浏览器测试依赖
        if: steps.changes.outputs.changed == 'true'
        working-directory: tools/browser-tests
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: 安装三浏览器
        if: steps.changes.outputs.changed == 'true'
        working-directory: tools/browser-tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 在真实浏览器中验证候选版本
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_URL: http://127.0.0.1:4173
          STATIC_VENDOR: ${{ matrix.vendor }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/static-vendor-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          for browser in chromium firefox webkit; do
            echo "验证 ${{ matrix.name }} / $browser"
            PLAYWRIGHT_BROWSER="$browser" node tools/browser-tests/static-vendor-smoke.mjs
          done

          git diff --check

      - name: 提交通过验证的版本
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          COMMIT_MESSAGE: ${{ matrix.commit_message }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "::error title=main 已在测试期间前进::本次不发布，下一次定时任务会基于最新 main 重新检查。"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m "$COMMIT_MESSAGE"

          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:main

  production-contract:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_updates)) }}
    needs:
      - update-pinyin-pro
      - update-static-vendor
    name: 验证静态依赖与 MyIP 生产契约
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: 检出最新 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: 等待并验证生产资源
        shell: bash
        run: |
          set -euo pipefail
          pinyin_version="$(sed -n 's#.*pinyin-pro@\([^/"[:space:]]*\)/dist/index\.js.*#\1#p' tools/pinyin/index.html | head -n 1)"
          expected_nzh="$(sha256sum tools/rmb_converter/dist/nzh.min.js | cut -d' ' -f1)"
          expected_pangu="$(sha256sum tools/space/dist/browser/pangu.min.js | cut -d' ' -f1)"

          check_once() {
            rm -rf "$RUNNER_TEMP/static-production-contract"
            mkdir -p "$RUNNER_TEMP/static-production-contract"
            cd "$RUNNER_TEMP/static-production-contract"

            curl --fail --silent --show-error --location --max-time 15 \
              https://www.linchun.com.cn/tools/rmb_converter/dist/nzh.min.js -o nzh.min.js || return 1
            curl --fail --silent --show-error --location --max-time 15 \
              https://www.linchun.com.cn/tools/space/dist/browser/pangu.min.js -o pangu.min.js || return 1
            curl --fail --silent --show-error --location --max-time 15 \
              https://www.linchun.com.cn/tools/pinyin/ -o pinyin.html || return 1
            curl --fail --silent --show-error --location --max-time 15 \
              "https://cdn.jsdelivr.net/npm/pinyin-pro@${pinyin_version}/dist/index.js" -o pinyin-pro.js || return 1

            [[ "$(sha256sum nzh.min.js | cut -d' ' -f1)" == "$expected_nzh" ]] || return 1
            [[ "$(sha256sum pangu.min.js | cut -d' ' -f1)" == "$expected_pangu" ]] || return 1
            grep -F "pinyin-pro@${pinyin_version}/dist/index.js" pinyin.html >/dev/null || return 1
            [[ "$(wc -c < pinyin-pro.js)" -gt 1000 ]] || return 1

            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Origin: https://www.linchun.com.cn' \
              https://myip.cfw3.workers.dev/healthz -o myip-health.json || return 1
            curl --fail --silent --show-error --location --max-time 15 \
              -H 'Origin: https://www.linchun.com.cn' \
              https://myip.cfw3.workers.dev/v1/ip -o myip-ip.json || return 1
            node -e "const fs=require('node:fs'); const health=JSON.parse(fs.readFileSync('myip-health.json','utf8')); const probe=JSON.parse(fs.readFileSync('myip-ip.json','utf8')); if(health.ok!==true||health.service!=='linchun-myip-probe') process.exit(1); if(probe.schemaVersion!==1||probe.role!=='international-first-party'||typeof probe.ip!=='string'||!probe.ip) process.exit(1);" || return 1
          }

          for attempt in $(seq 1 30); do
            if check_once; then
              echo "生产契约已验证（第 ${attempt} 次）。"
              exit 0
            fi
            echo "生产资源尚未同步或外部契约暂不可用（第 ${attempt}/30 次），10 秒后重试。"
            sleep 10
          done

          echo "::error title=生产契约验证失败::GitHub Pages/Cloudflare 静态资源或 MyIP Worker 与当前契约不一致。"
          exit 1