name: Temporary docs PR 39

on:
  push:
    branches:
      - agent/icloud-simplify-market-identity

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run PR 39 docs repair'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync search contract documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tools/icloud_price_comparison/README.md'): (
                  "- 搜索对 `marketId`、人工维护的 search alias、中英文国家/地区名称和地区名称使用部分字符串匹配；完整 `marketId` 命中优先级最高，完整 search alias 次之，但都不排除其他合法部分匹配；币种仅按完整代码匹配，避免短字母把同币种市场全部带出。",
                  "- 搜索对 `marketId`、人工维护的 search alias、中英文国家/地区名称使用部分字符串匹配；地区名称仅在搜索词至少 2 个字符时参与部分匹配，避免单字（例如“中”）误命中“欧洲、中东和非洲”等地区标签；完整 `marketId` 命中优先级最高，完整 search alias 次之，但都不排除其他合法部分匹配；币种仅按完整代码匹配，避免短字母把同币种市场全部带出。",
              ),
              Path('tools/icloud_price_comparison/OPERATIONS.md'): (
                  "- 搜索对 `marketId`、`MARKET_SEARCH_ALIASES`、中英文国家/地区名和地区名做部分匹配；完整 `marketId` 优先级最高，完整 search alias 次之，均不排除其他部分匹配；币种只按完整代码匹配。",
                  "- 搜索对 `marketId`、`MARKET_SEARCH_ALIASES`、中英文国家/地区名做部分匹配；地区名仅在搜索词至少 2 个字符时参与部分匹配，防止单字误命中整片分区；完整 `marketId` 优先级最高，完整 search alias 次之，均不排除其他部分匹配；币种只按完整代码匹配。",
              ),
          }

          for path, (old, new) in replacements.items():
              source = path.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'documentation anchor not found: {path}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/temporary-docs-pr39.yml
          git diff --check

      - name: Validate core contract
        working-directory: tools/icloud_price_comparison
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test:core

      - name: Commit documentation repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Document iCloud region search guard'
          git push origin HEAD:${{ github.ref_name }}
