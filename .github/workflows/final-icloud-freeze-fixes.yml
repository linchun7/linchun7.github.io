name: Final iCloud freeze fixes

on:
  push:
    branches:
      - agent/final-og-doc-correction
    paths:
      - .github/workflows/final-icloud-freeze-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/final-og-doc-correction
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Apply final freeze-stage patches
        run: |
          python - <<'PY'
          from pathlib import Path

          project = Path('tools/icloud_price_comparison')

          style_path = project / 'style.css'
          style = style_path.read_text()
          old = 'html { background: var(--page); }'
          new = 'html { background: var(--page); scrollbar-gutter: stable; }'
          if old not in style and new not in style:
              raise SystemExit('html background rule not found')
          style = style.replace(old, new, 1)

          old_media = '@media (min-width: 1101px) {\n  .loading-cell { height: max(400px, calc(100dvh - 500px)); }'
          new_media = '@media (min-width: 1101px) {\n  .workspace-toolbar { min-height: 101px; }\n  .loading-cell { height: max(400px, calc(100dvh - 500px)); }'
          if old_media not in style and new_media not in style:
              raise SystemExit('desktop media rule not found')
          style = style.replace(old_media, new_media, 1)

          old_mobile = '  .data-status { width: 100%; font-size: 12px; line-height: 1.3; overflow-wrap: anywhere; white-space: normal; }'
          new_mobile = '  .data-status { width: 100%; justify-content: flex-end; font-size: 12px; line-height: 1.3; overflow-wrap: anywhere; text-align: right; white-space: normal; }'
          if old_mobile not in style and new_mobile not in style:
              raise SystemExit('mobile data-status rule not found')
          style = style.replace(old_mobile, new_mobile, 1)
          style_path.write_text(style)

          operations_path = project / 'OPERATIONS.md'
          operations = operations_path.read_text()
          old_ops = '''- 页面底部应与实际隐私行为一致，当前包含两类信息：
  - “本工具与 Apple Inc. 无关联，数据仅供参考。”
  - “访问统计使用 Google Analytics 和 Cloudflare Web Analytics；站内搜索词不会发送给统计服务。”'''
          new_ops = '''- 页面底部当前只展示“本工具与 Apple Inc. 无关联，数据仅供参考。”及版权信息；不要把 GA4 / Cloudflare Web Analytics 运维说明误写成当前可见 footer 文案。
- GA4 与 Cloudflare Web Analytics 的实际启用状态、隐私边界和检查方法记录在 README/本手册中；若未来要新增用户可见统计披露，应作为明确的产品文案变更，并同步修改页面与 UI 测试。'''
          if old_ops not in operations and new_ops not in operations:
              raise SystemExit('operations footer block not found')
          operations = operations.replace(old_ops, new_ops, 1)
          operations_path.write_text(operations)

          test_path = project / 'test' / 'ui-smoke.test.mjs'
          source = test_path.read_text()
          marker = "test('keeps desktop search filtering free of vertical and scrollbar-gutter layout shifts'"
          if marker not in source:
              source += r'''

test('keeps desktop search filtering free of vertical and scrollbar-gutter layout shifts', { timeout: 30_000 }, async (context) => {
  const browserConfig = await resolveBrowser(context, 'the desktop search layout-stability regression test');
  if (!browserConfig) return;
  const server = await startServer();
  const { port } = server.address();
  const browser = await browserConfig.browserType.launch(browserConfig.launchOptions);
  const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
  await page.route('https://**/*', (route) => route.abort());

  const snapshot = () => page.evaluate(() => {
    const toolbar = document.querySelector('.workspace-toolbar');
    const main = document.querySelector('.page-main');
    return {
      toolbarHeight: toolbar.getBoundingClientRect().height,
      mainLeft: main.getBoundingClientRect().left,
      clientWidth: document.documentElement.clientWidth
    };
  });

  try {
    await page.goto(`http://127.0.0.1:${port}/?tier=12TB`, { waitUntil: 'domcontentloaded' });
    await page.waitForFunction(() => document.querySelectorAll('#priceRows tr[data-market-id]').length > 50);
    const baseline = await snapshot();

    await page.locator('#searchInput').fill('c');
    await page.waitForFunction(() => !document.querySelector('#rankingScopeNote')?.hidden);
    const filtered = await snapshot();
    assert.equal(filtered.toolbarHeight, baseline.toolbarHeight, 'showing the global-ranking note must not push the table downward');
    assert.equal(filtered.mainLeft, baseline.mainLeft, 'showing the global-ranking note must not move the centered page shell');

    await page.locator('#searchInput').fill('cc');
    await page.waitForFunction(() => document.querySelector('#resultSummary')?.textContent?.includes('0 个地区'));
    const empty = await snapshot();
    assert.equal(empty.clientWidth, baseline.clientWidth, 'removing the vertical scrollbar must keep a stable viewport gutter');
    assert.equal(empty.mainLeft, baseline.mainLeft, 'empty search results must not shift the centered page shell horizontally');
    assert.equal(empty.toolbarHeight, baseline.toolbarHeight, 'empty search results must keep the toolbar height stable');
  } finally {
    await browser.close();
  }
});

test('keeps the mobile updated timestamp on the trailing edge', { timeout: 30_000 }, async (context) => {
  const browserConfig = await resolveBrowser(context, 'the mobile header alignment regression test');
  if (!browserConfig) return;
  const server = await startServer();
  const { port } = server.address();
  const browser = await browserConfig.browserType.launch(browserConfig.launchOptions);
  const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
  await page.route('https://**/*', (route) => route.abort());
  try {
    await page.goto(`http://127.0.0.1:${port}/`, { waitUntil: 'domcontentloaded' });
    const alignment = await page.locator('.data-status').evaluate((element) => ({
      justifyContent: getComputedStyle(element).justifyContent,
      textAlign: getComputedStyle(element).textAlign,
      right: element.getBoundingClientRect().right,
      parentRight: element.parentElement.getBoundingClientRect().right
    }));
    assert.equal(alignment.justifyContent, 'flex-end');
    assert.equal(alignment.textAlign, 'right');
    assert.ok(Math.abs(alignment.right - alignment.parentRight) < 1, 'mobile timestamp row should retain the full header width');
  } finally {
    await browser.close();
  }
});
'''
          test_path.write_text(source)
          PY

      - name: Install project dependencies
        working-directory: tools/icloud_price_comparison
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Refresh asset versions and static projection
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm assets:update
          pnpm render:static

      - name: Run core tests
        working-directory: tools/icloud_price_comparison
        run: pnpm test:core

      - name: Remove temporary workflow and commit final patch
        run: |
          rm .github/workflows/final-icloud-freeze-fixes.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'fix: finish iCloud freeze-stage polish'
          git push origin HEAD:agent/final-og-doc-correction
