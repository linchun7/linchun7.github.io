name: Final iCloud freeze fixes

# Temporary branch-only patch runner. It deletes itself and its helper scripts after a successful commit.
on:
  push:
    branches:
      - agent/final-og-doc-correction
    paths:
      - .github/workflows/final-icloud-freeze-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/final-og-doc-correction
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Apply final text and layout patches
        working-directory: tools/icloud_price_comparison
        run: node scripts/apply-final-freeze-fixes.mjs

      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium and Chinese fonts for social-card rendering
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate the final social card with Chromium
        working-directory: tools/icloud_price_comparison
        run: node scripts/generate-final-og-image.mjs

      - name: Refresh generated assets
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm assets:update
          pnpm render:static

      - name: Run core tests
        working-directory: tools/icloud_price_comparison
        run: pnpm test:core

      - name: Commit final patch
        run: |
          rm .github/workflows/final-icloud-freeze-fixes.yml
          rm tools/icloud_price_comparison/scripts/apply-final-freeze-fixes.mjs
          rm tools/icloud_price_comparison/scripts/generate-final-og-image.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'fix: finish iCloud freeze-stage polish'
          git push origin HEAD:agent/final-og-doc-correction
