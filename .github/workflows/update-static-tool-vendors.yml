name: Update static tool vendor scripts

on:
  schedule:
    # 北京时间每周二 02:20 检查一次；仅有新版本时才安装浏览器并测试。
    - cron: '20 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-static-tool-vendors
  cancel-in-progress: false

jobs:
  update:
    name: 检查、测试并发布 Nzh / Pangu.js
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: 记录生成基线
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 检查最新版并运行库级测试
        run: node tools/vendor/update-static-vendors.mjs

      - name: 判断是否有新版本
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(tools/rmb_converter/dist/nzh\.min\.js|tools/space/dist/browser/pangu\.min\.js)$'
          changed_files=$(git diff --name-only)
          if [[ -z "$changed_files" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nzh / Pangu.js 已是当前最新版。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          unexpected=$(printf '%s\n' "$changed_files" | grep -Ev "$allowed" || true)
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: 安装浏览器测试依赖
        if: steps.changes.outputs.changed == 'true'
        working-directory: tools/browser-tests
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: 安装 Chromium / Firefox / WebKit
        if: steps.changes.outputs.changed == 'true'
        working-directory: tools/browser-tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 三浏览器验证真实工具页
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/static-tools-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          for browser in chromium firefox webkit; do
            echo "Testing $browser"
            PLAYWRIGHT_BROWSER="$browser" node tools/browser-tests/utility-tools-smoke.mjs
          done

      - name: 最终差异检查
        if: steps.changes.outputs.changed == 'true'
        run: git diff --check

      - name: 仅发布已测试的两个脚本
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "::error title=main 已在测试期间前进::本次不发布，下一次运行会基于最新 main 重新检查。"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/rmb_converter/dist/nzh.min.js tools/space/dist/browser/pangu.min.js
          git commit -m "chore: update static tool vendor scripts"

          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:main

          {
            echo "## 静态工具依赖已自动升级"
            echo ""
            echo "Nzh / Pangu.js 候选版本已通过库级功能测试及 Chromium、Firefox、WebKit 真实页面测试后发布。"
          } >> "$GITHUB_STEP_SUMMARY"
