name: Patch iCloud artifact history identity 20260916

on:
  push:
    branches:
      - fix/icloud-artifact-history-marketid-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出修复分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 修复 artifact 价格历史身份校验
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('tools/icloud_price_comparison/scripts/validate-data-artifact.mjs')
          text = validator.read_text(encoding='utf-8')
          import_anchor = "} from '../data-contract.js';\n"
          import_replacement = import_anchor + "import { resolveMarket } from './market-registry.mjs';\n"
          if text.count(import_anchor) != 1 or "from './market-registry.mjs'" in text:
              raise SystemExit('unexpected validator import state')
          text = text.replace(import_anchor, import_replacement, 1)

          old = '''function validateHistoryAgainstSnapshotEvidence(history, snapshotIndex, normalizedSnapshots) {
            const expectedByCountry = new Map();
            const actualByCountry = new Map(Object.values(history.markets).map((record) => [record.country, record]));
            for (const snapshot of snapshotIndex.snapshots) {
              for (const revision of snapshot.revisions) {
                const pricing = normalizedSnapshots.get(revision.dataFile);
                for (const country of pricing.countries) {
                  const expectedEvents = expectedByCountry.get(country.country) ?? [];
                  const event = {
                    observedAt: snapshot.publishedDate,
                    currency: country.currency,
                    plans: country.plans
                  };
                  const previous = expectedEvents.at(-1);
                  if (!previous || previous.currency !== event.currency || !samePlans(previous.plans, event.plans)) {
                    expectedEvents.push(event);
                  }
                  expectedByCountry.set(country.country, expectedEvents);
                }
              }
            }

            for (const [countryName, expectedEvents] of expectedByCountry) {
              const actualEvents = actualByCountry.get(countryName)?.events;
              if (!Array.isArray(actualEvents) || actualEvents.length !== expectedEvents.length) {
                fail(`history events do not match snapshot evidence for ${countryName}`);
              }
              for (let index = 0; index < expectedEvents.length; index += 1) {
                const actual = actualEvents[index];
                const expected = expectedEvents[index];
                if (actual.observedAt !== expected.observedAt
                  || actual.currency !== expected.currency
                  || !samePlans(actual.plans, expected.plans)) {
                  fail(`history events do not match snapshot evidence for ${countryName}`);
                }
              }
            }
            const unexpectedCountries = [...actualByCountry.keys()]
              .filter((countryName) => !expectedByCountry.has(countryName));
            if (unexpectedCountries.length) {
              fail(`history contains countries without snapshot evidence: ${unexpectedCountries.join(', ')}`);
            }
          }'''
          new = '''export function validateHistoryAgainstSnapshotEvidence(history, snapshotIndex, normalizedSnapshots) {
            const expectedByMarketId = new Map();
            const sourceNamesByMarketId = new Map();
            const actualByMarketId = new Map(Object.entries(history.markets));

            for (const [marketId, record] of actualByMarketId) {
              const resolvedId = resolveMarket(record.country).id;
              if (resolvedId !== marketId) {
                fail(`history marketId does not match source identity for ${record.country}: ${marketId} != ${resolvedId}`);
              }
            }

            for (const snapshot of snapshotIndex.snapshots) {
              for (const revision of snapshot.revisions) {
                const pricing = normalizedSnapshots.get(revision.dataFile);
                const seenMarketIds = new Map();
                for (const country of pricing.countries) {
                  const marketId = resolveMarket(country.country).id;
                  const priorSourceName = seenMarketIds.get(marketId);
                  if (priorSourceName && priorSourceName !== country.country) {
                    fail(`snapshot evidence maps multiple source names to marketId ${marketId}: ${priorSourceName}, ${country.country}`);
                  }
                  seenMarketIds.set(marketId, country.country);
                  const sourceNames = sourceNamesByMarketId.get(marketId) ?? new Set();
                  sourceNames.add(country.country);
                  sourceNamesByMarketId.set(marketId, sourceNames);

                  const expectedEvents = expectedByMarketId.get(marketId) ?? [];
                  const event = {
                    observedAt: snapshot.publishedDate,
                    currency: country.currency,
                    plans: country.plans
                  };
                  const previous = expectedEvents.at(-1);
                  if (!previous || previous.currency !== event.currency || !samePlans(previous.plans, event.plans)) {
                    expectedEvents.push(event);
                  }
                  expectedByMarketId.set(marketId, expectedEvents);
                }
              }
            }

            for (const [marketId, expectedEvents] of expectedByMarketId) {
              const actualEvents = actualByMarketId.get(marketId)?.events;
              const sourceNames = [...(sourceNamesByMarketId.get(marketId) ?? [])].join(' / ');
              if (!Array.isArray(actualEvents) || actualEvents.length !== expectedEvents.length) {
                fail(`history events do not match snapshot evidence for marketId ${marketId}${sourceNames ? ` (${sourceNames})` : ''}`);
              }
              for (let index = 0; index < expectedEvents.length; index += 1) {
                const actual = actualEvents[index];
                const expected = expectedEvents[index];
                if (actual.observedAt !== expected.observedAt
                  || actual.currency !== expected.currency
                  || !samePlans(actual.plans, expected.plans)) {
                  fail(`history events do not match snapshot evidence for marketId ${marketId}${sourceNames ? ` (${sourceNames})` : ''}`);
                }
              }
            }
            const unexpectedMarketIds = [...actualByMarketId.keys()]
              .filter((marketId) => !expectedByMarketId.has(marketId));
            if (unexpectedMarketIds.length) {
              fail(`history contains marketIds without snapshot evidence: ${unexpectedMarketIds.join(', ')}`);
            }
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one history validator block, got {text.count(old)}')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_file = Path('tools/icloud_price_comparison/test/validate-data-artifact.test.mjs')
          tests = test_file.read_text(encoding='utf-8')
          import_old = '''  logInline as artifactLogInline,
            validateExtractedDataArtifact,
            validateTarArchive'''
          import_new = '''  logInline as artifactLogInline,
            validateExtractedDataArtifact,
            validateHistoryAgainstSnapshotEvidence,
            validateTarArchive'''
          if tests.count(import_old) != 1:
              raise SystemExit('unexpected validator test import block')
          tests = tests.replace(import_old, import_new, 1)
          marker = "validates snapshot-backed price history by stable marketId across Apple source-name aliases"
          if marker in tests:
              raise SystemExit('regression test already exists')
          tests += '''\n\ntest('validates snapshot-backed price history by stable marketId across Apple source-name aliases', () => {\n  const history = {\n    markets: {\n      ci: {\n        country: \"Cote D'Ivoire\",\n        events: [{ observedAt: '2026-07-17', currency: 'USD', plans: { '50GB': 0.99 } }]\n      }\n    }\n  };\n  const snapshotIndex = {\n    snapshots: [\n      { publishedDate: '2026-07-17', revisions: [{ dataFile: 'old.json' }] },\n      { publishedDate: '2026-09-15', revisions: [{ dataFile: 'new.json' }] }\n    ]\n  };\n  const normalizedSnapshots = new Map([\n    ['old.json', { countries: [{ country: 'Ivory Coast', currency: 'USD', plans: { '50GB': 0.99 } }] }],\n    ['new.json', { countries: [{ country: \"Cote D'Ivoire\", currency: 'USD', plans: { '50GB': 0.99 } }] }]\n  ]);\n\n  assert.doesNotThrow(() => validateHistoryAgainstSnapshotEvidence(history, snapshotIndex, normalizedSnapshots));\n\n  const corrupted = structuredClone(history);\n  corrupted.markets.ci.events[0].plans['50GB'] = 1.99;\n  assert.throws(\n    () => validateHistoryAgainstSnapshotEvidence(corrupted, snapshotIndex, normalizedSnapshots),\n    /history events do not match snapshot evidence/\n  );\n});\n'''
          test_file.write_text(tests, encoding='utf-8')

          docs = {
            Path('tools/icloud_price_comparison/README.md'): (
              '价格历史仍按 `marketId` 连续累计，不因来源 wording 变化而 rekey。',
              '价格历史仍按 `marketId` 连续累计，不因来源 wording 变化而 rekey；完整工件深验同样先把快照 source name 按 registry alias / deterministic identity 解析回 `marketId` 后核对价格事件。'
            ),
            Path('tools/icloud_price_comparison/ARCHITECTURE.md'): (
              '这与价格事件继续归入同一 `marketId` 并不冲突。',
              '这与价格事件继续归入同一 `marketId` 并不冲突。完整 artifact 深验核对价格事件时也必须先把快照 source name 解析回稳定 `marketId`，不能用当前 `record.country` 反向拆分历史。'
            ),
            Path('tools/icloud_price_comparison/OPERATIONS.md'): (
              '同一 `marketId` 可以保持不变，但 publication evidence 仍应显示旧名移除与新名新增。',
              '同一 `marketId` 可以保持不变，但 publication evidence 仍应显示旧名移除与新名新增；价格历史的 artifact 深验必须按解析后的稳定 `marketId` 对齐快照事件。'
            )
          }
          for path, (before, after) in docs.items():
              doc = path.read_text(encoding='utf-8')
              if doc.count(before) != 1:
                  raise SystemExit(f'unexpected doc anchor in {path}: {doc.count(before)}')
              path.write_text(doc.replace(before, after, 1), encoding='utf-8')
          PY

      - name: 运行针对性回归
        run: node --test --test-concurrency=1 tools/icloud_price_comparison/test/validate-data-artifact.test.mjs

      - name: 提交修复并移除一次性工作流
        run: |
          git config user.name linchun7
          git config user.email 104673731+linchun7@users.noreply.github.com
          git add tools/icloud_price_comparison/scripts/validate-data-artifact.mjs tools/icloud_price_comparison/test/validate-data-artifact.test.mjs tools/icloud_price_comparison/README.md tools/icloud_price_comparison/ARCHITECTURE.md tools/icloud_price_comparison/OPERATIONS.md
          git rm .github/workflows/patch-icloud-artifact-history-marketid-20260916.yml
          git commit -m "fix: validate snapshot history by stable market identity"
          git push origin HEAD:fix/icloud-artifact-history-marketid-20260916
