name: Apply search and sequence polish

on:
  push:
    branches:
      - agent/search-sequence-polish
    paths:
      - .github/workflows/agent-search-sequence-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/search-sequence-polish
          fetch-depth: 1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Apply focused patch and regression coverage
        shell: python
        run: |
          from pathlib import Path

          project = Path('tools/icloud_price_comparison')
          script_path = project / 'script.js'
          test_path = project / 'test/ui-smoke.test.mjs'

          script = script_path.read_text(encoding='utf-8')

          old_search = '''function filteredCountries() {
            const query = state.query.trim().toLocaleLowerCase('zh-CN');
            const exactMarketId = query
              ? state.data.countries.find(({ marketId }) => marketId.toLocaleLowerCase('en-US') === query)?.marketId
              : null;
            return state.data.countries.filter((country) => {
              const searchable = `${country.country} ${country.nameZh} ${country.currency} ${REGION_LABELS[country.region] || country.region}`.toLocaleLowerCase('zh-CN');
              const matchesQuery = !query
                || (exactMarketId ? country.marketId === exactMarketId : searchable.includes(query));
              return matchesQuery
                && (state.region === 'all' || country.region === state.region);
            });
          }

          function sortValue(country) {
            if (state.sortKey === 'country') return country.nameZh || country.country;
            return country.plans[state.sortTier].cnyRank ?? Number.POSITIVE_INFINITY;
          }

          function sortedCountries() {
            return filteredCountries().sort((a, b) => {
              const first = sortValue(a);
              const second = sortValue(b);
              const comparison = typeof first === 'string' ? collator.compare(first, second) : first - second;
              if (comparison !== 0) return state.sortDirection === 'asc' ? comparison : -comparison;
              return a.marketId.localeCompare(b.marketId, 'en');
            });
          }
          '''

          new_search = '''function normalizedSearchQuery() {
            return state.query.trim().toLocaleLowerCase('zh-CN');
          }

          function matchesCountrySearch(country, query) {
            if (!query) return true;
            const marketId = country.marketId.toLocaleLowerCase('en-US');
            const namesAndRegion = `${country.country} ${country.nameZh ?? ''} ${REGION_LABELS[country.region] || country.region}`.toLocaleLowerCase('zh-CN');
            const currency = country.currency.toLocaleLowerCase('en-US');
            return marketId.includes(query)
              || namesAndRegion.includes(query)
              || currency === query;
          }

          function filteredCountries() {
            const query = normalizedSearchQuery();
            return state.data.countries.filter((country) => (
              matchesCountrySearch(country, query)
              && (state.region === 'all' || country.region === state.region)
            ));
          }

          function sortValue(country) {
            if (state.sortKey === 'country') return country.nameZh || country.country;
            return country.plans[state.sortTier].cnyRank ?? Number.POSITIVE_INFINITY;
          }

          function sortedCountries() {
            const query = normalizedSearchQuery();
            return filteredCountries().sort((a, b) => {
              const aExactMarketId = query && a.marketId.toLocaleLowerCase('en-US') === query;
              const bExactMarketId = query && b.marketId.toLocaleLowerCase('en-US') === query;
              if (aExactMarketId !== bExactMarketId) return aExactMarketId ? -1 : 1;

              const first = sortValue(a);
              const second = sortValue(b);
              const comparison = typeof first === 'string' ? collator.compare(first, second) : first - second;
              if (comparison !== 0) return state.sortDirection === 'asc' ? comparison : -comparison;
              return a.marketId.localeCompare(b.marketId, 'en');
            });
          }
          '''

          if script.count(old_search) != 1:
            raise SystemExit(f'expected one search block, found {script.count(old_search)}')
          script = script.replace(old_search, new_search)

          old_mobile_rank = "      mobileRank.textContent = String(displayedRank);"
          new_mobile_rank = "      mobileRank.textContent = state.sortKey === 'country' && displayedRank !== '—'\n        ? `序${displayedRank}`\n        : String(displayedRank);"
          if script.count(old_mobile_rank) != 1:
            raise SystemExit(f'expected one mobile rank assignment, found {script.count(old_mobile_rank)}')
          script = script.replace(old_mobile_rank, new_mobile_rank)
          script_path.write_text(script, encoding='utf-8')

          test_source = test_path.read_text(encoding='utf-8')
          marker = "test('prioritizes exact market IDs without hiding partial matches and distinguishes mobile sequence numbers'"
          if marker not in test_source:
            test_source += r'''

          test('prioritizes exact market IDs without hiding partial matches and distinguishes mobile sequence numbers', { timeout: 30_000 }, async (context) => {
            const browserConfig = await resolveBrowser(context, 'search priority and mobile sequence regression coverage');
            if (!browserConfig) return;
            const server = await startServer();
            const { port } = server.address();
            const browser = await browserConfig.browserType.launch(browserConfig.launchOptions);
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.route('https://**/*', (route) => {
              if (route.request().url().startsWith('https://www.googletagmanager.com/')) {
                return route.fulfill({ status: 200, contentType: 'text/javascript', body: '' });
              }
              return route.abort();
            });
            try {
              await page.goto(`http://127.0.0.1:${port}/`, { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.querySelectorAll('#priceRows tr[data-market-id]').length > 0);

              const search = page.locator('#searchInput');
              await search.fill('us');
              await page.waitForFunction(() => document.querySelector('#priceRows tr[data-market-id]')?.dataset.marketId === 'us');
              const usResults = page.locator('#priceRows tr[data-market-id]');
              assert.equal(await usResults.first().getAttribute('data-market-id'), 'us', 'exact US market ID should be first');
              assert.ok(await usResults.count() > 1, 'exact market ID search should retain partial matches');
              assert.match(await page.locator('#priceRows').innerText(), /Russia/, 'Russia should remain as a partial "us" match');

              await search.fill('rus');
              await page.waitForFunction(() => document.querySelector('#priceRows')?.textContent?.includes('Russia'));
              assert.match(await page.locator('#priceRows').innerText(), /Russia/, 'partial English country names should match');

              await search.fill('大利');
              await page.waitForFunction(() => document.querySelectorAll('#priceRows tr[data-market-id]').length >= 2);
              const chinesePartial = await page.locator('#priceRows').innerText();
              assert.match(chinesePartial, /澳大利亚/, 'partial Chinese text should match Australia');
              assert.match(chinesePartial, /意大利/, 'partial Chinese text should match Italy');

              await search.fill('');
              await page.locator('button[data-sort="country"]').click();
              await page.waitForFunction(() => document.querySelector('.mobile-rank')?.textContent === '序1');
              assert.deepEqual(
                await page.locator('#priceRows .mobile-rank').evaluateAll((nodes) => nodes.slice(0, 3).map((node) => node.textContent)),
                ['序1', '序2', '序3'],
                'country sorting should expose the shared list sequence explicitly on mobile'
              );
              assert.equal(await page.locator('#rankHeaderLabel').innerText(), '序号', 'desktop/table semantics should remain sequence when sorting by country');

              await page.locator('button[data-sort-tier="200GB"]').click();
              await page.waitForFunction(() => document.querySelector('.mobile-rank')?.textContent === '1');
              assert.equal((await page.locator('#priceRows .mobile-rank').first().innerText()).startsWith('序'), false, 'tier sorting should return to global rank labels');
              assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1), true, 'sequence labels must not introduce horizontal overflow');
            } finally {
              await browser.close();
              await server.close(() => {});
            }
          });
          '''
            test_path.write_text(test_source, encoding='utf-8')

      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Refresh content hashes
        working-directory: tools/icloud_price_comparison
        run: pnpm assets:update

      - name: Remove temporary workflow before repository checks
        run: rm .github/workflows/agent-search-sequence-polish.yml

      - name: Run core checks
        working-directory: tools/icloud_price_comparison
        run: pnpm test:core

      - name: Run Chromium UI regression suite
        working-directory: tools/icloud_price_comparison
        env:
          PLAYWRIGHT_BROWSER: chromium
        run: node --test test/ui-smoke.test.mjs

      - name: Commit final patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/script.js \
                  tools/icloud_price_comparison/index.html \
                  tools/icloud_price_comparison/test/ui-smoke.test.mjs \
                  .github/workflows/agent-search-sequence-polish.yml
          git diff --cached --check
          git commit -m "Polish search and mobile sequence labels"
          git push origin HEAD:agent/search-sequence-polish
