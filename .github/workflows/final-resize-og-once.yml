name: Final resize OG once

on:
  push:
    branches:
      - agent/final-og-doc-correction
    paths:
      - .github/workflows/final-resize-og-once.yml

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/final-og-doc-correction
          fetch-depth: 0

      - name: Resize uploaded social image to exact contract
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          path = 'tools/icloud_price_comparison/og-image.png'
          with Image.open(path) as image:
              image.load()
              normalized = ImageOps.fit(image.convert('RGB'), (1200, 630), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              normalized.save(path, format='PNG', optimize=True)
          with Image.open(path) as check:
              assert check.format == 'PNG'
              assert check.size == (1200, 630), check.size
          PY

      - name: Run core tests
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test:core

      - name: Commit normalized image and remove temporary workflow
        run: |
          rm .github/workflows/final-resize-og-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/icloud_price_comparison/og-image.png .github/workflows/final-resize-og-once.yml
          git commit -m 'fix: normalize final social sharing image'
          git push origin HEAD:agent/final-og-doc-correction
