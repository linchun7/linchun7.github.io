name: Patch iCloud UI fixtures 20260916

on:
  push:
    branches:
      - fix/icloud-postupdate-ui-fixtures-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出修复分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/icloud-postupdate-ui-fixtures-20260916

      - name: 精确修复 UI 测试夹具
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/icloud_price_comparison/test/ui-smoke.test.mjs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              """function formatUiDate(value) {
            const text = String(value).trim().replace(/^published\\s+date\\s*:?\\s*/i, '');
            const date = /^\\d{4}-\\d{2}-\\d{2}$/.test(text)
              ? new Date(`${text}T00:00:00Z`)
              : new Date(`${text} 00:00:00 UTC`);
            return new Intl.DateTimeFormat('zh-CN', {
              year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'UTC'
            }).format(date);
          }
          """,
              """function parsePublicationDate(value) {
            const text = String(value).trim().replace(/^published\\s+date\\s*:?\\s*/i, '');
            const date = /^\\d{4}-\\d{2}-\\d{2}$/.test(text)
              ? new Date(`${text}T00:00:00Z`)
              : new Date(`${text} 00:00:00 UTC`);
            if (Number.isNaN(date.getTime())) throw new Error(`Invalid publication date fixture: ${value}`);
            return date;
          }

          function formatUiDate(value) {
            return new Intl.DateTimeFormat('zh-CN', {
              year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'UTC'
            }).format(parsePublicationDate(value));
          }
          """,
              'publication-date helper'
          )

          replace_once(
              "expectedPublishedDate: '2026/07/17'",
              "expectedPublishedDate: formatUiDate(expectedData.source.publishedDate)",
              'stale-history expected publication date'
          )

          replace_once(
              """  const validData = await readFixture('prices.json');
            const referenceNow = Date.now();
          """,
              """  const validData = await readFixture('prices.json');
            const referenceNow = Date.parse(validData.generatedAt) + (8 * 24 * 60 * 60 * 1_000);
          """,
              'stale-data synthetic clock'
          )

          replace_once(
              """  const fixture = await readFixture('prices.json');
            const history = await readFixture('history.json');
            const referenceNow = Date.now();
          """,
              """  const fixture = await readFixture('prices.json');
            const history = await readFixture('history.json');
            const referenceNow = Date.parse(fixture.generatedAt) + (8 * 24 * 60 * 60 * 1_000);
          """,
              'long-lived lifecycle synthetic clock'
          )

          replace_once(
              """  const payload = await readFixture('prices.json');
            const referenceNow = Date.now();
          """,
              """  const payload = await readFixture('prices.json');
            const referenceNow = Date.parse(payload.generatedAt) + (8 * 24 * 60 * 60 * 1_000);
          """,
              'expired lifecycle synthetic clock'
          )

          replace_once(
              "  const publicationEnd = Date.UTC(2026, 6, 17);",
              "  const publicationEnd = parsePublicationDate(data.source.publishedDate).getTime();",
              'long-history publication end'
          )

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- tools/icloud_price_comparison/test/ui-smoke.test.mjs

      - name: 提交修复并移除一次性工作流
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-icloud-ui-fixtures-20260916.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/test/ui-smoke.test.mjs
          git diff --cached --check
          git commit -m "test: decouple UI fixtures from Apple publication date"
          git push origin HEAD:fix/icloud-postupdate-ui-fixtures-20260916
