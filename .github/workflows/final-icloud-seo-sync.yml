name: Final iCloud SEO sync

on:
  push:
    branches:
      - 'agent/final-icloud-seo-hardening'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/final-icloud-seo-hardening
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Render deterministic SEO projection
        working-directory: tools/icloud_price_comparison
        run: node scripts/render-static-page.mjs --write
      - name: Commit generated index
        run: |
          if git diff --quiet -- tools/icloud_price_comparison/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/index.html
          git commit -m "Sync generated iCloud SEO projection"
          git push
