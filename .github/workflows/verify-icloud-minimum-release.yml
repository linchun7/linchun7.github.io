name: Verify iCloud minimum-history release
on:
  push:
    branches: [verify/icloud-minimum-history-20260926]
    paths: [.github/workflows/verify-icloud-minimum-release.yml]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8d3c10de77999f2b1bde546a5fc6dab1e9967439
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install locked validation dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify canonical production, current history, and deployed assets
        working-directory: tools/icloud_price_comparison
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production-deployment.mjs --expected-data-dir data --run-id "$GITHUB_RUN_ID" --summary-file "$GITHUB_STEP_SUMMARY" --max-wait-ms 300000 --interval-ms 5000
          cat "$GITHUB_STEP_SUMMARY"
      - name: Print failed proof without substituting cache-bypassed success
        if: failure()
        shell: bash
        run: test ! -f "$GITHUB_STEP_SUMMARY" || cat "$GITHUB_STEP_SUMMARY"
