name: Update iCloud prices

on:
  schedule:
    - cron: '55 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-icloud-prices
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check repository storage
        working-directory: .
        shell: bash
        run: |
          git_kib=$(du -sk .git | cut -f1)
          git_mib=$(( (git_kib + 1023) / 1024 ))
          history_bytes=$(wc -c < tools/icloud_price_comparison/data/history.json)
          history_kib=$(( (history_bytes + 1023) / 1024 ))
          {
            echo "### 容量监控"
            echo "- Git 历史：${git_mib} MiB"
            echo "- 价格历史：${history_kib} KiB"
          } > "$RUNNER_TEMP/icloud-storage-summary.md"
          if (( git_kib >= 819200 )); then
            echo "::warning title=Git 历史体积较高::Git 历史已达 ${git_mib} MiB，请尽快安排人工维护。"
            echo "- **警告**：Git 历史体积较高，请尽快安排人工维护。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          elif (( git_kib >= 512000 )); then
            echo "::warning title=Git 历史体积::Git 历史已达 ${git_mib} MiB，请在达到 1 GiB 前安排人工审查。"
            echo "- **警告**：Git 历史已达 ${git_mib} MiB，请安排人工审查。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          fi
          if (( history_bytes >= 2097152 )); then
            echo "::warning title=价格历史体积::history.json 已达 ${history_kib} KiB，请考虑按年份或地区拆分。"
            echo "- **警告**：价格历史已达 ${history_kib} KiB，请考虑按年份或地区拆分。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run parser tests
        run: pnpm test

      - name: Fetch and validate prices
        run: pnpm update:data

      - name: Validate updated snapshot
        run: pnpm test

      - name: Upload run diagnostics and Apple snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: icloud-price-diagnostics-${{ github.run_id }}
          path: tools/icloud_price_comparison/artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Append repository storage summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/icloud-storage-summary.md" ]]; then
            cat "$RUNNER_TEMP/icloud-storage-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit data changes
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- tools/icloud_price_comparison/data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/data
          git commit -m "chore: update iCloud prices"
          git pull --rebase origin main
          git push origin HEAD:main
