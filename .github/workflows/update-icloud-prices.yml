name: Update iCloud prices

on:
  schedule:
    # 北京时间 08:10，作为 Cloudflare 08:05 主触发的备用。
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 触发来源（手动运行保持 manual）
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cloudflare

permissions:
  contents: read

concurrency:
  group: update-icloud-prices
  cancel-in-progress: false

jobs:
  prepare:
    name: 检查每日自动更新
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.daily_guard.outputs.should_run }}
      trigger_source: ${{ steps.daily_guard.outputs.trigger_source }}
      automatic_run_date_beijing: ${{ steps.daily_guard.outputs.automatic_run_date_beijing }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 读取最新 main 的每日幂等状态
        working-directory: .
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:tools/icloud_price_comparison/data/run-log.json > "$RUNNER_TEMP/icloud-run-log.json"

      - name: 检查每日幂等状态
        id: daily_guard
        working-directory: tools/icloud_price_comparison
        env:
          REQUESTED_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          ICLOUD_RUN_LOG_PATH: ${{ runner.temp }}/icloud-run-log.json
        run: node scripts/daily-run-guard.mjs

  update:
    name: 更新并验证 iCloud+ 价格
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 固定本次生成基线
        working-directory: .
        shell: bash
        run: |
          git fetch origin main
          git checkout --detach origin/main
          echo "GENERATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: 检查仓库容量
        working-directory: .
        shell: bash
        run: |
          git_kib=$(du -sk .git | cut -f1)
          git_mib=$(( (git_kib + 1023) / 1024 ))
          history_bytes=$(wc -c < tools/icloud_price_comparison/data/history.json)
          history_kib=$(( (history_bytes + 1023) / 1024 ))
          {
            echo "### 容量监控"
            echo "- Git 历史：${git_mib} MiB"
            echo "- 价格历史：${history_kib} KiB"
          } > "$RUNNER_TEMP/icloud-storage-summary.md"
          if (( git_kib >= 819200 )); then
            echo "::warning title=Git 历史体积较高::Git 历史已达 ${git_mib} MiB，请尽快安排人工维护。"
            echo "- **警告**：Git 历史体积较高，请尽快安排人工维护。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          elif (( git_kib >= 512000 )); then
            echo "::warning title=Git 历史体积::Git 历史已达 ${git_mib} MiB，请在达到 1 GiB 前安排人工审查。"
            echo "- **警告**：Git 历史已达 ${git_mib} MiB，请安排人工审查。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          fi
          if (( history_bytes >= 2097152 )); then
            echo "::warning title=价格历史体积::history.json 已达 ${history_kib} KiB，请考虑按年份或地区拆分。"
            echo "- **警告**：价格历史已达 ${history_kib} KiB，请考虑按年份或地区拆分。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          fi

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 安装 pnpm
        run: npm install --global pnpm@10.14.0

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 运行解析与数据安全测试
        run: pnpm test:core

      - name: 抓取并校验 Apple 价格
        id: update_data
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          ICLOUD_TRIGGER_SOURCE: ${{ needs.prepare.outputs.trigger_source }}
          ICLOUD_AUTOMATIC_RUN_DATE_BEIJING: ${{ needs.prepare.outputs.automatic_run_date_beijing }}
        run: pnpm update:data

      - name: 验证更新后的价格数据
        run: pnpm test:data

      - name: 验证更新后的页面
        id: ui_after
        shell: bash
        run: |
          ui_failed=false
          # 每日更新使用 runner 预装的 Chrome；完整 Chromium + WebKit 验证由独立验证工作流负责。
          pnpm test:ui || ui_failed=true
          echo "ui_failed=$ui_failed" >> "$GITHUB_OUTPUT"

      - name: 上传诊断信息和 Apple 页面快照
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icloud-price-diagnostics-${{ github.run_id }}
          path: tools/icloud_price_comparison/artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: 追加仓库容量摘要
        if: always()
        working-directory: .
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/icloud-storage-summary.md" ]]; then
            cat "$RUNNER_TEMP/icloud-storage-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交价格数据变更
        id: commit_data
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- tools/icloud_price_comparison/data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/data
          git commit -m "chore: update iCloud prices"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GENERATION_BASE_SHA" ]]; then
            echo "::error title=main 已在生成期间前进::远端 main 已变化；为避免覆盖自动数据提交，本次更新将失败并在下一次运行重试。"
            exit 1
          fi
          pnpm --dir tools/icloud_price_comparison install --frozen-lockfile
          pnpm --dir tools/icloud_price_comparison run test:core
          pnpm --dir tools/icloud_price_comparison run test:data
          git push origin HEAD:main

      - name: 记录浏览器界面测试警告
        if: always() && !cancelled() && steps.ui_after.outputs.ui_failed == 'true'
        working-directory: .
        shell: bash
        run: |
          echo "::warning title=浏览器界面测试未通过::价格抓取、核心数据校验和提交未因此中断。请查看上方浏览器界面测试步骤。"
          {
            echo "## 浏览器界面测试警告"
            echo ""
            echo "> **警告：** 页面自动化验收未通过；价格抓取、核心数据校验和提交未因此中断。"
            echo ""
            echo "- 更新后测试：未通过（已按非阻断警告处理）"
            echo "- 数据提交步骤：${{ steps.commit_data.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 补充未报告的失败摘要
        if: failure()
        working-directory: .
        shell: bash
        run: |
          if [[ "${{ steps.update_data.outcome }}" == "failure" && -f "tools/icloud_price_comparison/artifacts/run-report.json" ]]; then
            echo "Updater already wrote a detailed failure summary"
            exit 0
          fi
          echo "::error title=iCloud+ 价格更新失败::自动任务未完成，请查看上方第一个标红步骤确定失败阶段。"
          if [[ "${{ steps.commit_data.outcome }}" == "success" ]]; then
            data_status="价格数据步骤已经完成；本次失败来自其他验收或收尾步骤。"
          else
            data_status="本次运行未确认价格数据已成功提交。上一份有效数据继续保留。"
          fi
          {
            echo "## iCloud+ 价格更新失败"
            echo ""
            echo "> **错误：** 自动任务未完成，请查看上方第一个标红步骤确定失败阶段。"
            echo ""
            echo "$data_status"
          } >> "$GITHUB_STEP_SUMMARY"
