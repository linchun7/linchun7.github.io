name: Update iCloud prices

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-icloud-prices
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run parser tests
        run: pnpm test

      - name: Fetch and validate prices
        run: pnpm update:data

      - name: Validate updated snapshot
        run: pnpm test

      - name: Upload run diagnostics and Apple snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: icloud-price-diagnostics-${{ github.run_id }}
          path: tools/icloud_price_comparison/artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit data changes
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- tools/icloud_price_comparison/data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/data
          git commit -m "chore: update iCloud prices"
          git pull --rebase origin main
          git push origin HEAD:main
