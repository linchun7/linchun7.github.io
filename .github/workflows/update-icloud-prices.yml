name: Update iCloud prices

on:
  schedule:
    # 北京时间 08:10，作为 Cloudflare 08:05 主触发的备用。
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 触发来源（手动运行保持 manual）
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cloudflare

permissions:
  contents: read

concurrency:
  group: update-icloud-prices
  cancel-in-progress: false

jobs:
  prepare:
    name: 检查每日自动更新
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.daily_guard.outputs.should_run }}
      trigger_source: ${{ steps.daily_guard.outputs.trigger_source }}
      automatic_run_date_beijing: ${{ steps.daily_guard.outputs.automatic_run_date_beijing }}
      severe_failure: ${{ steps.classify_prepare.outputs.severe_failure }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 读取最新 main 的每日幂等状态
        working-directory: .
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:tools/icloud_price_comparison/data/run-log.json > "$RUNNER_TEMP/icloud-run-log.json"

      - name: 检查每日幂等状态
        id: daily_guard
        working-directory: tools/icloud_price_comparison
        env:
          REQUESTED_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          ICLOUD_RUN_LOG_PATH: ${{ runner.temp }}/icloud-run-log.json
        run: node scripts/daily-run-guard.mjs

      - name: 分类前置检查故障
        id: classify_prepare
        if: always()
        shell: bash
        run: |
          severe_failure=false
          if [[ "${{ steps.daily_guard.outcome }}" == "failure" ]]; then
            severe_failure=true
          fi
          echo "severe_failure=$severe_failure" >> "$GITHUB_OUTPUT"

  update:
    name: 更新并验证 iCloud+ 价格
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    permissions:
      contents: read
    outputs:
      generation_base_sha: ${{ steps.generation_base.outputs.sha }}
      severe_failure: ${{ steps.classify_update.outputs.severe_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 固定本次生成基线
        id: generation_base
        working-directory: .
        shell: bash
        run: |
          git fetch origin main
          git checkout --detach origin/main
          echo "GENERATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 检查仓库容量
        working-directory: .
        shell: bash
        run: |
          git_kib=$(du -sk .git | cut -f1)
          git_mib=$(( (git_kib + 1023) / 1024 ))
          history_bytes=$(wc -c < tools/icloud_price_comparison/data/history.json)
          history_kib=$(( (history_bytes + 1023) / 1024 ))
          {
            echo "### 容量监控"
            echo "- Git 历史：${git_mib} MiB"
            echo "- 价格历史：${history_kib} KiB"
          } > "$RUNNER_TEMP/icloud-storage-summary.md"
          if (( git_kib >= 819200 )); then
            echo "::warning title=Git 历史体积较高::Git 历史已达 ${git_mib} MiB，请尽快安排人工维护。"
            echo "- **警告**：Git 历史体积较高，请尽快安排人工维护。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          elif (( git_kib >= 512000 )); then
            echo "::warning title=Git 历史体积::Git 历史已达 ${git_mib} MiB，请在达到 1 GiB 前安排人工审查。"
            echo "- **警告**：Git 历史已达 ${git_mib} MiB，请安排人工审查。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          fi
          if (( history_bytes >= 2097152 )); then
            echo "::warning title=价格历史体积::history.json 已达 ${history_kib} KiB，请考虑按年份或地区拆分。"
            echo "- **警告**：价格历史已达 ${history_kib} KiB，请考虑按年份或地区拆分。" >> "$RUNNER_TEMP/icloud-storage-summary.md"
          fi

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 安装 pnpm
        run: npm install --global pnpm@10.14.0

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 运行解析与数据安全测试
        id: core_tests
        run: pnpm test:core

      - name: 抓取并校验 Apple 价格
        id: update_data
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          ICLOUD_TRIGGER_SOURCE: ${{ needs.prepare.outputs.trigger_source }}
          ICLOUD_AUTOMATIC_RUN_DATE_BEIJING: ${{ needs.prepare.outputs.automatic_run_date_beijing }}
        run: pnpm update:data

      - name: 验证更新后的价格数据
        id: data_tests
        run: pnpm test:data

      - name: 验证更新后的页面
        id: ui_tests
        # 每日更新使用 runner 预装的 Chrome；完整 Chromium + WebKit 验证由独立验证工作流负责。
        run: pnpm test:ui

      - name: 上传诊断信息和 Apple 规范化快照
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icloud-price-diagnostics-${{ github.run_id }}
          path: tools/icloud_price_comparison/artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: 追加仓库容量摘要
        if: always()
        working-directory: .
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/icloud-storage-summary.md" ]]; then
            cat "$RUNNER_TEMP/icloud-storage-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 打包已测试的数据工件
        id: package_data
        working-directory: .
        shell: bash
        run: |
          tar -cf "$RUNNER_TEMP/icloud-price-data.tar" tools/icloud_price_comparison/data
          cd "$RUNNER_TEMP"
          sha256sum icloud-price-data.tar > icloud-price-data.tar.sha256

      - name: 上传已测试的数据工件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icloud-price-data-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/icloud-price-data.tar
            ${{ runner.temp }}/icloud-price-data.tar.sha256
          if-no-files-found: error
          retention-days: 1

      - name: 补充未报告的失败摘要
        if: failure()
        working-directory: .
        shell: bash
        run: |
          if [[ "${{ steps.update_data.outcome }}" == "failure" && -f "tools/icloud_price_comparison/artifacts/run-report.json" ]]; then
            echo "Updater already wrote a detailed failure summary"
            exit 0
          fi
          echo "::error title=iCloud+ 价格更新失败::自动任务未完成，请查看上方第一个标红步骤确定失败阶段。"
          if [[ "${{ steps.package_data.outcome }}" == "success" ]]; then
            data_status="价格数据步骤已经完成；本次失败来自其他验收或收尾步骤。"
          else
            data_status="本次运行未确认价格数据已成功提交。上一份有效数据继续保留。"
          fi
          {
            echo "## iCloud+ 价格更新失败"
            echo ""
            echo "> **错误：** 自动任务未完成，请查看上方第一个标红步骤确定失败阶段。"
            echo ""
            echo "$data_status"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 分类更新故障与严重警告
        id: classify_update
        if: always()
        shell: bash
        run: |
          severe_failure=false
          if [[ "${{ steps.core_tests.outcome }}" == "failure" ]] \
            || [[ "${{ steps.data_tests.outcome }}" == "failure" ]] \
            || [[ "${{ steps.ui_tests.outcome }}" == "failure" ]]; then
            severe_failure=true
          fi

          if [[ "${{ steps.update_data.outcome }}" == "failure" ]]; then
            report="artifacts/run-report.json"
            if [[ ! -f "$report" ]]; then
              severe_failure=true
            else
              severity=$(node -e '
                const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                process.stdout.write(report.healthcheckSeverity === "transient" ? "transient" : "severe");
              ' "$report")
              if [[ "$severity" == "severe" ]]; then
                severe_failure=true
              fi
            fi
          elif [[ "${{ steps.update_data.outcome }}" == "success" ]]; then
            parser=$(node -e '
              const data = JSON.parse(require("fs").readFileSync("data/prices.json", "utf8"));
              process.stdout.write(data?.source?.parser || "missing");
            ')
            if [[ "$parser" != "cross-checked" ]]; then
              severe_failure=true
            fi
          fi

          echo "severe_failure=$severe_failure" >> "$GITHUB_OUTPUT"

  publish:
    name: 发布已测试的数据
    needs:
      - prepare
      - update
    if: needs.prepare.outputs.should_run == 'true' && needs.update.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      severe_failure: ${{ steps.classify_publish.outputs.severe_failure }}
    steps:
      - name: 检出精确生成基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.generation_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 下载已测试的数据工件
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: icloud-price-data-${{ github.run_id }}
          path: ${{ runner.temp }}/icloud-price-data

      - name: 校验并展开数据工件
        id: validate_data_artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/icloud-price-data"
          sha256sum --check icloud-price-data.tar.sha256
          while IFS= read -r item; do
            if [[ ( "$item" != "tools/icloud_price_comparison/data" && "$item" != "tools/icloud_price_comparison/data/"* ) || "$item" == /* || "$item" == *".."* ]]; then
              echo "::error title=数据工件路径非法::$item"
              exit 1
            fi
          done < <(tar -tf icloud-price-data.tar)
          mkdir unpacked
          tar -xf icloud-price-data.tar -C unpacked
          find unpacked/tools/icloud_price_comparison/data -type f -name '*.json' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'

      - name: 确认 main 未前进并准备提交
        shell: bash
        env:
          GENERATION_BASE_SHA: ${{ needs.update.outputs.generation_base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [[ "$(git rev-parse origin/main)" != "$GENERATION_BASE_SHA" ]]; then
            echo "::error title=main 已在生成期间前进::远端 main 已变化；本次不发布，下一次运行会重新生成。"
            exit 1
          fi
          cp -a "$RUNNER_TEMP/icloud-price-data/unpacked/tools/icloud_price_comparison/data/." tools/icloud_price_comparison/data/
          if git diff --quiet -- tools/icloud_price_comparison/data; then
            echo "NO_DATA_CHANGES=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/icloud_price_comparison/data
          git commit -m "chore: update iCloud prices"

      - name: 仅在最终步骤推送
        if: env.NO_DATA_CHANGES != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [[ "$(git rev-parse origin/main)" != "${{ needs.update.outputs.generation_base_sha }}" ]]; then
            echo "::error title=main 已在提交前前进::本次不推送，下一次运行会重新生成。"
            exit 1
          fi
          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:main

      - name: 分类发布故障
        id: classify_publish
        if: always()
        shell: bash
        run: |
          severe_failure=false
          if [[ "${{ steps.validate_data_artifact.outcome }}" == "failure" ]]; then
            severe_failure=true
          fi
          echo "severe_failure=$severe_failure" >> "$GITHUB_OUTPUT"

  notify:
    name: 外部心跳告警
    needs:
      - prepare
      - update
      - publish
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 报告每日更新结果
        continue-on-error: true
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.ICLOUD_HEALTHCHECK_PING_URL }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SHOULD_RUN: ${{ needs.prepare.outputs.should_run }}
          UPDATE_RESULT: ${{ needs.update.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PREPARE_SEVERE_FAILURE: ${{ needs.prepare.outputs.severe_failure }}
          UPDATE_SEVERE_FAILURE: ${{ needs.update.outputs.severe_failure }}
          PUBLISH_SEVERE_FAILURE: ${{ needs.publish.outputs.severe_failure }}
        shell: bash
        run: |
          if [[ -z "$HEALTHCHECK_PING_URL" ]]; then
            echo "未配置 ICLOUD_HEALTHCHECK_PING_URL，跳过第三方心跳。"
            exit 0
          fi
          if [[ "$PREPARE_SEVERE_FAILURE" == true ]] \
            || [[ "$UPDATE_SEVERE_FAILURE" == true ]] \
            || [[ "$PUBLISH_SEVERE_FAILURE" == true ]]; then
            status=1
          elif [[ "$PREPARE_RESULT" == success ]] \
            && { [[ "$SHOULD_RUN" != true ]] \
              || { [[ "$UPDATE_RESULT" == success ]] && [[ "$PUBLISH_RESULT" == success ]]; }; }; then
            status=0
          else
            echo "本次属于单次暂时故障，不发送失败信号；由 Healthchecks 连续缺少成功心跳的宽限期处理。"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 --retry 3 "${HEALTHCHECK_PING_URL%/}/$status"
