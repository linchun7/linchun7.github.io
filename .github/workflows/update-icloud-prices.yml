name: Update iCloud prices

on:
  schedule:
    # 北京时间 08:10，作为 Cloudflare 08:05 主触发的备用。
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 触发来源（手动运行保持 manual）
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cloudflare

permissions:
  contents: read

concurrency:
  group: update-icloud-prices
  cancel-in-progress: false

jobs:
  prepare:
    name: 检查每日自动更新
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.daily_guard.outputs.should_run }}
      trigger_source: ${{ steps.daily_guard.outputs.trigger_source }}
      automatic_run_date_beijing: ${{ steps.daily_guard.outputs.automatic_run_date_beijing }}
      severe_failure: ${{ steps.classify_prepare.outputs.severe_failure }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 读取并深验最新 main 的每日幂等状态
        id: validate_main_data
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_snapshot="$RUNNER_TEMP/icloud-main-snapshot"
          mkdir -p "$main_snapshot"
          git archive --format=tar origin/main tools/icloud_price_comparison/data | tar --extract --file=- --directory="$main_snapshot"
          node tools/icloud_price_comparison/scripts/validate-data-artifact.mjs \
            --data-dir "$main_snapshot/tools/icloud_price_comparison/data"

      - name: 检查每日幂等状态
        id: daily_guard
        working-directory: tools/icloud_price_comparison
        env:
          REQUESTED_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          ICLOUD_RUN_LOG_PATH: ${{ runner.temp }}/icloud-main-snapshot/tools/icloud_price_comparison/data/run-log.json
        run: node scripts/daily-run-guard.mjs

      - name: 分类前置检查故障
        id: classify_prepare
        if: always()
        shell: bash
        run: |
          severe_failure=false
          if [[ "${{ steps.validate_main_data.outcome }}" == "failure" ]] \
            || [[ "${{ steps.daily_guard.outcome }}" == "failure" ]]; then
            severe_failure=true
          fi
          echo "severe_failure=$severe_failure" >> "$GITHUB_OUTPUT"

  update:
    name: 更新并验证 iCloud+ 价格
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    permissions:
      contents: read
    outputs:
      generation_base_sha: ${{ steps.generation_base.outputs.sha }}
      severe_failure: ${{ steps.classify_update.outputs.severe_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 固定本次生成基线
        id: generation_base
        working-directory: .
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout --detach origin/main
          echo "GENERATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 启用并校验 pnpm
        run: |
          corepack enable
          pnpm --version

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 运行解析与数据安全测试
        id: core_tests
        run: pnpm test:core

      - name: 抓取并校验 Apple 价格
        id: update_data
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          ICLOUD_TRIGGER_SOURCE: ${{ needs.prepare.outputs.trigger_source }}
          ICLOUD_AUTOMATIC_RUN_DATE_BEIJING: ${{ needs.prepare.outputs.automatic_run_date_beijing }}
        run: pnpm update:data

      - name: 验证更新后的价格数据
        id: data_tests
        run: pnpm test:data

      - name: 验证更新后的页面
        id: ui_tests
        # 每日更新使用 runner 预装的 Chrome；完整 Chromium + Firefox + WebKit 验证由独立验证工作流负责。
        run: pnpm test:ui

      - name: 上传诊断信息和 Apple 规范化快照
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icloud-price-diagnostics-${{ github.run_id }}
          path: tools/icloud_price_comparison/artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: 打包已测试的数据工件
        id: package_data
        working-directory: .
        shell: bash
        run: |
          node tools/icloud_price_comparison/scripts/validate-data-artifact.mjs --data-dir tools/icloud_price_comparison/data
          tar --format=ustar -cf "$RUNNER_TEMP/icloud-price-data.tar" tools/icloud_price_comparison/data
          cd "$RUNNER_TEMP"
          sha256sum icloud-price-data.tar > icloud-price-data.tar.sha256

      - name: 上传已测试的数据工件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icloud-price-data-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/icloud-price-data.tar
            ${{ runner.temp }}/icloud-price-data.tar.sha256
          if-no-files-found: error
          retention-days: 1

      - name: 补充未报告的失败摘要
        if: failure()
        working-directory: .
        shell: bash
        run: |
          if [[ "${{ steps.update_data.outcome }}" == "failure" && -f "tools/icloud_price_comparison/artifacts/run-report.json" ]]; then
            echo "Updater already wrote a detailed failure summary"
            exit 0
          fi
          echo "::error title=iCloud+ 价格更新失败::自动任务未完成，请查看上方第一个标红步骤确定失败阶段。"
          if [[ "${{ steps.package_data.outcome }}" == "success" ]]; then
            data_status="价格数据步骤已经完成；本次失败来自其他验收或收尾步骤。"
          else
            data_status="本次运行未确认价格数据已成功提交。上一份有效数据继续保留。"
          fi
          {
            echo "## iCloud+ 价格更新失败"
            echo ""
            echo "> **错误：** 自动任务未完成，请查看上方第一个标红步骤确定失败阶段。"
            echo ""
            echo "$data_status"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 分类更新故障与严重警告
        id: classify_update
        if: always()
        shell: bash
        run: |
          severe_failure=false
          if [[ "${{ steps.core_tests.outcome }}" == "failure" ]] \
            || [[ "${{ steps.data_tests.outcome }}" == "failure" ]] \
            || [[ "${{ steps.ui_tests.outcome }}" == "failure" ]] \
            || [[ "${{ steps.package_data.outcome }}" == "failure" ]]; then
            severe_failure=true
          fi

          if [[ "${{ steps.update_data.outcome }}" == "failure" ]]; then
            report="artifacts/run-report.json"
            update_failure_severe=true
            if [[ -f "$report" ]] && severity=$(node -e '
                const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                process.stdout.write(report.healthcheckSeverity === "transient" ? "transient" : "severe");
              ' "$report" 2>/dev/null); then
              if [[ "$severity" == "severe" ]]; then
                update_failure_severe=true
              else
                update_failure_severe=false
              fi
            fi
            if [[ "$update_failure_severe" == "true" ]]; then
              severe_failure=true
            fi
          elif [[ "${{ steps.update_data.outcome }}" == "success" ]]; then
            if ! parser=$(node -e '
              const data = JSON.parse(require("fs").readFileSync("data/prices.json", "utf8"));
              process.stdout.write(data?.source?.parser || "missing");
            ' 2>/dev/null); then
              severe_failure=true
            elif [[ "$parser" != "cross-checked" ]]; then
              severe_failure=true
            fi
          fi

          echo "severe_failure=$severe_failure" >> "$GITHUB_OUTPUT"

  publish:
    name: 发布已测试的数据
    needs:
      - prepare
      - update
    if: needs.prepare.outputs.should_run == 'true' && needs.update.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      severe_failure: ${{ steps.classify_publish.outputs.severe_failure }}
      publish_outcome: ${{ steps.classify_publish.outputs.publish_outcome }}
    steps:
      - name: 检出精确生成基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.generation_base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 下载已测试的数据工件
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: icloud-price-data-${{ github.run_id }}
          path: ${{ runner.temp }}/icloud-price-data

      - name: 校验并展开数据工件
        id: validate_data_artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/icloud-price-data"
          sha256sum --check icloud-price-data.tar.sha256
          validator="$GITHUB_WORKSPACE/tools/icloud_price_comparison/scripts/validate-data-artifact.mjs"
          node "$validator" --archive icloud-price-data.tar
          mkdir unpacked
          tar --extract --file icloud-price-data.tar --directory unpacked --no-same-owner --no-same-permissions
          node "$validator" --data-dir unpacked/tools/icloud_price_comparison/data

      - name: 确认 main 未前进并准备提交
        id: prepare_publish
        shell: bash
        env:
          GENERATION_BASE_SHA: ${{ needs.update.outputs.generation_base_sha }}
        run: |
          set -euo pipefail
          echo "main_advanced=false" >> "$GITHUB_OUTPUT"
          echo "should_push=false" >> "$GITHUB_OUTPUT"
          git fetch origin main --depth=1
          if [[ "$(git rev-parse origin/main)" != "$GENERATION_BASE_SHA" ]]; then
            echo "::error title=main 已在生成期间前进::远端 main 已变化；本次不发布，下一次运行会重新生成。"
            echo "main_advanced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          validated_data="$RUNNER_TEMP/icloud-price-data/unpacked/tools/icloud_price_comparison/data"
          rm -rf tools/icloud_price_comparison/data
          cp -a "$validated_data" tools/icloud_price_comparison/data
          if git diff --quiet -- tools/icloud_price_comparison/data; then
            echo "publish_candidate=no_data_changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all tools/icloud_price_comparison/data
          git commit -m "chore: update iCloud prices"
          echo "publish_candidate=commit_ready" >> "$GITHUB_OUTPUT"
          echo "should_push=true" >> "$GITHUB_OUTPUT"

      - name: 仅在最终步骤推送
        id: push_data
        if: steps.prepare_publish.outputs.should_push == 'true'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "main_advanced=false" >> "$GITHUB_OUTPUT"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git fetch origin main --depth=1
          if [[ "$(git rev-parse origin/main)" != "${{ needs.update.outputs.generation_base_sha }}" ]]; then
            echo "::error title=main 已在提交前前进::本次不推送，下一次运行会重新生成。"
            echo "main_advanced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: 分类发布故障
        id: classify_publish
        if: always()
        shell: bash
        run: |
          severe_failure=false
          publish_outcome=push_failed
          if [[ "${{ steps.validate_data_artifact.outcome }}" == "failure" ]]; then
            severe_failure=true
            publish_outcome=artifact_invalid
          elif [[ "${{ steps.prepare_publish.outputs.main_advanced }}" == "true" ]] \
            || [[ "${{ steps.push_data.outputs.main_advanced }}" == "true" ]]; then
            publish_outcome=main_advanced
          elif [[ "${{ steps.prepare_publish.outputs.publish_candidate }}" == "no_data_changes" ]]; then
            publish_outcome=no_data_changes
          elif [[ "${{ steps.push_data.outcome }}" == "failure" ]]; then
            severe_failure=true
            publish_outcome=push_failed
          elif [[ "${{ steps.push_data.outputs.pushed }}" == "true" ]]; then
            publish_outcome=published
          else
            severe_failure=true
            publish_outcome=push_failed
          fi
          echo "severe_failure=$severe_failure" >> "$GITHUB_OUTPUT"
          echo "publish_outcome=$publish_outcome" >> "$GITHUB_OUTPUT"
          if [[ "$publish_outcome" == "main_advanced" ]]; then
            echo "::error title=PUBLISH_MAIN_ADVANCED::main 已前进；本次不覆盖、不发布。"
            exit 1
          fi
          if [[ "$severe_failure" == "true" ]]; then
            if [[ "$publish_outcome" == "artifact_invalid" ]]; then
              echo "::error title=PUBLISH_ARTIFACT_INVALID::已测试的数据工件未通过发布边界校验。"
            else
              echo "::error title=PUBLISH_PUSH_FAILED::待发布提交未能推送到 main。"
            fi
            exit 1
          fi

  verify-production:
    name: 验证真实生产部署
    needs:
      - update
      - publish
    if: needs.publish.result == 'success' && (needs.publish.outputs.publish_outcome == 'published' || needs.publish.outputs.publish_outcome == 'no_data_changes')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      severe_failure: ${{ steps.classify_verification.outputs.severe_failure }}
      verification_status: ${{ steps.classify_verification.outputs.verification_status }}
    steps:
      - name: 检出验证脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.generation_base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 下载已测试的数据工件
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: icloud-price-data-${{ github.run_id }}
          path: ${{ runner.temp }}/icloud-price-data

      - name: 重新校验并展开已测试工件
        id: validate_expected_artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/icloud-price-data"
          sha256sum --check icloud-price-data.tar.sha256
          validator="$GITHUB_WORKSPACE/tools/icloud_price_comparison/scripts/validate-data-artifact.mjs"
          node "$validator" --archive icloud-price-data.tar
          mkdir unpacked
          tar --extract --file icloud-price-data.tar --directory unpacked --no-same-owner --no-same-permissions
          node "$validator" --data-dir unpacked/tools/icloud_price_comparison/data
          git -C "$GITHUB_WORKSPACE" fetch origin main --depth=1
          git -C "$GITHUB_WORKSPACE" show origin/main:tools/icloud_price_comparison/data/prices.json \
            > "$RUNNER_TEMP/current-main-prices.json"

      - name: 轮询真实生产 URL
        id: verify_production
        continue-on-error: true
        shell: bash
        run: |
          node tools/icloud_price_comparison/scripts/verify-production-deployment.mjs \
            --expected-file "$RUNNER_TEMP/icloud-price-data/unpacked/tools/icloud_price_comparison/data/prices.json" \
            --current-main-file "$RUNNER_TEMP/current-main-prices.json" \
            --run-id "${{ github.run_id }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: 分类生产验证结果
        id: classify_verification
        if: always()
        shell: bash
        run: |
          severe_failure=false
          verification_status=passed
          if [[ "${{ steps.validate_expected_artifact.outcome }}" == "failure" ]]; then
            severe_failure=true
            verification_status=artifact_invalid
          elif [[ "${{ steps.verify_production.outcome }}" == "failure" ]]; then
            severe_failure=true
            verification_status=production_not_updated
          fi
          echo "severe_failure=$severe_failure" >> "$GITHUB_OUTPUT"
          echo "verification_status=$verification_status" >> "$GITHUB_OUTPUT"
          if [[ "$severe_failure" == "true" ]]; then
            if [[ "$verification_status" == "artifact_invalid" ]]; then
              echo "::error title=PUBLISH_ARTIFACT_INVALID::production verifier 拒绝了未通过重新校验的 expected artifact。"
            else
              echo "::error title=PUBLISH_PRODUCTION_NOT_UPDATED::真实生产 URL 未返回已验证的发布数据。"
            fi
            exit 1
          fi

  notify:
    name: 外部心跳告警
    needs:
      - prepare
      - update
      - publish
      - verify-production
    if: always() && needs.prepare.result != 'skipped'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 报告每日更新结果
        continue-on-error: true
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.ICLOUD_HEALTHCHECK_PING_URL }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SHOULD_RUN: ${{ needs.prepare.outputs.should_run }}
          UPDATE_RESULT: ${{ needs.update.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_OUTCOME: ${{ needs.publish.outputs.publish_outcome }}
          VERIFY_RESULT: ${{ needs.verify-production.result }}
          PREPARE_SEVERE_FAILURE: ${{ needs.prepare.outputs.severe_failure }}
          UPDATE_SEVERE_FAILURE: ${{ needs.update.outputs.severe_failure }}
          PUBLISH_SEVERE_FAILURE: ${{ needs.publish.outputs.severe_failure }}
          VERIFY_SEVERE_FAILURE: ${{ needs.verify-production.outputs.severe_failure }}
        shell: bash
        run: |
          if [[ -z "$HEALTHCHECK_PING_URL" ]]; then
            echo "未配置 ICLOUD_HEALTHCHECK_PING_URL，跳过第三方心跳。"
            exit 0
          fi
          if [[ "$PREPARE_SEVERE_FAILURE" == true ]] \
            || [[ "$UPDATE_SEVERE_FAILURE" == true ]] \
            || [[ "$PUBLISH_SEVERE_FAILURE" == true ]] \
            || [[ "$VERIFY_SEVERE_FAILURE" == true ]]; then
            status=1
          elif [[ "$PREPARE_RESULT" == success ]] \
            && { [[ "$SHOULD_RUN" != true ]] \
              || { [[ "$UPDATE_RESULT" == success ]] \
                && [[ "$PUBLISH_RESULT" == success ]] \
                && [[ "$VERIFY_RESULT" == success ]] \
                && { [[ "$PUBLISH_OUTCOME" == published ]] || [[ "$PUBLISH_OUTCOME" == no_data_changes ]]; }; }; }; then
            status=0
          else
            echo "本次属于单次暂时故障，不发送失败信号；由 Healthchecks 连续缺少成功心跳的宽限期处理。"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 --retry 3 -- "${HEALTHCHECK_PING_URL%/}/$status"
