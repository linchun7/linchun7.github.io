name: Patch iCloud publication evidence docs 20260916

on:
  push:
    branches:
      - fix/icloud-publication-source-evidence-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出修复分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 同步 publication evidence 文档契约
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'tools/icloud_price_comparison/README.md': (
              '- 记录地区、容量的新增和移除；已存在的市场身份和历史不会因为暂时下线而重新分配。',
              '- 记录地区、容量的新增和移除；Apple 来源名称发生变化时，发布日期变化证据按 Apple 原始 `country` 名称保留“旧名称移除 + 新名称新增”，即使两者继续映射到同一个稳定 `marketId`；价格历史仍按 `marketId` 连续累计，不因来源 wording 变化而 rekey。'
            ),
            'tools/icloud_price_comparison/ARCHITECTURE.md': (
              '- 一对一 removed/added rename 候选仍要求显式确认，不做模糊自动绑定。',
              '- 一对一 removed/added rename 候选仍要求显式确认，不做模糊自动绑定。\n- `marketId` 只定义长期价格/历史身份，不覆盖 Apple source evidence：`sourcePublishedDates[].changes` 必须按规范化 Apple 快照中的原始 `country` 名称比较，因此 source wording 从旧名变为新名时仍记录“旧名移除 + 新名新增”；这与价格事件继续归入同一 `marketId` 并不冲突。'
            ),
            'tools/icloud_price_comparison/OPERATIONS.md': (
              '- 不做模糊 market rename 自动绑定；只有严格高置信 identity ambiguity 才要求维护者显式增加 alias。',
              '- 不做模糊 market rename 自动绑定；只有严格高置信 identity ambiguity 才要求维护者显式增加 alias。\n- 运维审计必须区分“稳定市场身份”和“Apple 来源证据”：价格/币种历史按永久 `marketId` 连续；发布日期事件的 `changes` 按 Apple 快照原始 `country` 名称取证。若 Apple 只改 source wording，同一 `marketId` 可以保持不变，但 publication evidence 仍应显示旧名移除与新名新增。'
            )
          }

          for file_name, (old, new) in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{file_name}: expected one documentation anchor, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: 提交文档并移除一次性工作流
        run: |
          git config user.name linchun7
          git config user.email 104673731+linchun7@users.noreply.github.com
          git add tools/icloud_price_comparison/README.md tools/icloud_price_comparison/ARCHITECTURE.md tools/icloud_price_comparison/OPERATIONS.md
          git rm .github/workflows/patch-icloud-publication-docs-20260916.yml
          git commit -m "docs: clarify Apple publication source evidence"
          git push origin HEAD:fix/icloud-publication-source-evidence-20260916
