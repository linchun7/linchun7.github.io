name: Temporary hospital UI polish main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-hospital-ui-polish-main.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/hospital-rank-copy-layout-20260819
      - name: Execute branch-local one-time update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-hospital-ui-polish.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in workflow:
              raise SystemExit('branch-local update block not found')
          block = workflow.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  break
          Path('/tmp/hospital-ui-polish.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/hospital-ui-polish.sh
