name: iCloud isolated final review (temporary)
on:
  push:
    branches: [repair/icloud-final-review-20260916]
    paths: [.github/workflows/icloud-final-review-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: icloud-isolated-final-review
  cancel-in-progress: false
jobs:
  stage:
    name: Stage immutable reviewed file objects (no ref writes)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d3e573d9626de11ab139da229734094c8ba800c5
          persist-credentials: false
      - name: Apply exact authored edits and stage immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, tarfile, urllib.request
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == 'd3e573d9626de11ab139da229734094c8ba800c5'
          repo = 'linchun7/linchun7.github.io'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          def api(suffix, payload=None):
              req = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs'+suffix,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response: return json.load(response)
          parts = ['2139b8f850cc5bf278ac00cd55e58716d1051419','394ae5ab544279b63b676461802d8d2365f2d30f','d3401d56e7bcd2018a5f39d27e34d67a2a6f7ee1','0e58ea12e4beec1916956cbed9db58ff98a79277','ab9cb50396a49c16ea1e8d10619229b226970bca','ca94ad76430b7f4bdc1b82695903282f887a4071']
          def blob_hash(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          script = b''
          for sha in parts:
              item = api('/'+sha)
              data = base64.b64decode(item['content'])
              assert item['sha'] == blob_hash(data) == sha
              script += data
          assert hashlib.sha256(script).hexdigest() == 'ec8a1ad1afae76ea23e41d8dc80c98e2af3e0d3e40a177ecae554c4ca4826936'
          target = pathlib.Path(os.environ['RUNNER_TEMP'])/'review-repair.py'
          target.write_bytes(script)
          subprocess.run(['python3',str(target)], check=True)
          subprocess.run(['git','diff','--check'], check=True)
          names = re.findall(r"apply\('([^']+)'", script.decode())
          assert len(names) == len(set(names)) == 19
          tree = []
          for name in names:
              assert name == '.github/workflows/update-icloud-prices.yml' or name.startswith('tools/icloud_price_comparison/')
              data = pathlib.Path(name).read_bytes()
              sha = blob_hash(data)
              created = api('', {'encoding':'base64','content':base64.b64encode(data).decode()})
              assert created['sha'] == sha
              tree.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'review-staged'
          out.mkdir()
          (out/'repair-tree.json').write_text(json.dumps(tree,indent=2)+'\n')
          with tarfile.open(out/'repair-files.tar.gz','w:gz') as archive:
              for name in names: archive.add(name,arcname=name)
          print(json.dumps(tree,indent=2))
          print('All 19 authored-file hashes verified; no commit, ref, production data or dispatch was written by this job.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: icloud-reviewed-files
          path: ${{ runner.temp }}/review-staged
          retention-days: 1
  acceptance:
    name: Read-only real updater candidate acceptance
    needs: stage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d3e573d9626de11ab139da229734094c8ba800c5
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: icloud-reviewed-files
          path: ${{ runner.temp }}/review-staged
      - name: Restore and verify exactly the reviewed source files
        run: |
          tar -xzf "$RUNNER_TEMP/review-staged/repair-files.tar.gz" --no-same-owner
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          for entry in json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'review-staged/repair-tree.json').read_text()):
              data=pathlib.Path(entry['path']).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==entry['sha']
          PY
          git diff --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install fixed dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify current production baseline and evidence
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm validate:artifact
          pnpm validate:snapshots
          pnpm audit --audit-level low
          node scripts/verify-production-deployment.mjs --expected-data-dir data --current-main-data-dir data --run-id "$GITHUB_RUN_ID"
          cp data/prices.json "$RUNNER_TEMP/prices-before.json"
          cp data/history.json "$RUNNER_TEMP/history-before.json"
      - name: Real Apple candidate, complete regression and independent validation
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm check:live
          pnpm update:data
          pnpm render:static
          pnpm render:static:check
          pnpm test:data
          pnpm test:core
          pnpm test:ui
          pnpm validate:snapshots
          pnpm validate:artifact
      - name: Explicit identity, rename and online evidence assertions
        working-directory: tools/icloud_price_comparison
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read = (name) => JSON.parse(fs.readFileSync(name));
          const prices=read('data/prices.json'), history=read('data/history.json'), index=read('data/apple-snapshots/index.json');
          const before=read(process.env.RUNNER_TEMP+'/history-before.json');
          assert.equal(prices.source.parser,'cross-checked');
          for (const [id,record] of Object.entries(before.markets)) {
            assert.ok(history.markets[id]);
            assert.deepEqual(history.markets[id].events.slice(0,record.events.length),record.events);
          }
          assert.equal(prices.countries.find(c=>c.country==="Cote D'Ivoire").marketId,'ci');
          const rename=history.sourcePublishedDates.find(p=>p.changes?.removedCountries?.some(c=>c.country==='Ivory Coast') && p.changes?.addedCountries?.some(c=>c.country==="Cote D'Ivoire"));
          assert.ok(rename,'source-name publication evidence must survive');
          const [id, af]=Object.entries(history.markets).find(([,r])=>r.country==='Afghanistan');
          assert.equal(id,'apple-afghanistan-5dbddf91');
          const event=af.events[0];
          assert.ok(event.observedAtUtc);
          const rev=index.snapshots.flatMap(p=>p.revisions.map(r=>({p,r}))).find(({r})=>read('data/apple-snapshots/'+r.dataFile).countries.some(c=>c.country==='Afghanistan'));
          assert.equal(event.observedAt,rev.r.firstConfirmedDate);
          assert.ok(rev.p.publishedDate<=event.observedAt);
          console.log(JSON.stringify({countries:prices.countries.length,pricePoints:prices.countries.reduce((n,c)=>n+Object.keys(c.plans).length,0),parser:prices.source.parser,publishedDate:prices.source.publishedDate,marketId:id,liveObservation:event.observedAt,observedAtUtc:event.observedAtUtc,firstConfirmedDate:rev.r.firstConfirmedDate,sourceRenameEvidence:true}));
          JS
      - name: Export isolated candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: icloud-final-review-candidate
          path: |
            tools/icloud_price_comparison/data
            tools/icloud_price_comparison/index.html
            tools/icloud_price_comparison/artifacts
          if-no-files-found: error
          retention-days: 1
