name: Temporary iCloud documentation sync

on:
  push:
    branches:
      - agent/icloud-docs-sync
    paths:
      - '.github/workflows/temp-icloud-docs-sync.yml'

permissions:
  contents: write

concurrency:
  group: temp-icloud-docs-sync
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-docs-sync
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Synchronize documentation and remove one-shot files
        shell: bash
        run: |
          python tools/icloud_price_comparison/scripts/temp-doc-sync.py
          rm tools/icloud_price_comparison/scripts/temp-doc-sync.py
          rm .github/workflows/temp-icloud-docs-sync.yml

      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run documentation and project contracts
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm test:core
          pnpm validate:artifact
          pnpm validate:snapshots

      - name: Check diff formatting
        run: git diff --check

      - name: Commit final documentation sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize iCloud identity and SEO documentation"
          git push origin HEAD:agent/icloud-docs-sync
