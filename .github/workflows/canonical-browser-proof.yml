name: Read-only canonical browser proof
on:
  push:
    branches: ['duo/canonical-proof-20261116']
permissions:
  contents: read
jobs:
  canonical-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install pinned browser and Chinese fonts
        working-directory: tools/chatgpt_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify canonical pages and capture requested screenshots
        working-directory: tools/chatgpt_price_comparison
        env:
          SOURCE_COMMIT: cbfc09795e05498dd33df4293ca2fdd0ce3fe04c
        run: node scripts/canonical-proof.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: canonical-browser-proof
          path: tools/chatgpt_price_comparison/proof-output
          if-no-files-found: error
          retention-days: 7
