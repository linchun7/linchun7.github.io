# Historical filename retained to avoid creating another long-lived GitHub Actions workflow identity.
name: Auto-merge verified Dependabot updates

on:
  workflow_run:
    workflows:
      - Validate iCloud price comparison
      - Validate static tools
      - Validate Action artifact roundtrip
    branches:
      - 'dependabot/**'
    types:
      - completed

permissions: {}

concurrency:
  group: auto-merge-verified-dependabot
  cancel-in-progress: false

jobs:
  merge:
    name: 验证并自动合并可信依赖更新
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      (
        (
          github.event.workflow_run.name == 'Validate iCloud price comparison' &&
          (
            startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/') ||
            startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/tools/icloud_price_comparison/')
          )
        ) ||
        (
          github.event.workflow_run.name == 'Validate static tools' &&
          (
            startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/') ||
            startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/tools/browser-tests/')
          )
        ) ||
        (
          github.event.workflow_run.name == 'Validate Action artifact roundtrip' &&
          startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/')
        )
      )
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 判断 artifact 验证是否关联当前 PR
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'should_run=true' >> "$GITHUB_OUTPUT"
          if [[ "$VALIDATION_WORKFLOW" != 'Validate Action artifact roundtrip' ]]; then
            exit 0
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            -o "$RUNNER_TEMP/dependabot-pr-files.json"

          if node - "$RUNNER_TEMP/dependabot-pr-files.json" <<'NODE'
          const fs = require('node:fs');
          const files = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(files) || files.length === 0 || files.length > 20) process.exit(2);
          let uncertain = false;
          const relevant = files.some((file) => {
            if (typeof file.patch !== 'string') {
              uncertain = true;
              return false;
            }
            return file.patch.split('\n').some((line) => /^[+-]\s*uses:\s*actions\/(?:upload-artifact|download-artifact)@/.test(line));
          });
          if (relevant || uncertain) process.exit(0);
          process.exit(1);
          NODE
          then
            exit 0
          fi

          echo 'should_run=false' >> "$GITHUB_OUTPUT"
          echo 'Artifact roundtrip succeeded, but this PR does not update upload/download-artifact; no merge attempt is needed.'

      - name: 检出默认分支的可信校验器
        if: steps.route.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 配置 Node.js
        if: steps.route.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 校验并合并已测试的精确提交
        if: steps.route.outputs.should_run == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          RUN_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: node tools/icloud_price_comparison/scripts/auto-merge-official-actions.mjs
