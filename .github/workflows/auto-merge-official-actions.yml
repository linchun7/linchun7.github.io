name: Auto-merge official GitHub Actions updates

on:
  workflow_run:
    workflows:
      - Validate iCloud price comparison
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: 验证并自动合并官方 Action 更新
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/') &&
      github.event.workflow_run.pull_requests[0].number > 0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出默认分支的可信校验器
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: 校验并合并已测试的精确提交
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          RUN_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tools/icloud_price_comparison/scripts/auto-merge-official-actions.mjs
