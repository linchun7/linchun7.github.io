name: Render hospital rank static snapshot once

on:
  push:
    branches: [agent/hospital-rank-performance-ux-20260819]
    paths:
      - '.github/workflows/hospital-rank-render-static-once.yml'
      - 'tools/hospital_rank/index.html'
      - 'tools/hospital_rank/data/rankings.json'
      - 'tools/hospital_rank/scripts/render_static.py'

permissions:
  contents: write

concurrency:
  group: hospital-rank-render-static-once
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出当前分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/hospital-rank-performance-ux-20260819
          fetch-depth: 0

      - name: 生成静态首屏
        run: python3 tools/hospital_rank/scripts/render_static.py

      - name: 校验生成结果
        run: |
          python3 tools/hospital_rank/scripts/render_static.py --check
          python3 tools/hospital_rank/scripts/validate_data.py
          git diff --check

      - name: 提交生成结果并自删除
        run: |
          rm .github/workflows/hospital-rank-render-static-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/hospital_rank/index.html .github/workflows/hospital-rank-render-static-once.yml
          git commit -m '生成医院榜单静态首屏'
          git push origin HEAD:agent/hospital-rank-performance-ux-20260819
