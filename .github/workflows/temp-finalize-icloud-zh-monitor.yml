name: TEMP diagnose iCloud publication UI

on:
  push:
    branches:
      - fix/icloud-zh-market-monitor-v2

permissions:
  contents: read

concurrency:
  group: temp-finalize-icloud-zh-monitor-v2
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 安装依赖
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: 仅运行主 UI smoke 并保留完整失败上下文
        working-directory: tools/icloud_price_comparison
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-name-pattern="renders current prices, sorting, and country history in a real browser" test/ui-smoke.test.mjs 2>&1 | tee /tmp/ui-publication.log
