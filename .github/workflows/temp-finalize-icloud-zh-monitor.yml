name: TEMP accept iCloud zh monitor

on:
  push:
    branches:
      - fix/icloud-zh-market-monitor-v2

permissions:
  contents: read

concurrency:
  group: temp-finalize-icloud-zh-monitor-v2
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 安装依赖
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: 针对性监测与展示测试
        working-directory: tools/icloud_price_comparison
        run: node --test --test-concurrency=1 test/followup-hardening.test.mjs test/automation-policy.test.mjs

      - name: 真实 Apple 中文页验收
        working-directory: tools/icloud_price_comparison
        run: node scripts/check-apple-zh-markets.mjs

      - name: 最终仓库形态完整 core
        shell: bash
        run: |
          rm -f .github/workflows/temp-finalize-icloud-zh-monitor.yml .github/temp-finalize-icloud-zh-monitor.py
          cd tools/icloud_price_comparison
          pnpm test:core

      - name: 安装 Chromium
        working-directory: tools/icloud_price_comparison
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium UI 验收
        working-directory: tools/icloud_price_comparison
        run: pnpm test:ui
