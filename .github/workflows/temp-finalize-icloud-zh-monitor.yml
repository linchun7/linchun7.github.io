name: TEMP finalize iCloud zh monitor

on:
  push:
    branches:
      - fix/icloud-zh-market-monitor-v2

permissions:
  contents: write

concurrency:
  group: temp-finalize-icloud-zh-monitor-v2
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 安装依赖
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: 应用最终产品补丁
        run: python3 .github/temp-finalize-icloud-zh-monitor.py

      - name: 刷新静态资源契约
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm assets:update
          pnpm render:static
          pnpm render:static:check

      - name: 针对性测试
        working-directory: tools/icloud_price_comparison
        run: node --test --test-concurrency=1 test/followup-hardening.test.mjs

      - name: 真实访问 Apple 中文页验收
        working-directory: tools/icloud_price_comparison
        run: node scripts/check-apple-zh-markets.mjs

      - name: 提交产品文件（如有变化）
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/icloud_price_comparison; then
            echo "Product tree already finalized; no push needed."
          else
            git config user.name "linchun7"
            git config user.email "104673731+linchun7@users.noreply.github.com"
            git add tools/icloud_price_comparison
            git commit -m "feat: finalize resilient Apple Chinese market monitoring"
            git push origin HEAD:fix/icloud-zh-market-monitor-v2
          fi

      - name: 按最终仓库形态运行完整 core
        shell: bash
        run: |
          rm -f .github/workflows/temp-finalize-icloud-zh-monitor.yml .github/temp-finalize-icloud-zh-monitor.py
          cd tools/icloud_price_comparison
          pnpm test:core

      - name: 安装 Chromium
        working-directory: tools/icloud_price_comparison
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium UI 验收
        working-directory: tools/icloud_price_comparison
        run: pnpm test:ui
