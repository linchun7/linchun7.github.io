name: TEMP finalize iCloud metadata changes

on:
  push:
    branches:
      - fix/icloud-zh-market-monitor-v2

permissions:
  contents: write

concurrency:
  group: temp-finalize-icloud-zh-monitor-v2
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 修复最后一条 UI 回归测试语法
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/icloud_price_comparison/test/ui-smoke.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "        assert.doesNotMatch(septemberChangeText, /移除地区：[^\n]*科特迪瓦/);"
          new = "        const removedCountryGroup = septemberChangeText.split('\\n').find((line) => line.startsWith('移除地区：')) ?? '';\n        assert.equal(removedCountryGroup.includes('科特迪瓦'), false);"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          elif "const removedCountryGroup = septemberChangeText.split('\\n')" not in text:
              raise SystemExit('Expected malformed UI assertion was not found')
          PY
          node --check tools/icloud_price_comparison/test/ui-smoke.test.mjs

      - name: 安装依赖
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: 针对性测试
        working-directory: tools/icloud_price_comparison
        run: node --test --test-concurrency=1 test/followup-hardening.test.mjs

      - name: 真实 Apple 中文页验收
        working-directory: tools/icloud_price_comparison
        run: node scripts/check-apple-zh-markets.mjs

      - name: 最终仓库形态完整 core
        shell: bash
        run: |
          rm -f .github/workflows/temp-finalize-icloud-zh-monitor.yml .github/temp-finalize-icloud-zh-monitor.py
          cd tools/icloud_price_comparison
          pnpm test:core

      - name: 安装三浏览器
        working-directory: tools/icloud_price_comparison
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: 三浏览器 UI 验收
        working-directory: tools/icloud_price_comparison
        run: pnpm test:browsers

      - name: Diff 与临时文件检查
        shell: bash
        run: |
          git diff --check
          test ! -e .github/workflows/temp-finalize-icloud-zh-monitor.yml
          test ! -e .github/temp-finalize-icloud-zh-monitor.py

      - name: 提交已通过验收的 UI 测试修复
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/icloud_price_comparison/test/ui-smoke.test.mjs
          if git diff --cached --quiet; then
            echo 'No UI test patch needed.'
            exit 0
          fi
          git commit -m "test: cover publication rename presentation"
          git push origin HEAD:fix/icloud-zh-market-monitor-v2
