name: iCloud table coverage acceptance (temporary)
on:
  push:
    branches: [repair/icloud-table-coverage-20260916]
    paths: [.github/workflows/icloud-table-coverage-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: icloud-table-coverage-review
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b0ce3d71a16303e2c5660769c538f6bde8cc4c1
          persist-credentials: false
      - name: Apply reviewer-authored exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/review.patch" <<'PATCH'
          diff --git a/tools/icloud_price_comparison/ARCHITECTURE.md b/tools/icloud_price_comparison/ARCHITECTURE.md
          index 33e64fe..29deb4a 100644
          --- a/tools/icloud_price_comparison/ARCHITECTURE.md
          +++ b/tools/icloud_price_comparison/ARCHITECTURE.md
          @@ -231,3 +231,5 @@ Apple 108047 可能以历史逐市场列表或按地区 `Country (Currency)` 表
           `market-evidence.mjs` 统一快照证据中的首次规范化 source-name → 永久 ID 绑定及精确日期锚点。已发布的未知名称仅改大小写时，不能重新哈希；历史声称的 ID 也不能充当自己的证据。已保留的永久 ID 不再作为 removed/added rename 候选；真正冲突和未确认的一对一 rename 仍阻塞。
           
           archive importer 重放完整 snapshot ledger（包括此前 live revision），而非只拼本次输入与最新价格；保留可精确匹配证据的 live UTC 观察记录。`history.updatedAt` 是与当前价格批次一致的 as-of 水位，回填不是一次新的 Apple 观察，导入执行时间只写运维日志。在线事件与回填事件仍只能命中 revision 的 `firstConfirmedDate` 或 `publishedDate`，不使用时间范围容忍。
          +
          +区域完整性必须对 region 内的全部表格取证，而非只枚举已经识别的表头。合法区域表拆成“可识别部分 + 未识别部分”时，两路 parser 都必须拒绝，不能将遗漏行解释为已确认市场移除；区域外由独立标题界定的无关表格不参与价格解析。
          diff --git a/tools/icloud_price_comparison/scripts/parse-price-tables.mjs b/tools/icloud_price_comparison/scripts/parse-price-tables.mjs
          index 4f4c7ef..c7bd11c 100644
          --- a/tools/icloud_price_comparison/scripts/parse-price-tables.mjs
          +++ b/tools/icloud_price_comparison/scripts/parse-price-tables.mjs
          @@ -329,7 +329,10 @@ function parseByDocumentOrder($, options) {
           
             for (const node of nodes) {
               if ($(node).is('table')) {
          -      if (!isPotentialPricingTable($, node)) continue;
          +      if (!isPotentialPricingTable($, node)) {
          +        if (currentRegion) throw new Error(`Unrecognized table inside Apple pricing section #${currentSectionId}`);
          +        continue;
          +      }
                 if (!currentRegion || !currentSectionId) throw new Error('Apple pricing table was found before a region heading');
                 if (seenTables.has(currentSectionId)) throw new Error(`Multiple Apple pricing tables found for #${currentSectionId}`);
                 countries.push(...parsePricingTable($, node, currentRegion, options));
          @@ -356,13 +359,16 @@ function parseByAppleMarkers($, options) {
             const countries = [];
             const foundRegions = new Set();
             const seenTables = new Set();
          -  const nodes = $('#nasalac, #emea, #ap, table').toArray();
          +  const nodes = $('#nasalac, #emea, #ap, h2, h3, table').toArray();
             let currentRegion = null;
             let currentSectionId = null;
           
             for (const node of nodes) {
               if ($(node).is('table')) {
          -      if (!isPotentialPricingTable($, node)) continue;
          +      if (!isPotentialPricingTable($, node)) {
          +        if (currentRegion) throw new Error(`Unrecognized table inside Apple marker pricing section #${currentSectionId}`);
          +        continue;
          +      }
                 if (!currentRegion || !currentSectionId) throw new Error('Apple marker parser found a pricing table before a region marker');
                 if (seenTables.has(currentSectionId)) throw new Error(`Multiple Apple marker pricing tables found for #${currentSectionId}`);
                 countries.push(...parsePricingColumns($, node, currentRegion, options));
          @@ -370,7 +376,13 @@ function parseByAppleMarkers($, options) {
                 continue;
               }
               const sectionId = $(node).attr('id');
          -    if (!REGIONS[sectionId]) continue;
          +    if (!REGIONS[sectionId]) {
          +      if ($(node).is('h2, h3')) {
          +        currentRegion = null;
          +        currentSectionId = null;
          +      }
          +      continue;
          +    }
               currentRegion = REGIONS[sectionId];
               currentSectionId = sectionId;
               foundRegions.add(sectionId);
          diff --git a/tools/icloud_price_comparison/test/parse-price-tables.test.mjs b/tools/icloud_price_comparison/test/parse-price-tables.test.mjs
          index 9db947a..f29c73b 100644
          --- a/tools/icloud_price_comparison/test/parse-price-tables.test.mjs
          +++ b/tools/icloud_price_comparison/test/parse-price-tables.test.mjs
          @@ -116,3 +116,31 @@ test('independent row and column decoders preserve prices under wrappers, column
             assert.equal(result.tiers.at(-1).id, '24TB');
             assert.ok(result.countries.every((c) => c.plans['24TB'].price === 999.99));
           });
          +
          +
          +test('accounts for every table in a pricing region rather than silently dropping an unfamiliar fragment', async (t) => {
          +  const { load } = await import('cheerio');
          +  for (const id of ['nasalac', 'emea', 'ap']) {
          +    for (const label of ['Market (Currency)', 'Country / Currency', '']) {
          +      await t.test(`${id}: ${label || 'missing header'}`, () => {
          +        const $ = load(CURRENT_TABLE_HTML);
          +        const table = $(`#${id}`).next('table');
          +        const fragment = table.clone();
          +        if (label) fragment.find('thead th').first().text(label);
          +        else fragment.find('thead').remove();
          +        table.after(fragment);
          +        assert.throws(() => parseApplePrices($.html()), /Unrecognized table inside Apple/);
          +      });
          +    }
          +  }
          +});
          +
          +test('ignores unrelated tables outside explicitly bounded pricing sections', async () => {
          +  const { load } = await import('cheerio');
          +  const $ = load(CURRENT_TABLE_HTML);
          +  $('body').prepend('<h2>About iCloud+</h2><table><tr><td>Storage features</td></tr></table>');
          +  $('body').append('<h2>Billing information</h2><table><tr><td>Help topics</td></tr></table>');
          +  const parsed = parseApplePrices($.html());
          +  assert.equal(parsed.parser, 'cross-checked');
          +  assert.deepEqual(parsed.countries, parseApplePrices(CURRENT_TABLE_HTML).countries);
          +});
          diff --git a/tools/icloud_price_comparison/test/production-loop.test.mjs b/tools/icloud_price_comparison/test/production-loop.test.mjs
          index 14741b5..80a8b1f 100644
          --- a/tools/icloud_price_comparison/test/production-loop.test.mjs
          +++ b/tools/icloud_price_comparison/test/production-loop.test.mjs
          @@ -131,6 +131,19 @@ test('canonical full loop binds live observations, revisions, source aliases and
             broken('table').first().remove();
             await assert.rejects(run(t, paths, [broken.html()], '2026-04-10T16:32:00Z'), /no interpretable pricing table/);
             assert.deepEqual(await allBytes(dataDir), prior, 'partial source must not modify any public file');
          +  // A split regional table must not turn an unrecognized fragment into a
          +  // confirmed market removal. Even identical network samples cannot prove
          +  // completeness when both decoders excluded the same DOM evidence.
          +  const split = load(sourceHtml(revised, '2026-04-10'));
          +  const table = split('table').first();
          +  const header = table.find('thead tr').clone();
          +  header.children().first().text('Market (Currency)');
          +  const fragment = split('<table><thead></thead><tbody></tbody></table>');
          +  fragment.find('thead').append(header);
          +  fragment.find('tbody').append(table.find('tbody tr').first());
          +  table.after(fragment);
          +  await assert.rejects(run(t, paths, [split.html(), split.html()], '2026-04-10T16:33:00Z'), /Unrecognized table inside Apple/);
          +  assert.deepEqual(await allBytes(dataDir), prior, 'ignored source fragments must not publish removals or alter evidence');
             // A later archive backfill must not erase already witnessed live revisions.
             const archiveDir = path.join(root, 'archive');
             await mkdir(archiveDir);
          PATCH
          git apply --check "$RUNNER_TEMP/review.patch"
          git apply "$RUNNER_TEMP/review.patch"
          git diff --check
      - name: Verify exact reviewer hashes and upload immutable Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path('tools/icloud_price_comparison')
          expected = {'ARCHITECTURE.md':'29deb4a351ff3965e843d10578cd1c133876cacc','scripts/parse-price-tables.mjs':'c7bd11cb40f67f280fe1a80b98127938f9c9c082','test/parse-price-tables.test.mjs':'f29c73b0543b52ecffb1e9506a4a8e400f673229','test/production-loop.test.mjs':'80a8b1fb646113691ee5cdf46cec988c1e2a9043'}
          contents = {}
          for name, sha in expected.items():
            data = (root/name).read_bytes()
            assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha, name
            contents[name] = data
          entries = []
          for name, data in contents.items():
            request = urllib.request.Request('https://api.github.com/repos/linchun7/linchun7.github.io/git/blobs', data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request, timeout=30) as response: result = json.load(response)
            assert result['sha'] == expected[name]
            entries.append({'path':str(root/name),'mode':'100644','type':'blob','sha':result['sha']})
          pathlib.Path(os.environ['RUNNER_TEMP'],'review-tree.json').write_text(json.dumps(entries,indent=2))
          print(json.dumps(entries,indent=2))
          PY
          tar -czf "$RUNNER_TEMP/reviewed-files.tar.gz" tools/icloud_price_comparison/ARCHITECTURE.md tools/icloud_price_comparison/scripts/parse-price-tables.mjs tools/icloud_price_comparison/test/parse-price-tables.test.mjs tools/icloud_price_comparison/test/production-loop.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: table-coverage-reviewed-files
          path: |
            ${{ runner.temp }}/reviewed-files.tar.gz
            ${{ runner.temp }}/review-tree.json
          retention-days: 1
          if-no-files-found: error
  acceptance:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b0ce3d71a16303e2c5660769c538f6bde8cc4c1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: table-coverage-reviewed-files
          path: ${{ runner.temp }}/review
      - name: Apply hash-verified files without changing production
        working-directory: .
        run: |
          tar -xzf "$RUNNER_TEMP/review/reviewed-files.tar.gz"
          cp -a tools/icloud_price_comparison/data "$RUNNER_TEMP/published-data"
          git diff --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Current artifact, snapshots, live Apple and production baseline
        run: |
          pnpm validate:artifact
          pnpm validate:snapshots
          pnpm check:live
          node scripts/verify-production-deployment.mjs --expected-data-dir "$RUNNER_TEMP/published-data" --current-main-data-dir "$RUNNER_TEMP/published-data" --run-id "$GITHUB_RUN_ID"
      - name: Generate and validate a real candidate
        run: |
          pnpm update:data
          pnpm test:data
          pnpm render:static
          pnpm render:static:check
          pnpm test:core
          pnpm validate:artifact
          pnpm validate:snapshots
          pnpm audit --audit-level low
          pnpm test:ui
          pnpm validate:artifact
      - name: Preserve candidate evidence
        if: always()
        working-directory: .
        run: |
          tar -czf "$RUNNER_TEMP/candidate.tar.gz" tools/icloud_price_comparison/data tools/icloud_price_comparison/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: table-coverage-live-candidate
          path: ${{ runner.temp }}/candidate.tar.gz
          retention-days: 1
          if-no-files-found: error
