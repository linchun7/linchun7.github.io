name: Temporary iCloud market metadata fix

on:
  push:
    branches: [fix/icloud-market-metadata-summary]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Apply exact patch
        run: python3 .github/temp-icloud-market-metadata-fix.py
      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused tests
        working-directory: tools/icloud_price_comparison
        run: node --test --test-concurrency=1 test/market-registry.test.mjs test/update-prices.test.mjs test/documentation-contract.test.mjs
      - name: Run full core suite
        working-directory: tools/icloud_price_comparison
        run: pnpm test:core
      - name: Commit tested changes
        run: |
          rm .github/workflows/temp-icloud-market-metadata-fix.yml .github/temp-icloud-market-metadata-fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: clarify permanent market identity review state"
          git push origin HEAD:fix/icloud-market-metadata-summary
