name: Temporary iCloud workflow contract validation

on:
  push:
    branches:
      - agent/icloud-followup-hardening

permissions:
  contents: write

jobs:
  repair-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-followup-hardening
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Apply contract repair
        run: python tools/icloud_price_comparison/scripts/.temporary-workflow-contract-repair.py
      - name: Hide temporary files from final-tree tests
        run: |
          rm .github/workflows/temporary-icloud-workflow-contract.yml
          rm tools/icloud_price_comparison/scripts/.temporary-workflow-contract-repair.py
      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate final product tree
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm test:core
          pnpm validate:artifact
          pnpm validate:snapshots
      - name: Commit contract test repair
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/icloud_price_comparison
          git diff --cached --check
          git commit -m "Test immutable iCloud PR validation gates"
          git push origin HEAD:agent/icloud-followup-hardening
