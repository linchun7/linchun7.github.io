name: Validate ChatGPT price comparison
on:
  pull_request:
    paths: ['tools/chatgpt_price_comparison/**', '.github/workflows/*chatgpt*.yml']
  push:
    branches: [main]
    paths: ['tools/chatgpt_price_comparison/**', '.github/workflows/*chatgpt*.yml']
permissions:
  contents: read
concurrency:
  group: validate-chatgpt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Focused official App Store schema regressions
        run: python3 -m unittest discover -s tools/chatgpt_price_comparison/scripts -p 'test_appstore_schema.py' -v
      - name: Unit tests and deterministic browser fixture
        run: |
          python3 -m unittest discover -s tools/chatgpt_price_comparison/scripts -p 'test_*.py' -v
          node --check tools/chatgpt_price_comparison/app.js
          node tools/chatgpt_price_comparison/scripts/test-verify-production.mjs
          python3 - <<'PY'
          import copy, json, sys
          sys.path.insert(0, 'tools/chatgpt_price_comparison/scripts')
          import pipeline, minimum_history
          from test_pipeline import data_fixture, revise

          data = data_fixture()
          data['fx']['updated_at'] = pipeline.stamp(pipeline.epoch(data['generated_at']) - 86400)

          market = data['markets'][0]
          for label, amount in [('ChatGPT Future Alpha', '44'), ('ChatGPT Future Beta', '66')]:
              market['offers'].append({
                  'label': label,
                  'amounts': [{
                      'amount': amount,
                      'display': 'USD ' + amount + '.00',
                      'cny': pipeline.converted(
                          market, amount, data['fx'], pipeline.epoch(data['generated_at'])
                      ),
                  }],
              })
          market['offers'] = sorted(market['offers'], key=lambda offer: offer['label'])
          market['fingerprint'] = pipeline.digest(pipeline.semantic(market))

          missing_fx = copy.deepcopy(market)
          missing_fx['code'] = 'de'
          missing_fx['name'] = '缺汇率测试'
          missing_fx['currency'] = 'EUR'
          missing_fx['source_url'] = pipeline.url_for('de')
          display_by_amount = {
              '8': '8,00 €',
              '19.99': '19,99 €',
              '44': '44,00 €',
              '66': '66,00 €',
              '200': '200,00 €',
          }
          for offer in missing_fx['offers']:
              for amount in offer['amounts']:
                  amount['display'] = display_by_amount[amount['amount']]
                  amount['cny'] = None
          missing_fx['fingerprint'] = pipeline.digest(pipeline.semantic(missing_fx))
          data['markets'].append(missing_fx)

          revise(data)
          pipeline.validate(data)
          (pipeline.ROOT/'data').mkdir(exist_ok=True)
          (pipeline.ROOT/'data/prices.json').write_text(json.dumps(data, ensure_ascii=False))
          fixture_history = minimum_history.advance_history(minimum_history.empty_history(), data)
          (pipeline.ROOT/'data/minimum-history.json').write_text(json.dumps(fixture_history, ensure_ascii=False))
          (pipeline.ROOT/'index.html').write_text(
              pipeline.render(data, (pipeline.ROOT/'index.template.html').read_text())
          )
          PY
          REQUIRE_FUTURE_PLAN=1 node tools/chatgpt_price_comparison/scripts/browser-test.mjs
          python3 tools/chatgpt_price_comparison/scripts/browser-state-fixtures.py


  browser-matrix:
    name: Browser smoke (${{ matrix.browser }})
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: tools/chatgpt_price_comparison
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version
      - name: Install locked browser-test dependency
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit browser-test dependency
        if: matrix.browser == 'chromium'
        run: pnpm audit --audit-level low
      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.browser }} smoke
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: pnpm test:browser-matrix


  production-smoke:
    name: Verify deployed ChatGPT price page
    if: github.event_name == 'push'
    needs: [tests, browser-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Wait for Pages build of this commit or verified successor
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            read -r built_sha build_status build_error < <(
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/pages/builds/latest" \
                --jq '[.commit, .status, (.error.message // "")] | @tsv'
            )
            relation=unrelated
            if [[ "$built_sha" == "$TARGET_SHA" ]]; then
              relation=identical
            elif [[ "$built_sha" =~ ^[0-9a-f]{40}$ ]]; then
              compare_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET_SHA...$built_sha" --jq '.status' 2>/dev/null || true)
              [[ "$compare_status" == ahead ]] && relation=successor
            fi
            if [[ "$relation" == identical || "$relation" == successor ]]; then
              if [[ "$build_status" == built ]]; then
                if [[ "$relation" == successor ]]; then
                  git fetch origin "$built_sha" --depth=1
                  diff_status=0
                  python3 tools/chatgpt_price_comparison/scripts/deployment_scope.py --base "$TARGET_SHA" --head "$built_sha" || diff_status=$?
                  case "$diff_status" in
                    0) ;;
                    1)
                      echo "::notice title=SUPERSEDED_CHATGPT_BUILD::A later ChatGPT project commit is already deployed; this older validation run is superseded."
                      echo "should_verify=false" >> "$GITHUB_OUTPUT"
                      exit 0
                      ;;
                    *) echo "::error::Cannot establish ChatGPT deployment supersession."; exit "$diff_status" ;;
                  esac
                fi
                echo "Pages built $built_sha ($relation)."
                echo "should_verify=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$build_status" == errored || -n "$build_error" ]]; then
                echo "::error::Pages build failed: ${build_error:-$build_status}"
                exit 1
              fi
            fi
            sleep 5
          done
          echo "::error::Pages did not build this commit or a verified successor within 7.5 minutes."
          exit 1
      - name: Verify canonical JSON, minimum history, HTML and versioned assets
        id: verification
        continue-on-error: true
        if: steps.pages.outputs.should_verify == 'true'
        run: |
          node tools/chatgpt_price_comparison/scripts/verify-production.mjs \
            --expected tools/chatgpt_price_comparison/data/prices.json \
            --expected-minimum-history tools/chatgpt_price_comparison/data/minimum-history.json \
            --expected-index tools/chatgpt_price_comparison/index.html

      - name: Recheck supersession after failed production verification
        id: recheck
        if: ${{ !cancelled() && steps.verification.outcome == 'failure' }}
        env:
          BASE_SHA: ${{ github.sha }}
        shell: bash
        run: bash tools/chatgpt_price_comparison/scripts/recheck-production.sh

  live-source:
    name: Verify live App Store sources without publishing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture official source evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/chatgpt_price_comparison/scripts')
          import pipeline as p
          output = Path(os.environ['RUNNER_TEMP']) / 'chatgpt-source-evidence'
          output.mkdir()
          for code in ('us', 'jp', 'tr'):
              url = p.url_for(code) + '?l=en-US'
              text = p.fetch(url)
              (output / (code + '.html')).write_text(text, encoding='utf-8')
              nodes = list(p.Document(text).root.walk())
              script = next(n.text() for n in nodes if n.tag == 'script' and n.attrs.get('id') == 'serialized-server-data')
              annotations = [n for n in p.walk_json(json.loads(script)) if n.get('$kind') == 'Annotation' and 'Purchases' in n.get('title', '')]
              record = {'source_url': url, 'captured_at': p.stamp(), 'raw_sha256': hashlib.sha256(text.encode()).hexdigest(), 'annotations': annotations}
              (output / (code + '.json')).write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(record, ensure_ascii=False))
          PY
      - name: Verify all configured live markets and stage a publication candidate
        env:
          CANDIDATE: ${{ runner.temp }}/chatgpt-source-evidence/candidate
        run: |
          python3 tools/chatgpt_price_comparison/scripts/pipeline.py --output "$CANDIDATE"
          python3 tools/chatgpt_price_comparison/scripts/pipeline.py --check "$CANDIDATE"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/chatgpt_price_comparison/scripts')
          import pipeline as p
          baseline = json.loads((p.ROOT / 'data/prices.json').read_text())
          candidate = json.loads((Path(os.environ['CANDIDATE']) / 'prices.json').read_text())
          config = json.loads((p.ROOT / 'markets.json').read_text())
          expected = {m['code'] for m in config}
          assert len(expected) == 59 and {m['code'] for m in candidate['markets']} == expected
          assert all(m['status'] == 'verified' for m in candidate['markets']), p.source_summary(candidate['markets'])
          assert all(m['last_verified_at'] == candidate['generated_at'] for m in candidate['markets'])
          assert not candidate['fx']['fallback']
          previous = {m['code']: m for m in baseline['markets']}
          for market in candidate['markets']:
              assert market['history_baseline'] == previous[market['code']]['history_baseline']
          summary = {
              'verified_markets': len(candidate['markets']),
              'generated_at': candidate['generated_at'],
              'fx_updated_at': candidate['fx']['updated_at'],
              'data_revision': candidate['revision'],
              'price_date_label': p.price_date_label(candidate),
              'prior_changes_preserved': all(change in candidate['changes'] for change in baseline['changes']),
          }
          assert summary['prior_changes_preserved']
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          (Path(os.environ['CANDIDATE']) / 'validation-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chatgpt-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/chatgpt-source-evidence/
          if-no-files-found: error
          retention-days: 7