name: Temporary iCloud identity simplification

on:
  push:
    branches:
      - agent/icloud-simplify-market-identity
    paths:
      - '.github/workflows/tmp-icloud-simplify-market-identity.yml'
      - 'tools/icloud_price_comparison/scripts/_tmp_simplify_market_identity.py'
      - 'tools/icloud_price_comparison/scripts/_tmp_fix_simplify_patch.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-simplify-market-identity
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version
      - name: Install dependencies
        working-directory: tools/icloud_price_comparison
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply simplification
        run: |
          python tools/icloud_price_comparison/scripts/_tmp_fix_simplify_patch.py
          python tools/icloud_price_comparison/scripts/_tmp_simplify_market_identity.py
          rm tools/icloud_price_comparison/scripts/_tmp_simplify_market_identity.py
          rm tools/icloud_price_comparison/scripts/_tmp_fix_simplify_patch.py
          rm .github/workflows/tmp-icloud-simplify-market-identity.yml
      - name: Refresh generated assets
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm assets:update
          pnpm render:static
      - name: Check generated assets
        working-directory: tools/icloud_price_comparison
        run: |
          pnpm assets:check
          pnpm render:static:check
          pnpm test:vendor
      - name: Test documentation contract
        working-directory: tools/icloud_price_comparison
        run: node --test --test-concurrency=1 test/documentation-contract.test.mjs
      - name: Test market identity
        working-directory: tools/icloud_price_comparison
        run: node --test --test-concurrency=1 test/market-registry.test.mjs
      - name: Test workflow contracts
        working-directory: tools/icloud_price_comparison
        run: node --test --test-concurrency=1 test/automation-policy.test.mjs test/workflow.test.mjs
      - name: Test updater
        working-directory: tools/icloud_price_comparison
        run: node --test --test-concurrency=1 test/update-prices.test.mjs
      - name: Run full core suite
        working-directory: tools/icloud_price_comparison
        run: pnpm test:core
      - name: Validate current artifact
        working-directory: tools/icloud_price_comparison
        run: pnpm validate:artifact
      - name: Validate all snapshots
        working-directory: tools/icloud_price_comparison
        run: pnpm validate:snapshots
      - name: Check diff
        run: git diff --check
      - name: Commit project changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A tools/icloud_price_comparison
          git commit -m 'Simplify permanent market identity model'
          git push origin HEAD:agent/icloud-simplify-market-identity
