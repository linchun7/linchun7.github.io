name: Audit-only asset version sync

on:
  push:
    branches: [agent/final-icloud-repository-audit]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/final-icloud-repository-audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: |
          corepack enable
          cd tools/icloud_price_comparison
          pnpm assets:update
          cd ../..
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "tools/icloud_price_comparison/index.html"
          git add tools/icloud_price_comparison/index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: sync audited asset version'
          git push origin HEAD:agent/final-icloud-repository-audit
