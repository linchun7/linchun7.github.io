name: Prepare ChatGPT static projection
on:
  pull_request:
    paths:
      - '.github/workflows/render-chatgpt-projection.yml'
permissions:
  contents: read
jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Render unchanged data and emit exact reviewable patch
        run: |
          python3 - <<'PY'
          import base64, difflib, hashlib, json, subprocess, sys
          sys.path.insert(0, 'tools/chatgpt_price_comparison/scripts')
          import pipeline
          root = pipeline.ROOT
          data = json.loads((root / 'data/prices.json').read_text(encoding='utf-8'))
          before = (root / 'index.html').read_text(encoding='utf-8')
          after = pipeline.render(data, (root / 'index.template.html').read_text(encoding='utf-8'))
          path = 'tools/chatgpt_price_comparison/index.html'
          patch = ''.join(difflib.unified_diff(before.splitlines(keepends=True), after.splitlines(keepends=True), fromfile='a/' + path, tofile='b/' + path))
          encoded = base64.b64encode(patch.encode('utf-8')).decode('ascii')
          output = after.encode('utf-8')
          blob = hashlib.sha1(('blob ' + str(len(output)) + '\0').encode() + output).hexdigest()
          print('CHATGPT_PROJECTION_META=' + json.dumps({
              'head_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'base_sha256': hashlib.sha256(before.encode()).hexdigest(),
              'result_sha256': hashlib.sha256(output).hexdigest(),
              'result_git_blob': blob,
              'patch_base64_chars': len(encoded),
              'result_bytes': len(output),
              'source_collection_performed': False,
          }, sort_keys=True))
          for start in range(0, len(encoded), 6000):
              print(f'CHATGPT_PROJECTION_PART_{start:06d}=' + encoded[start:start + 6000])
          PY
