name: Review iCloud browser simplification

on:
  pull_request:
    paths:
      - 'tools/icloud_price_comparison/**'
      - '.github/workflows/review-icloud-browser-simplification.yml'

permissions:
  contents: read

concurrency:
  group: review-icloud-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-chrome:
    name: Repeated daily Chrome acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/icloud_price_comparison
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify missing-browser failure cleanup
        run: node --test test/test-script-contract.test.mjs
      - name: Require three consecutive daily-suite passes without retries
        run: |
          for round in 1 2 3; do
            echo "Daily Chrome acceptance round $round"
            pnpm test:ui
          done
