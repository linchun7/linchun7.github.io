name: Inspect ChatGPT public pricing sources
on:
  push:
    branches: [feat/chatgpt-price-comparison]
    paths: [.github/workflows/chatgpt-source-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public source structure
        shell: python
        run: |
          import urllib.request, re, json, concurrent.futures
          def inspect(country):
              url = 'https://apps.apple.com/' + country + '/app/chatgpt/id6448311069?l=en-US'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=20) as r:
                      text = r.read(4000000).decode('utf-8')
                      print('PAGE', country, r.url, len(text), flush=True)
                  print('SCRIPT_TAGS', country, re.findall(r'<script[^>]*>', text), flush=True)
                  for pattern in ['priceCurrency','currencyCode','subscriptionPeriod','com.openai','inAppPurchases', 'textPairs', 'storefront', 'canonical']:
                      positions = [m.start() for m in re.finditer(re.escape(pattern), text)]
                      print('MATCH', country, pattern, len(positions), [text[max(0,p-100):p+800] for p in positions[-2:]], flush=True)
              except Exception as exc:
                  print('ERROR', country, str(exc), flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(inspect, ['us','jp','tr','in','de','gb']))
          for url in ['https://help.openai.com/en/articles/6950777-what-is-chatgpt-plus', 'https://developers.openai.com/codex/pricing', 'https://openai.com/chatgpt/pricing/', 'https://chatgpt.com/pricing?country=JP']:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=20) as r:
                      text = r.read(4000000).decode('utf-8')
                      print('WEB', url, r.status, r.url, len(text), flush=True)
                      print('WEB_SCRIPTS', re.findall(r'<script[^>]+src="([^"]+)"', text), flush=True)
              except Exception as exc:
                  print('WEB_ERROR', url, str(exc), flush=True)
