name: Temporary iCloud fallback patch

on:
  push:
    branches:
      - agent/icloud-hermetic-fx-fallback-20260823
    paths:
      - .github/workflows/tmp-icloud-hermetic-fallback-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/icloud-hermetic-fx-fallback-20260823
      - name: Apply exact hermetic fallback test patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/icloud_price_comparison/test/update-prices.test.mjs')
          text = path.read_text()

          anchor = """async function createTemporaryBootstrapPaths() {\n"""
          helper = """async function prepareTemporaryFxFallbackTimeline(paths, { nowAfterLatestRunMs, previousFxAgeMs }) {\n  const [data, runLog] = await Promise.all([\n    readFile(paths.currentDataPath, 'utf8').then(JSON.parse),\n    readFile(paths.runLogPath, 'utf8').then(JSON.parse)\n  ]);\n  const latestRun = runLog.runs.at(-1);\n  const timelineAnchors = [\n    Date.parse(data.generatedAt),\n    Date.parse(data.run?.finishedAtUtc ?? ''),\n    Date.parse(runLog.updatedAtUtc),\n    Date.parse(latestRun?.finishedAtUtc ?? '')\n  ];\n  assert.equal(timelineAnchors.every(Number.isFinite), true);\n  const fixedNow = new Date(Math.max(...timelineAnchors) + nowAfterLatestRunMs);\n  const previousFxFetchedAt = new Date(fixedNow.getTime() - previousFxAgeMs).toISOString();\n\n  // Only normalize temporal metadata in the isolated copy. Business data stays identical to production.\n  data.fx.fetchedAt = previousFxFetchedAt;\n  latestRun.source.exchangeRatesFetchedAtUtc = previousFxFetchedAt;\n  await Promise.all([\n    writeFile(paths.currentDataPath, `${JSON.stringify(data, null, 2)}\\n`, 'utf8'),\n    writeFile(paths.runLogPath, `${JSON.stringify(runLog, null, 2)}\\n`, 'utf8')\n  ]);\n  return { data, fixedNow, previousFxFetchedAt };\n}\n\n"""
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('bootstrap helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old_expired = """test('rejects anomalous online FX when the previous safe fallback is expired', async (t) => {\n  const { root, paths } = await createTemporaryProductionPaths();\n  const data = JSON.parse(await readFile(pricesUrl, 'utf8'));\n  t.mock.timers.enable({ apis: ['Date'], now: new Date(Date.parse(data.fx.fetchedAt) + 37 * 60 * 60 * 1_000) });\n"""
          new_expired = """test('rejects anomalous online FX when the previous safe fallback is expired', async (t) => {\n  const { root, paths } = await createTemporaryProductionPaths();\n  const { data, fixedNow } = await prepareTemporaryFxFallbackTimeline(paths, {\n    nowAfterLatestRunMs: 2 * 60 * 60 * 1_000,\n    previousFxAgeMs: 37 * 60 * 60 * 1_000\n  });\n  assert.equal(fixedNow.getTime() - Date.parse(data.fx.fetchedAt), 37 * 60 * 60 * 1_000);\n  t.mock.timers.enable({ apis: ['Date'], now: fixedNow });\n"""
          if old_expired not in text:
              raise SystemExit('expired fallback block not found')
          text = text.replace(old_expired, new_expired, 1)

          old_safe = """test('publishes with stale previous CNY values when every online FX candidate fails sanity', async (t) => {\n  const { root, paths } = await createTemporaryProductionPaths();\n  const data = JSON.parse(await readFile(paths.currentDataPath, 'utf8'));\n  t.mock.timers.enable({ apis: ['Date'], now: new Date(Date.parse(data.generatedAt) + 60_000) });\n"""
          new_safe = """test('publishes with stale previous CNY values when every online FX candidate fails sanity', async (t) => {\n  const { root, paths } = await createTemporaryProductionPaths();\n  const { data, fixedNow, previousFxFetchedAt } = await prepareTemporaryFxFallbackTimeline(paths, {\n    nowAfterLatestRunMs: 60_000,\n    previousFxAgeMs: 60 * 60 * 1_000\n  });\n  assert.equal(fixedNow.getTime() - Date.parse(data.fx.fetchedAt), 60 * 60 * 1_000);\n  t.mock.timers.enable({ apis: ['Date'], now: fixedNow });\n"""
          if old_safe not in text:
              raise SystemExit('safe fallback block not found')
          text = text.replace(old_safe, new_safe, 1)

          old_assert = """    assert.equal(published.fx.stale, true);\n    assert.equal(published.fx.fallbackReason, 'source-unavailable');\n"""
          new_assert = """    assert.equal(published.fx.stale, true);\n    assert.equal(published.fx.fallbackReason, 'source-unavailable');\n    assert.equal(published.fx.fetchedAt, previousFxFetchedAt);\n"""
          if old_assert not in text:
              raise SystemExit('fallback assertion anchor not found')
          text = text.replace(old_assert, new_assert, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- tools/icloud_price_comparison/test/update-prices.test.mjs
      - name: Commit patch
        run: |
          git config user.name "linchun7"
          git config user.email "104673731+linchun7@users.noreply.github.com"
          git add tools/icloud_price_comparison/test/update-prices.test.mjs
          git commit -m "test: make iCloud FX fallback timeline hermetic"
          git push origin HEAD:agent/icloud-hermetic-fx-fallback-20260823
