name: Apply iCloud OG 1200 fix

on:
  push:
    branches:
      - agent/icloud-og-1200

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-og-1200
          fetch-depth: 0
      - name: Patch OG metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/icloud_price_comparison/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'https://www.linchun.com.cn/tools/icloud_price_comparison/og-image.jpg': 'https://www.linchun.com.cn/tools/icloud_price_comparison/og-image.png',
              '<meta property="og:image:type" content="image/jpeg">': '<meta property="og:image:type" content="image/png">',
              '<meta property="og:image:width" content="600">': '<meta property="og:image:width" content="1200">',
              '<meta property="og:image:height" content="315">': '<meta property="og:image:height" content="630">',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'Missing expected metadata: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          Path('tools/icloud_price_comparison/og-image.jpg').unlink()
          Path('.github/workflows/apply-icloud-og-1200.yml').unlink()
          PY
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use 1200x630 iCloud social image'
          git push origin HEAD:agent/icloud-og-1200
