name: Finalize bank rank V5 evidence

on:
  pull_request:
    paths:
      - '.github/workflows/bank-rank-v5-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update 2017 evidence and V5 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('tools/bank_rank/data')
          vpath=root/'verification-v4.json'
          data=json.loads(vpath.read_text(encoding='utf-8'))
          data['auditVersion']='2026-08-20-v4.2'
          y2017=next(y for y in data['years'] if y['rankingYear']==2017)
          official='https://china-cba.net/Index/show/catid/14/id/19029.html'
          if not any(s.get('url')==official for s in y2017['authoritativeSources']):
            y2017['authoritativeSources'].append({
              'url':official,
              'role':'中国银行业协会后续正式工作报告，明确确认协会发布以核心一级资本净额排序的“中国银行业100强榜单”；仅用于佐证发布事实，不替代缺失的2017原始详情页/附件。',
              'grade':'A1'
            })
          statement='协会后续正式工作报告再次确认其发布以核心一级资本净额排序的“中国银行业100强榜单”；唐山银行官网转载确认2017榜单及2016年报合并口径。'
          if statement not in y2017['aggregateChecks']:
            y2017['aggregateChecks'].insert(0,statement)
          y2017['limitations']=[
            '2017协会原始详情页/附件经现站ID区间、Wayback、Common Crawl、Jina及多搜索引擎反查仍无法稳定恢复，因此继续保留legacy_primary_gap，不猜测历史页面ID。'
          ]
          data['conclusion']['result']='V4.2补强2017发布事实佐证；V5另以十个年度冻结完整表快照对1000行进行可重复逐字段离线验证。正式1000条记录未变；当前仅2017年仍保留历史一手详情页/附件缺口。'
          vpath.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          readme=root/'README.md'
          text=readme.read_text(encoding='utf-8')
          old='当前数据文件已完成 **2016–2025** 十个榜单年度、共 1000 条记录的结构化回填。2026-08-19 又完成 V4 数据资产复核：对十个年度重新建立“权威来源 → 完整表交叉 → 协会汇总/构成反校验 → 异常项官方取证”的证据链，并将每一年度正式记录的 SHA-256 与审计台账绑定。V4 未发现需要继续修改正式 1000 条记录的新错误。'
          new=old+' 2026-08-20 进一步完成 **V5 可重复全表验证**：把十个年度各一份真实外部完整榜单规范化冻结到 `crosschecks/`，CI 离线逐行逐字段与生产数据比较；共冻结1000行来源记录，22个来源转录差异均有显式解释，未发现新的生产数据错误。'
          if old in text and 'V5 可重复全表验证' not in text:
            text=text.replace(old,new)
          needle='- `verification-v4.json`：V4 内部数据资产审计台账，逐年记录证据等级、权威来源、完整表交叉来源、汇总反校验、异常项、限制、拒绝来源和正式记录 SHA-256。'
          repl=needle+'\n- `crosschecks/{year}.json`：V5 冻结的外部完整榜单规范化快照，保存来源 URL/内容 SHA、100行来源原值、逐字段可机器比较范围、已解释差异及补充人工覆盖。'
          if needle in text and '`crosschecks/{year}.json`' not in text:
            text=text.replace(needle,repl)
          old2017='2017 年目前仍标记为 `verified_with_legacy_primary_gap`：协会历史归档/发布事实可以确认，但旧详情页或附件仍无法稳定回查，因此继续明确记录缺口，不猜测历史页面 ID。2017 年正式100行仍通过完整表交叉、实体连续性、排序/SHA 及可取得的权威材料验证。'
          new2017='2017 年目前仍标记为 `verified_with_legacy_primary_gap`：协会后续正式工作报告确认其发布过以核心一级资本净额排序的“中国银行业100强榜单”，唐山银行官网转载《中国银行业》材料确认2017榜单及2016年报合并口径，Maigoo完整100行已进入V5冻结快照；但协会当年的原始详情页或附件仍无法稳定回查，因此继续明确记录缺口，不猜测历史页面 ID。'
          if old2017 in text:
            text=text.replace(old2017,new2017)
          anchor='## 银行实体与更名/合并'
          section='''## V5 可重复全表验证\n\nV5 不改变 V4 的证据等级和冲突裁决规则，而是把“完整表逐行核对”固化成可重复的离线机器证据。`crosschecks/2016.json` 至 `2025.json` 均直接从对应外部完整榜单抓取并规范化生成，不从生产 `years/*.json` 反向复制。每个快照保存来源内容 SHA-256 和100行来源原值。\n\n`validate_verification.py` 会逐年比较排名、稳定银行实体、核心一级资本、资产和净利润。来源简称/全称先按 `banks.json` 的稳定实体与别名归一；数字按精确十进制比较，并识别会计括号负数。任何差异都必须逐单元格出现在 `resolvedDifferences` 中，且来源值、生产值和原因必须与当前数据完全匹配；出现新的未解释差异、或旧豁免已不再需要但仍残留，CI 都会失败。\n\n本轮冻结共覆盖 **10年 / 1000行**。主机器快照发现 **22个已解释的来源转录差异、0个未解释差异**；2016、2020、2022、2023、2024 五个年度的主来源在规范化后直接为0差异。2018公开文本完整表本身只有排名、机构、核心一级资本和资产四个字段，因此净利润没有伪造机器快照，而是继续由V4已逐行复核的原始榜单图片提供100行补充覆盖。\n\nV5 CI 不联网重新抓取外部网站。抓取只用于审计时形成冻结快照；日常 CI 完全离线比较快照和生产数据，避免网站超时、反爬或HTML改版把生产校验变成不稳定网络测试。\n\n'''
          if anchor in text and '## V5 可重复全表验证' not in text:
            text=text.replace(anchor,section+anchor)
          old_validator='`validate_verification.py` 专门校验 V4 证据台账：要求审计年份与正式清单完全一致；逐年重新读取正式 `years/*.json` 计算 SHA-256，并要求与 `verification-v4.json`、`source-snapshot.json` 同时一致；每年必须存在权威来源、完整表交叉来源、汇总/结构反校验说明、异常项/限制数组；拒绝来源必须记录年份、HTTPS 地址和拒绝原因。这样修改任何正式年度数据后，如果没有同步更新审计证据，CI 会直接失败。'
          new_validator='`validate_verification.py` 同时校验 V4 证据台账和 V5 冻结快照：除要求审计年份、正式记录 SHA-256、权威/完整表来源、汇总/异常说明一致外，还会把 `crosschecks/` 的1000行来源记录逐字段与生产数据离线比较，要求所有差异均有精确、非陈旧的 `resolvedDifferences` 解释；缺少机器字段时必须有100行补充覆盖。修改任何正式年度数据、快照或差异说明而未同步证据链，CI 都会失败。'
          if old_validator in text:
            text=text.replace(old_validator,new_validator)
          readme.write_text(text,encoding='utf-8')
          PY

          python3 tools/bank_rank/scripts/validate_data.py
          python3 tools/bank_rank/scripts/validate_verification.py
          python3 tools/bank_rank/scripts/test_future_year.py
          python3 tools/bank_rank/scripts/render_static.py --check
          git diff --check

      - name: Commit permanent V5 evidence updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/bank_rank/data/verification-v4.json tools/bank_rank/data/README.md
          git commit -m 'docs(bank-rank): document V5 evidence and 2017 corroboration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
