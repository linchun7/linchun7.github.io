name: TEMP hospital-rank final review fixes

on:
  push:
    branches:
      - agent/hospital-rank-future-proof-20260819

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[final-review-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/hospital-rank-future-proof-20260819
          fetch-depth: 0

      - name: Apply final review fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          render_path = Path('tools/hospital_rank/scripts/render_static.py')
          text = render_path.read_text(encoding='utf-8')
          old = '''            "assetVersion": asset_version(),
        "rankingsVersion": rankings_version(),
            "rankingsVersion": rankings_version(),
        }, ensure_ascii=False))'''
          new = '''            "assetVersion": asset_version(),
            "rankingsVersion": rankings_version(),
        }, ensure_ascii=False))'''
          if old not in text:
              raise SystemExit('missing duplicated rankingsVersion block')
          text = text.replace(old, new, 1)
          old_rendered = '''        "staticRows": len(latest_block(data)["records"]),
        "assetVersion": asset_version(),
    }, ensure_ascii=False))'''
          new_rendered = '''        "staticRows": len(latest_block(data)["records"]),
        "assetVersion": asset_version(),
        "rankingsVersion": rankings_version(),
    }, ensure_ascii=False))'''
          if old_rendered not in text:
              raise SystemExit('missing rendered output block')
          text = text.replace(old_rendered, new_rendered, 1)
          render_path.write_text(text, encoding='utf-8')

          smoke_path = Path('tools/browser-tests/hospital-rank-smoke.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          old_top = "const renderStaticScript = fileURLToPath(new URL('../hospital_rank/scripts/render_static.py', import.meta.url));\nexecFileSync('python3', [renderStaticScript, '--check'], { stdio: 'inherit' });"
          new_top = "const renderStaticScript = fileURLToPath(new URL('../hospital_rank/scripts/render_static.py', import.meta.url));\nconst futureYearScript = fileURLToPath(new URL('../hospital_rank/scripts/test_future_year.py', import.meta.url));\nexecFileSync('python3', [renderStaticScript, '--check'], { stdio: 'inherit' });\nexecFileSync('python3', [futureYearScript], { stdio: 'inherit' });"
          if old_top not in smoke:
              raise SystemExit('missing smoke script bootstrap')
          smoke = smoke.replace(old_top, new_top, 1)
          old_route = "await failurePage.route('**/tools/hospital_rank/data/rankings.json', route => route.abort());"
          new_route = "await failurePage.route('**/tools/hospital_rank/data/rankings.json*', route => route.abort());"
          if old_route not in smoke:
              raise SystemExit('missing failure route')
          smoke = smoke.replace(old_route, new_route, 1)
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

          python3 tools/hospital_rank/scripts/validate_data.py
          python3 tools/hospital_rank/scripts/test_future_year.py
          python3 tools/hospital_rank/scripts/render_static.py --check
          git diff --check

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/hospital_rank/scripts/render_static.py tools/browser-tests/hospital-rank-smoke.mjs
          git commit -m '[final-review-generated] 修正医院榜单回归与生成器诊断'
          git push origin HEAD:agent/hospital-rank-future-proof-20260819
