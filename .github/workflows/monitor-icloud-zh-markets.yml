name: Monitor Apple Chinese iCloud markets

on:
  workflow_run:
    workflows:
      - Update iCloud prices
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-icloud-zh-markets
  cancel-in-progress: false

jobs:
  monitor:
    name: 检查 Apple 中文 iCloud+ 新地区名称
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拒绝非主线或外部来源
        env:
          MONITOR_REF: ${{ github.ref }}
          MONITOR_EVENT: ${{ github.event_name }}
          MONITOR_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.MONITOR_REF !== 'refs/heads/main'
            || !['workflow_run', 'workflow_dispatch'].includes(process.env.MONITOR_EVENT)
            || (process.env.MONITOR_EVENT === 'workflow_run'
              && (process.env.UPSTREAM_REPOSITORY !== process.env.MONITOR_REPOSITORY
                || process.env.UPSTREAM_BRANCH !== 'main'))) {
            throw new Error('Chinese monitoring requires trusted main; no check was performed.');
          }
          NODE

      - name: 检出可信 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: 记录实际检查版本
        run: |
          printf '监测代码与历史已复核名称 revision：`%s`\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 启用并校验 pnpm
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm --version

      - name: 安装项目依赖
        working-directory: tools/icloud_price_comparison
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 检查 Apple 中文新地区名称
        working-directory: tools/icloud_price_comparison
        run: node scripts/check-apple-zh-markets.mjs

      - name: 保证失败可见
        if: failure()
        run: |
          echo '::error title=Apple 中文名称监测未通过::出现未复核的新中文地区名称，或本次监测不可用；详见步骤日志与摘要。不影响英文价格更新。'
          {
            echo '### 中文名称监测未通过'
            echo '出现未复核的新中文地区名称，或本次监测不可用。具体差异或错误见上方摘要与失败步骤日志。'
            echo '本任务只读，不修改中文名称、市场身份或生产价格，也不阻塞英文价格 updater。'
          } >> "$GITHUB_STEP_SUMMARY"
