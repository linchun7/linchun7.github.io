name: Patch iCloud history observation evidence 20260916

on:
  push:
    branches:
      - fix/icloud-history-observation-evidence-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出修复分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 应用精确补丁
        run: python .github/patch-icloud-history-observation-evidence-20260916.py

      - name: 运行针对性回归与现有工件深验
        working-directory: tools/icloud_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          node --test --test-concurrency=1 test/validate-data-artifact.test.mjs
          pnpm validate:artifact

      - name: 提交修复并清理一次性文件
        run: |
          git config user.name linchun7
          git config user.email 104673731+linchun7@users.noreply.github.com
          git add tools/icloud_price_comparison/scripts/validate-data-artifact.mjs tools/icloud_price_comparison/test/validate-data-artifact.test.mjs tools/icloud_price_comparison/README.md tools/icloud_price_comparison/ARCHITECTURE.md tools/icloud_price_comparison/OPERATIONS.md
          git rm .github/workflows/patch-icloud-history-observation-evidence-20260916.yml .github/patch-icloud-history-observation-evidence-20260916.py
          git commit -m "fix: validate price history against evidence-backed dates"
          git push origin HEAD:fix/icloud-history-observation-evidence-20260916
