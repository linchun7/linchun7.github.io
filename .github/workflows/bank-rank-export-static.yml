name: Export bank rank static HTML

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate clean bank_rank index
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:tools/bank_rank/index.html" > tools/bank_rank/index.html
          python3 tools/bank_rank/scripts/render_static.py
          python3 tools/bank_rank/scripts/render_static.py --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/bank_rank/index.html')
          raw = p.read_bytes()
          raw.decode('utf-8')
          print(f'generated bytes={len(raw)} rows={raw.count(b"data-static-prerendered=\\\"true\\\"")}')
          PY

      - name: Upload generated index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bank-rank-static-index-${{ github.run_id }}
          path: tools/bank_rank/index.html
          if-no-files-found: error
          retention-days: 1
