name: Export bank rank static HTML

on:
  pull_request:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Generate and commit clean bank_rank index
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:tools/bank_rank/index.html" > tools/bank_rank/index.html
          python3 tools/bank_rank/scripts/render_static.py
          python3 tools/bank_rank/scripts/render_static.py --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/bank_rank/index.html')
          raw = p.read_bytes()
          raw.decode('utf-8')
          assert raw.count(b'data-static-prerendered="true"') == 100
          print(f'generated bytes={len(raw)} rows=100')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/bank_rank/index.html
          git rm .github/workflows/bank-rank-export-static.yml
          git commit -m 'build(bank-rank): render full static top 100'
          git push origin "HEAD:${HEAD_REF}"
