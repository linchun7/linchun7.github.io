name: One-shot iCloud automation doc patch

on:
  push:
    branches:
      - agent/icloud-automation-unification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/icloud-automation-unification
          persist-credentials: true
          fetch-depth: 1

      - name: Patch only the dependency grouping paragraph
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/icloud_price_comparison/OPERATIONS.md')
          text = path.read_text()
          old = '- npm 依赖保持独立 PR，避免一个包的兼容性问题阻塞其他无关升级。直接依赖的向前 patch/minor 更新，以及不改变 `package.json` 语义的 lockfile-only 传递依赖更新，都必须先完整通过 core、artifact、全部 snapshots、`pnpm audit` 和 Chromium / Firefox / WebKit 验收。'
          new = '- npm 的常规 version update 将全部 patch/minor 更新合并为一个 routine PR，major 保持单独 PR；安全更新不受该 version group 限制。routine PR、直接依赖的向前 patch/minor 更新，以及不改变 `package.json` 语义的 lockfile-only 传递依赖更新，都必须先完整通过 core、artifact、全部 snapshots、`pnpm audit` 和 Chromium / Firefox / WebKit 验收。'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale dependency-grouping paragraph')
          path.write_text(text.replace(old, new))

      - name: Self-delete helper and commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-fix-icloud-automation-doc.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/icloud_price_comparison/OPERATIONS.md
          git commit -m 'docs: align dependency grouping policy'
          git push origin HEAD:agent/icloud-automation-unification
