name: Price refactor artifacts and diagnostics
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/icloud_price_comparison/**'
      - 'tools/chatgpt_price_comparison/**'
      - '.github/workflows/price-refactor-artifacts.yml'
      - '.github/scripts/price-refactor-*'
permissions:
  contents: read
concurrency:
  group: price-refactor-artifacts-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/price-snapshot-pages-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f146dc26264e0a8a8fd71e8b489640dc571061c7
          persist-credentials: false
          path: baseline
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Generate only from committed data
        working-directory: candidate
        run: |
          node --input-type=module <<'JS'
          import { renderStaticPage } from './tools/icloud_price_comparison/scripts/render-static-page.mjs';
          import { updateAssetVersions } from './tools/icloud_price_comparison/scripts/update-asset-versions.mjs';
          await renderStaticPage({write: true});
          await updateAssetVersions();
          await renderStaticPage();
          await updateAssetVersions({check: true});
          JS
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'tools/chatgpt_price_comparison/scripts')
          import pipeline as p
          data = json.loads((p.ROOT / 'data/prices.json').read_text(encoding='utf-8'))
          p.validate(data)
          (p.ROOT / 'index.html').write_text(p.render(data, (p.ROOT / 'index.template.html').read_text(encoding='utf-8')), encoding='utf-8')
          PY
          python3 .github/scripts/price-refactor-manifest.py ../generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: price-generated-${{ github.event.pull_request.head.sha }}
          path: generated/
          if-no-files-found: error
          retention-days: 7
      - name: Install locked diagnostic browser
        working-directory: candidate/tools/chatgpt_price_comparison
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Measure isolated baseline and generated candidate (diagnostic only)
        continue-on-error: true
        working-directory: candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/price-refactor-measure.mjs ../baseline . ../diagnostics
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: price-diagnostics-${{ github.event.pull_request.head.sha }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
