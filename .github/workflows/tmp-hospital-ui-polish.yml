name: Temporary hospital UI polish

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-hospital-ui-polish.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/hospital-rank-copy-layout-20260819
      - name: Apply focused hospital UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = root / 'tools/hospital_rank/index.html'
          s = index.read_text(encoding='utf-8')

          exact = {
            '        .ranking-mode-note { margin-top: 4px; color: var(--accent-dark); font-size: 11px; line-height: 1.45; }\n': '',
            '        .dialog-method-note { margin: 14px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }\n': '',
            '                    <h1 id="workspaceTitle">2023 年医院榜单</h1>\n                    <p id="resultSummary" aria-live="polite">2023 年 · 共 100 家医院</p>\n                    <p class="ranking-mode-note" id="rankingModeNote" hidden></p>': '                    <h1 id="workspaceTitle" aria-live="polite">2023 年医院榜单 · 共 100 家医院</h1>',
            '<button type="button" data-sort="排名">排名/等级 <span class="sort-indicator" aria-hidden="true">↕</span></button>': '<button type="button" data-sort="排名"><span id="rankColumnLabel">等级</span> <i data-lucide="arrow-up-down" data-sort-icon aria-hidden="true"></i></button>',
            '<option value="">全部省份</option>': '<option value="">省份</option>',
            '<p><strong>榜单说明：</strong>数字排名年份按官方名次展示；等级制年份只展示官方等级，同等级官方不分先后。为提升查询参考价值，本站在同等级内按各医院最近一次可用的数字排名进行历史参考排序，不代表官方档内名次。医院更名与来源页面名称可能随时间变化，本站保留已核验的历史名称与来源值，不擅自改写来源数据。</p>': '<p><strong>榜单说明：</strong>数字排名年份按官方名次展示；等级制年份只展示官方等级，同等级官方不分先后。同等级内按最近一次可用数字排名作历史参考排序。该排序为本站历史参考，不代表官方档内名次。医院更名与来源页面名称可能随时间变化，本站保留已核验的历史名称与来源值，不擅自改写来源数据。</p>',
            '<script src="script.js?v=20260819-2"></script>': '<script type="module" src="script.js?v=20260819-3"></script>',
          }
          for old, new in exact.items():
            if old not in s:
              raise SystemExit(f'index replacement missing: {old[:100]!r}')
            s = s.replace(old, new, 1)

          s = re.sub(r'<span class="sort-indicator" aria-hidden="true">↕</span>', '<i data-lucide="arrow-up-down" data-sort-icon aria-hidden="true"></i>', s)

          mobile_marker = '''            .hospital-table.single-year { min-width: 850px; }\n            .hospital-table.grade-mode { min-width: 560px; }\n            .hospital-table.single-year.grade-mode { min-width: 540px; }\n            .hospital-table.grade-mode th:nth-child(3),\n            .hospital-table.grade-mode td:nth-child(3) { width: 250px; }'''
          mobile_replacement = '''            .hospital-table.single-year { min-width: 850px; }\n            .hospital-table.grade-mode { min-width: 560px; }\n            .hospital-table.single-year.grade-mode { width: 100%; min-width: 0; table-layout: fixed; }\n            .hospital-table.grade-mode th:nth-child(3),\n            .hospital-table.grade-mode td:nth-child(3) { width: 250px; }\n            .hospital-table.single-year.grade-mode th,\n            .hospital-table.single-year.grade-mode td { padding-inline: 6px; }\n            .hospital-table.single-year.grade-mode th:nth-child(2),\n            .hospital-table.single-year.grade-mode td:nth-child(2) { width: 68px; }\n            .hospital-table.single-year.grade-mode th:nth-child(3),\n            .hospital-table.single-year.grade-mode td:nth-child(3) { width: auto; }\n            .hospital-table.single-year.grade-mode th:nth-child(7),\n            .hospital-table.single-year.grade-mode td:nth-child(7),\n            .hospital-table.single-year.grade-mode th:nth-child(8),\n            .hospital-table.single-year.grade-mode td:nth-child(8) { width: 62px; white-space: normal; line-height: 1.25; }\n            .hospital-table.single-year.grade-mode td:nth-child(3) { white-space: normal; }\n            .hospital-table.single-year.grade-mode .hospital-name { overflow: visible; white-space: normal; text-overflow: clip; }'''
          if mobile_marker not in s:
            raise SystemExit('mobile grade table marker missing')
          s = s.replace(mobile_marker, mobile_replacement, 1)

          sort_css = '        .hospital-table th button svg { width: 15px; height: 15px; stroke-width: 2.25; flex: 0 0 15px; }\n'
          anchor = '        .source-links strong { color: var(--ink-soft); }\n'
          if anchor not in s:
            raise SystemExit('sort css anchor missing')
          s = s.replace(anchor, sort_css + anchor, 1)
          index.write_text(s, encoding='utf-8')

          script = root / 'tools/hospital_rank/script.js'
          s = script.read_text(encoding='utf-8')
          if not s.startswith('const PAGE_SIZE'):
            raise SystemExit('unexpected script start')
          s = "import { createIcons } from '../icloud_price_comparison/vendor/lucide-subset.js?v=1afb95ee';\n\n" + s
          s = s.replace("provinceSelect.replaceChildren(new Option('全部省份', ''));", "provinceSelect.replaceChildren(new Option('省份', ''));", 1)
          s = s.replace("badge.title = '官方等级；同等级内本站按最近一次数字排名作历史参考排序';", "badge.title = '同等级内按最近一次可用数字排名作历史参考排序。';", 1)

          method_block = '''    const methodNote = document.createElement('p');
    methodNote.className = 'dialog-method-note';
    methodNote.textContent = '等级制年份仅展示官方等级；同等级内的先后顺序使用最近一次可用数字排名作为本站历史参考，不代表官方档内名次。';
    body.appendChild(methodNote);

'''
          if method_block not in s:
            raise SystemExit('dialog method note block missing')
          s = s.replace(method_block, '', 1)

          grade_block = re.compile(r"\nfunction getGradeReferenceNote\(records\) \{.*?\n\}\n\nfunction updateContext\(records\) \{.*?\n\}\n", re.S)
          replacement = '''
function updateContext(records) {
    const year = document.getElementById('yearSelect').value;
    const title = document.getElementById('workspaceTitle');
    const table = document.getElementById('hospitalTable');
    const block = selectedYearBlock();
    const gradeMode = block?.rankingMode === 'grade';
    const rankColumnLabel = document.getElementById('rankColumnLabel');
    const rankHeaderButton = rankColumnLabel?.closest('button');

    table.classList.toggle('single-year', Boolean(year));
    table.classList.toggle('grade-mode', gradeMode);

    if (year) {
        title.textContent = `${year} 年医院榜单 · 共 ${records.length} 家医院`;
    } else {
        const uniqueHospitals = new Set(records.map(record => record.hospitalId)).size;
        title.textContent = `历年医院榜单 · 共 ${records.length} 条记录 · ${uniqueHospitals} 家医院`;
    }

    if (rankColumnLabel) rankColumnLabel.textContent = gradeMode ? '等级' : (year ? '排名' : '榜单结果');
    if (rankHeaderButton) rankHeaderButton.title = gradeMode ? '同等级内按最近一次可用数字排名作历史参考排序。' : '';
}
'''
          s, count = grade_block.subn('\n' + replacement.lstrip(), s, count=1)
          if count != 1:
            raise SystemExit('failed to replace grade note/updateContext block')

          old_sort = '''function updateSortIndicators() {
    document.querySelectorAll('#hospitalTable thead th').forEach(th => th.setAttribute('aria-sort', 'none'));
    if (!sortConfig.column) return;
    const button = document.querySelector(`#hospitalTable thead button[data-sort="${sortConfig.column}"]`);
    if (button) button.closest('th').setAttribute('aria-sort', sortConfig.direction === 'asc' ? 'ascending' : 'descending');
}
'''
          new_sort = '''function refreshIcons() {
    try {
        createIcons({ attrs: { 'stroke-width': 1.8 } });
    } catch (error) {
        console.warn(`图标加载失败：${error.message}`);
    }
}

function replaceSortIcon(button, iconName) {
    const current = button?.querySelector('[data-sort-icon]');
    if (!current) return;
    const placeholder = document.createElement('i');
    placeholder.dataset.lucide = iconName;
    placeholder.dataset.sortIcon = '';
    placeholder.setAttribute('aria-hidden', 'true');
    current.replaceWith(placeholder);
}

function updateSortIndicators() {
    document.querySelectorAll('#hospitalTable thead th').forEach(th => {
        th.setAttribute('aria-sort', 'none');
        replaceSortIcon(th.querySelector('button[data-sort]'), 'arrow-up-down');
    });
    if (sortConfig.column) {
        const button = document.querySelector(`#hospitalTable thead button[data-sort="${sortConfig.column}"]`);
        if (button) {
            button.closest('th').setAttribute('aria-sort', sortConfig.direction === 'asc' ? 'ascending' : 'descending');
            replaceSortIcon(button, sortConfig.direction === 'asc' ? 'arrow-up' : 'arrow-down');
        }
    }
    refreshIcons();
}
'''
          if old_sort not in s:
            raise SystemExit('sort indicator function missing')
          s = s.replace(old_sort, new_sort, 1)

          old_fallback = '''        const summary = document.getElementById('resultSummary');
        if (!summary.textContent.includes('静态模式')) summary.textContent += ' · 静态模式';
        document.getElementById('rankingModeNote').hidden = true;
'''
          new_fallback = '''        const title = document.getElementById('workspaceTitle');
        if (!title.textContent.includes('静态模式')) title.textContent += ' · 静态模式';
'''
          if old_fallback not in s:
            raise SystemExit('static fallback block missing')
          s = s.replace(old_fallback, new_fallback, 1)
          s = s.replace("document.getElementById('resultSummary').textContent = '加载失败';", "document.getElementById('workspaceTitle').textContent = '榜单数据加载失败';", 1)

          init_old = '''async function init() {
    document.getElementById('copyrightYear').textContent = String(new Date().getFullYear());
    try {
'''
          init_new = '''async function init() {
    document.getElementById('copyrightYear').textContent = String(new Date().getFullYear());
    refreshIcons();
    try {
'''
          if init_old not in s:
            raise SystemExit('init marker missing')
          s = s.replace(init_old, init_new, 1)
          script.write_text(s, encoding='utf-8')

          renderer = root / 'tools/hospital_rank/scripts/render_static.py'
          s = renderer.read_text(encoding='utf-8')
          old = '''    result = replace_tag_text(result, "workspaceTitle", f"{year} 年医院榜单")
    result = replace_tag_text(result, "resultSummary", f"{year} 年 · 共 {len(rows)} 家医院")
    result = replace_tag_text(result, "brandSubtitle", f"中国医院综合排行榜 · {oldest}–{year}")
'''
          new = '''    result = replace_tag_text(result, "workspaceTitle", f"{year} 年医院榜单 · 共 {len(rows)} 家医院")
    result = replace_tag_text(result, "rankColumnLabel", "等级" if block.get("rankingMode") == "grade" else "排名")
    result = replace_tag_text(result, "brandSubtitle", f"中国医院综合排行榜 · {oldest}–{year}")
'''
          if old not in s:
            raise SystemExit('renderer title block missing')
          s = s.replace(old, new, 1)
          renderer.write_text(s, encoding='utf-8')

          smoke = root / 'tools/browser-tests/hospital-rank-smoke.mjs'
          s = smoke.read_text(encoding='utf-8')
          s = s.replace("    assert.match(await staticPage.locator('#workspaceTitle').innerText(), /2023 年医院榜单/);\n    assert.match(await staticPage.locator('#resultSummary').innerText(), /共 100 家医院/);", "    assert.equal((await staticPage.locator('#workspaceTitle').innerText()).trim(), '2023 年医院榜单 · 共 100 家医院');\n    assert.equal((await staticPage.locator('#rankColumnLabel').innerText()).trim(), '等级');\n    assert.equal(await staticPage.locator('#resultSummary').count(), 0, 'duplicated year summary should be removed');")
          s = s.replace("    assert.match(await page.locator('#workspaceTitle').innerText(), /2023 年医院榜单/);\n    assert.match(await page.locator('#resultSummary').innerText(), /共 100 家医院/);\n    assert.match(await page.locator('#rankingModeNote').innerText(), /最近一次可用数字排名/);\n    assert.match(await page.locator('#rankingModeNote').innerText(), /2022 年/);", "    assert.equal((await page.locator('#workspaceTitle').innerText()).trim(), '2023 年医院榜单 · 共 100 家医院');\n    assert.equal(await page.locator('#resultSummary').count(), 0);\n    assert.equal(await page.locator('#rankingModeNote').count(), 0, 'grade explanation should not occupy toolbar height');\n    assert.equal((await page.locator('#rankColumnLabel').innerText()).trim(), '等级');\n    assert.equal((await page.locator('#provinceSelect option').first().innerText()).trim(), '省份');")

          marker = "    assert.equal(scoreHeaderDisplay, 'none', 'score columns should be hidden for grade-only years');\n\n    const firstRow = rows.first();"
          insert = """    assert.equal(scoreHeaderDisplay, 'none', 'score columns should be hidden for grade-only years');

    const unsortedIconClass = await page.locator('#hospitalTable thead button[data-sort="医院名称"] svg').getAttribute('class');
    assert.match(unsortedIconClass || '', /lucide-arrow-up-down/, 'unsorted header should use the iCloud Lucide arrow-up-down icon');
    const gradeToolbarHeight = await page.locator('.workspace-toolbar').evaluate(element => element.getBoundingClientRect().height);
    await page.locator('#yearSelect').selectOption('2022');
    await page.waitForFunction(() => document.querySelector('#workspaceTitle')?.textContent.includes('2022 年医院榜单'));
    assert.equal((await page.locator('#rankColumnLabel').innerText()).trim(), '排名');
    assert.equal((await page.locator('#workspaceTitle').innerText()).trim(), '2022 年医院榜单 · 共 100 家医院');
    const numericToolbarHeight = await page.locator('.workspace-toolbar').evaluate(element => element.getBoundingClientRect().height);
    assert.ok(Math.abs(gradeToolbarHeight - numericToolbarHeight) <= 1, 'grade explanation must not change toolbar height');
    await page.locator('#yearSelect').selectOption('2023');
    await page.waitForFunction(() => document.querySelector('#workspaceTitle')?.textContent.includes('2023 年医院榜单'));
    rows = page.locator('#hospitalList tr.data-row');

    const firstRow = rows.first();"""
          if marker not in s:
            raise SystemExit('smoke toolbar marker missing')
          s = s.replace(marker, insert, 1)

          s = s.replace("    assert.match(historyText, /同等级内的先后顺序使用最近一次可用数字排名/);", "    assert.doesNotMatch(historyText, /同等级内/, 'hospital detail should not repeat global grade-ordering methodology');")
          s = s.replace("    assert.match(await page.locator('#resultSummary').innerText(), /1430 条历年记录/);", "    assert.match(await page.locator('#workspaceTitle').innerText(), /历年医院榜单 · 共 1430 条记录 · 128 家医院/);\n    assert.equal((await page.locator('#rankColumnLabel').innerText()).trim(), '榜单结果');")

          mobile_check = '''
    await page.setViewportSize({ width: 390, height: 844 });
    await page.locator('#yearSelect').selectOption('2023');
    await page.waitForFunction(() => document.querySelector('#hospitalTable')?.classList.contains('grade-mode'));
    const tableOverflow = await page.locator('.table-scroll').evaluate(element => element.scrollWidth - element.clientWidth);
    assert.ok(tableOverflow <= 1, `single-year grade table should fit a 390px viewport, overflow=${tableOverflow}`);
    const cityHeaderBox = await page.locator('#hospitalTable th').nth(7).boundingBox();
    const scrollBox = await page.locator('.table-scroll').boundingBox();
    assert.ok(cityHeaderBox && scrollBox && cityHeaderBox.x + cityHeaderBox.width <= scrollBox.x + scrollBox.width + 1, 'city column should stay visible on narrow phones');
'''
          tail = "    const bottomNotice = await page.locator('.data-disclaimer').innerText();"
          if tail not in s:
            raise SystemExit('smoke tail marker missing')
          s = s.replace(tail, mobile_check + '\n' + tail, 1)
          smoke.write_text(s, encoding='utf-8')
          PY

          python3 tools/hospital_rank/scripts/render_static.py
          rm .github/workflows/tmp-hospital-ui-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/hospital_rank/index.html tools/hospital_rank/script.js tools/hospital_rank/scripts/render_static.py tools/browser-tests/hospital-rank-smoke.mjs .github/workflows/tmp-hospital-ui-polish.yml
          git commit -m '收口医院榜单文案、排序图标与移动端布局'
          git push origin HEAD:agent/hospital-rank-copy-layout-20260819
