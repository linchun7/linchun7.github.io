name: iCloud minimum history upgrade audit
on:
  push:
    branches: [upgrade/icloud-minimum-history]
    paths: [.github/workflows/icloud-minimum-upgrade-audit.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply exact reviewed blob edits and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,hashlib,subprocess
          def sha(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          changes=json.loads(pathlib.Path('.github/icloud-final-edits.json').read_text())
          for change in changes:
              p=pathlib.Path(change['path'])
              assert str(p).startswith('tools/icloud_price_comparison/') and '..' not in p.parts
              raw=p.read_bytes(); assert sha(raw)==change['old'],str(p)
              lines=raw.decode().splitlines(keepends=True)
              for start,end,text in reversed(change['edits']):
                  lines[start:end]=text.splitlines(keepends=True)
              raw=''.join(lines).encode();assert sha(raw)==change['new'],f'Final blob differs: {p}'
              p.write_bytes(raw)
          subprocess.run(['git','add','tools/icloud_price_comparison'],check=True)
          subprocess.run(['git','rm','.github/icloud-final-edits.json','.github/workflows/icloud-minimum-upgrade-audit.yml'],check=True)
          PY
          git diff --cached --check
          git -c user.name=linchun7 -c user.email=104673731+linchun7@users.noreply.github.com commit -m 'fix(icloud): bind minimum history to canonical deployment verification'
          test "$(git rev-parse HEAD:tools/icloud_price_comparison)" = 2eea912a12a37d837774512f00c0c2f83afb7d1d
          corepack enable
      - name: Install locked dependencies
        working-directory: tools/icloud_price_comparison
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Complete core and artifact acceptance
        working-directory: tools/icloud_price_comparison
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:core 2>&1 | tee "$RUNNER_TEMP/icloud-core.log"
          pnpm validate:artifact 2>&1 | tee "$RUNNER_TEMP/icloud-artifact.log"
          pnpm validate:snapshots 2>&1 | tee "$RUNNER_TEMP/icloud-snapshots.log"
      - name: Package exactly tested candidate
        id: package
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/icloud-tested-candidate.bundle" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: icloud-upgrade-acceptance
          path: |
            ${{ runner.temp }}/icloud-*.log
            ${{ runner.temp }}/icloud-tested-candidate.bundle
          retention-days: 1
          if-no-files-found: warn
  publish_candidate:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: icloud-upgrade-acceptance
          path: ${{ runner.temp }}/tested
      - name: Publish verified candidate to feature branch only
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/tested/icloud-tested-candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "$EXPECTED_SHA^")" = "$GITHUB_SHA"
          test "$(git rev-parse "$EXPECTED_SHA:tools/icloud_price_comparison")" = 2eea912a12a37d837774512f00c0c2f83afb7d1d
          git push origin "$EXPECTED_SHA:refs/heads/upgrade/icloud-minimum-history"
