    const mobileLayoutQuery = window.matchMedia('(max-width: 700px), (pointer: coarse) and (max-height: 700px)');
    const canvasView = { width: 640, height: 480, dpr: 1 };
    let canvasResizeFrame = 0;

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.round(bounds.width));
      const height = Math.max(1, Math.round(bounds.height));
      const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      const pixelWidth = Math.round(width * dpr);
      const pixelHeight = Math.round(height * dpr);
      if (canvas.width === pixelWidth && canvas.height === pixelHeight && canvasView.dpr === dpr) return;
      canvasView.width = width;
      canvasView.height = height;
      canvasView.dpr = dpr;
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
      if (state.player) draw();
    }

    function scheduleCanvasResize() {
      window.cancelAnimationFrame(canvasResizeFrame);
      canvasResizeFrame = window.requestAnimationFrame(resizeCanvas);
    }

    function currentFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function syncFullscreenButton() {
      const supported = Boolean(gameElement.requestFullscreen || gameElement.webkitRequestFullscreen);
      const active = Boolean(currentFullscreenElement());
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      fullscreenButton.hidden = standalone;
      fullscreenButton.textContent = active ? '⤢' : '⛶';
      fullscreenButton.title = active ? '退出全屏' : '进入全屏';
      fullscreenButton.setAttribute('aria-label', active ? '退出全屏' : '进入全屏');
      fullscreenButton.dataset.supported = supported ? 'true' : 'false';
      scheduleCanvasResize();
    }

    async function enterFullscreen(silent = false) {
      if (currentFullscreenElement()) return true;
      try {
        if (gameElement.requestFullscreen) await gameElement.requestFullscreen({ navigationUI: 'hide' });
        else if (gameElement.webkitRequestFullscreen) gameElement.webkitRequestFullscreen();
        else throw new Error('unsupported');
        return true;
      } catch {
        if (!silent) showToast('可添加到主屏幕后全屏游玩');
        return false;
      }
    }

    async function toggleFullscreen() {
      try {
        if (currentFullscreenElement()) {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          await enterFullscreen();
        }
      } catch {
        showToast('未能切换全屏');
      }
    }

    async function requestWakeLock() {
      if (!navigator.wakeLock || state.wakeLock || !state.running || state.paused || state.finished || state.ending || document.hidden) return;
      try {
        const lock = await navigator.wakeLock.request('screen');
        if (!state.running || state.paused || state.finished || state.ending || document.hidden) {
          await lock.release();
          return;
        }
        state.wakeLock = lock;
        lock.addEventListener('release', () => {
          if (state.wakeLock === lock) state.wakeLock = null;
        });
      } catch {}
    }

    function releaseWakeLock() {
      const lock = state.wakeLock;
      state.wakeLock = null;
      if (lock) lock.release().catch(() => {});
    }

    function getDifficulty() {
      return difficulties[state.difficulty] || difficulties.normal;
    }

    function rankRequirement(level) {
      const base = ranks[level].need;
      return base === 0 ? 0 : Math.max(1, Math.ceil(base * getDifficulty().needScale));
    }

    function difficultyPickerMarkup() {
      return `<div class="difficulty-picker" role="group" aria-label="征战难度">${Object.entries(difficulties).map(([key, difficulty]) =>
        `<button class="difficulty-option" type="button" data-difficulty="${key}" aria-pressed="${key === state.difficulty}">${difficulty.name}</button>`
      ).join('')}</div>`;
    }

    function syncDifficultyButtons() {
      overlay.querySelectorAll('[data-difficulty]').forEach(button => {
        button.setAttribute('aria-pressed', button.dataset.difficulty === state.difficulty ? 'true' : 'false');
      });
    }

    function showStartOverlay() {
      overlay.className = 'overlay';
      overlay.innerHTML = `<strong>主公，请定军势</strong><p>乱世已至，选定一场征伐。</p>${difficultyPickerMarkup()}<button class="primary" data-action="start" type="button">整军出征</button>`;
      overlay.hidden = false;
      syncDifficultyButtons();
    }

    function getAudioContext() {
      if (state.muted) return null;
      const AudioEngine = window.AudioContext || window.webkitAudioContext;
      if (!AudioEngine) return null;
      if (!state.audioContext) state.audioContext = new AudioEngine();
      if (state.audioContext.state === 'suspended') state.audioContext.resume();
      return state.audioContext;
    }

    function playTone(frequency, duration, options = {}) {
      const audio = getAudioContext();
      if (!audio) return;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const startAt = audio.currentTime + (options.delay || 0);
      const volume = options.volume || 0.045;
      oscillator.type = options.type || 'sine';
      oscillator.frequency.setValueAtTime(frequency, startAt);
      if (options.endFrequency) oscillator.frequency.exponentialRampToValueAtTime(options.endFrequency, startAt + duration);
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(volume, startAt + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start(startAt);
      oscillator.stop(startAt + duration + 0.03);
    }

    function playSound(name) {
      if (state.muted) return;
      if (name === 'start') {
        playTone(330, 0.12, { type: 'triangle', volume: 0.035 });
        playTone(440, 0.16, { type: 'triangle', volume: 0.035, delay: 0.09 });
      } else if (name === 'eat') {
        playTone(210, 0.12, { type: 'square', endFrequency: 430, volume: 0.035 });
        playTone(520, 0.09, { type: 'triangle', volume: 0.025, delay: 0.07 });
      } else if (name === 'upgrade') {
        [392, 523, 659, 784].forEach((note, index) => playTone(note, 0.24, { type: 'triangle', volume: 0.045, delay: index * 0.09 }));
      } else if (name === 'hit') {
        playTone(130, 0.28, { type: 'sawtooth', endFrequency: 58, volume: 0.065 });
        playTone(72, 0.2, { type: 'square', volume: 0.035, delay: 0.04 });
      } else if (name === 'win') {
        [392, 494, 587, 784, 988].forEach((note, index) => playTone(note, 0.38, { type: 'triangle', volume: 0.05, delay: index * 0.12 }));
      } else if (name === 'lose') {
        [294, 233, 196, 147].forEach((note, index) => playTone(note, 0.38, { type: 'sawtooth', volume: 0.035, delay: index * 0.14 }));
      }
    }

    function makePlayer() {
      const difficulty = getDifficulty();
      return {
        x: 0,
        y: 0,
        angle: -Math.PI / 2,
        level: 0,
        progress: 0,
        hearts: difficulty.hearts,
        maxHearts: difficulty.hearts,
        invulnerable: 0,
        pulse: 0
      };
    }

    function spawnPerson(forceEdible = false, minDistance = 280, maxDistance = 1450, forcedLevel = null) {
      const playerLevel = state.player?.level || 0;
      const difficulty = getDifficulty();
      let level;
      if (forcedLevel !== null) {
        level = forcedLevel;
      } else if (forceEdible || Math.random() < difficulty.edibleChance) {
        const roll = Math.random();
        if (playerLevel === 0) level = 0;
        else if (roll < 0.32) level = playerLevel;
        else if (roll < 0.62) level = Math.max(0, playerLevel - 1 - Math.floor(Math.random() * 3));
        else if (roll < 0.82) level = Math.floor(Math.random() * (playerLevel + 1));
        else level = 0;
      } else {
        level = Math.min(ranks.length - 2, playerLevel + 1 + Math.floor(Math.random() * difficulty.dangerRange));
      }
      const angleFromPlayer = Math.random() * Math.PI * 2;
      const distanceFromPlayer = Math.sqrt(minDistance ** 2 + Math.random() * (maxDistance ** 2 - minDistance ** 2));
      const x = (state.player?.x || 0) + Math.cos(angleFromPlayer) * distanceFromPlayer;
      const y = (state.player?.y || 0) + Math.sin(angleFromPlayer) * distanceFromPlayer;

      return {
        id: `${Date.now()}-${Math.random()}`,
        x,
        y,
        level,
        angle: Math.random() * Math.PI * 2,
        turnTimer: 0.6 + Math.random() * 2,
        bob: Math.random() * Math.PI * 2
      };
    }

    function resetGame() {
      const difficulty = getDifficulty();
      window.clearTimeout(state.endTimer);
      releaseWakeLock();
      state.endTimer = null;
      state.running = false;
      state.paused = false;
      state.pausedByVisibility = false;
      state.finished = false;
      state.ending = false;
      state.frameToken++;
      state.player = makePlayer();
      state.camera = { x: 0, y: 0 };
      state.people = [];
      state.particles = [];
      state.effects = [];
      state.shake = 0;
      state.shakeX = 0;
      state.shakeY = 0;
      state.screenFlash = 0;
      state.flashColor = '#ffe3a1';
      pointerGesture.active = false;
      arenaShell.classList.remove('steering');
      state.populationTimer = 0;
      state.totalEaten = 0;
      state.streak = 0;
      state.bestStreak = 0;
      for (let index = 0; index < difficulty.population; index++) {
        const nearby = index < difficulty.initialNearby;
        state.people.push(spawnPerson(index < difficulty.initialEdible, nearby ? 190 : 520, nearby ? 650 : 1450));
      }
      pauseButton.textContent = 'Ⅱ';
      pauseButton.disabled = false;
      pauseButton.title = '暂避锋芒';
      pauseButton.setAttribute('aria-label', '暂停');
      overlay.className = 'overlay';
      updateHud();
      draw();
    }

    function startGame() {
      if (state.finished) resetGame();
      if (mobileLayoutQuery.matches) enterFullscreen(true);
      overlay.hidden = true;
      overlay.className = 'overlay';
      state.running = true;
      state.paused = false;
      state.pausedByVisibility = false;
      getAudioContext();
      requestWakeLock();
      playSound('start');
      showToast('号令三军，出征！');
      state.lastTime = performance.now();
      const token = ++state.frameToken;
      requestAnimationFrame(time => gameLoop(time, token));
    }

    function updateHud() {
      const rank = ranks[state.player.level];
      const difficulty = getDifficulty();
      const isMax = state.player.level === ranks.length - 1;
      const requirement = rankRequirement(state.player.level);
      rankName.textContent = rank.name;
      weaponName.textContent = `兵器 · ${rank.weapon}`;
      progressLabel.textContent = isMax ? '天下归心' : `战功 ${state.player.progress} / ${requirement}`;
      progressFill.style.width = isMax ? '100%' : `${state.player.progress / requirement * 100}%`;
      heartsLabel.textContent = Array.from({ length: state.player.maxHearts }, (_, index) => index < state.player.hearts ? '♥' : '♡').join(' ');
      heartsLabel.setAttribute('aria-label', `体力 ${state.player.hearts} / ${state.player.maxHearts}`);
      recordLabel.textContent = `破敌 ${state.totalEaten} · 连破 ${state.bestStreak} · ${difficulty.name}`;
      [...rankRoad.children].forEach((item, index) => item.classList.toggle('done', index <= state.player.level));
      const activeRank = rankRoad.children[state.player.level];
      if (activeRank) rankRoad.scrollLeft = Math.max(0, activeRank.offsetLeft - rankRoad.clientWidth / 2);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(state.toastTimer);
      state.toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1000);
    }

    function setHeading(angle, activeDirection = null) {
      if (!state.running || state.paused || state.finished || state.ending) return;
      state.player.angle = angle;
      directionButtons.forEach(button => button.classList.toggle('active', button.dataset.direction === activeDirection));
    }

    function setDirection(direction) {
      const angles = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 };
      setHeading(angles[direction], direction);
    }

    function personRadius(level) {
      return ranks[level].size + level * 0.68;
    }

    function updatePlayer(delta) {
      const player = state.player;
      const speed = 188 + player.level * 3.25;
      player.x += Math.cos(player.angle) * speed * delta;
      player.y += Math.sin(player.angle) * speed * delta;
      player.invulnerable = Math.max(0, player.invulnerable - delta);
      player.pulse = Math.max(0, player.pulse - delta * 1.8);
      const follow = 1 - Math.pow(0.001, delta);
      state.camera.x += (player.x - state.camera.x) * follow;
      state.camera.y += (player.y - state.camera.y) * follow;
    }

    function updatePeople(delta) {
      const difficulty = getDifficulty();
      state.people.forEach(person => {
        person.turnTimer -= delta;
        person.bob += delta * 3;
        if (person.turnTimer <= 0) {
          person.angle += (Math.random() - 0.5) * 1.8;
          person.turnTimer = 0.7 + Math.random() * 2;
        }
        const dx = state.player.x - person.x;
        const dy = state.player.y - person.y;
        const levelGap = Math.max(0, person.level - state.player.level);
        const threatScale = 1 + Math.min(levelGap, 8) * difficulty.threatPerLevel;
        const aggroRange = difficulty.aggroRange + Math.min(levelGap, 8) * 24;
        if (levelGap > 0 && difficulty.pursuit > 0 && Math.hypot(dx, dy) < aggroRange) {
          const targetAngle = Math.atan2(dy, dx);
          const angleDelta = Math.atan2(Math.sin(targetAngle - person.angle), Math.cos(targetAngle - person.angle));
          person.angle += angleDelta * Math.min(1, difficulty.pursuit * (1 + levelGap * 0.06) * delta);
        }
        const speed = (44 + person.level * 1.9) * difficulty.enemySpeed * threatScale;
        person.x += Math.cos(person.angle) * speed * delta;
        person.y += Math.sin(person.angle) * speed * delta;
      });
    }

    function maintainPopulation(delta) {
      const difficulty = getDifficulty();
      state.populationTimer -= delta;
      if (state.populationTimer > 0) return;
      state.populationTimer = 0.8;
      state.people = state.people.filter(person => Math.hypot(person.x - state.player.x, person.y - state.player.y) < 1650);
      while (state.people.length < difficulty.population) state.people.push(spawnPerson(false, 720, 1500));
      let nearbySoldiers = state.people.filter(person =>
        person.level === 0 && Math.hypot(person.x - state.player.x, person.y - state.player.y) < 280
      ).length;
      while (nearbySoldiers < difficulty.nearbySoldiers) {
        state.people.push(spawnPerson(true, 170, 230, 0));
        nearbySoldiers++;
      }
      let nearbyEdible = state.people.filter(person =>
        person.level <= state.player.level && Math.hypot(person.x - state.player.x, person.y - state.player.y) < 280
      ).length;
      while (nearbyEdible < difficulty.nearbyEdible) {
        state.people.push(spawnPerson(true, 170, 230));
        nearbyEdible++;
      }
      const nearbyPeer = state.people.some(person =>
        person.level === state.player.level && Math.hypot(person.x - state.player.x, person.y - state.player.y) < 390
      );
      if (!nearbyPeer && Math.random() < difficulty.peerChance) state.people.push(spawnPerson(true, 250, 360, state.player.level));
      if (state.people.length > difficulty.population + 4) {
        state.people.sort((a, b) =>
          Math.hypot(a.x - state.player.x, a.y - state.player.y) - Math.hypot(b.x - state.player.x, b.y - state.player.y)
        );
        state.people = state.people.slice(0, difficulty.population + 4);
      }
    }

    function rebalanceAfterUpgrade() {
      const difficulty = getDifficulty();
      state.people = state.people.filter(person => {
        const distance = Math.hypot(person.x - state.player.x, person.y - state.player.y);
        return distance < 520 || Math.random() < 0.28;
      });
      while (state.people.length < difficulty.population) state.people.push(spawnPerson(false, 560, 1450));
      if (Math.random() < difficulty.peerChance) state.people.push(spawnPerson(true, 250, 350, state.player.level));
      state.populationTimer = 0;
    }

    function makeParticles(x, y, color, count = 10) {
      for (let index = 0; index < count; index++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 70 + Math.random() * 150;
        const maxLife = 0.55 + Math.random() * 0.45;
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: maxLife,
          maxLife,
          size: 3 + Math.random() * 6,
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 10,
          color
        });
      }
    }

    function makeImpact(x, y, type, color, power = 1) {
      state.effects.push({ x, y, type, color, power, life: type === 'upgrade' ? 1.05 : 0.72, maxLife: type === 'upgrade' ? 1.05 : 0.72 });
      state.shake = Math.max(state.shake, type === 'hit' ? 21 : type === 'upgrade' ? 18 : 10);
      state.screenFlash = Math.max(state.screenFlash, type === 'hit' ? 0.55 : type === 'upgrade' ? 0.48 : 0.2);
      state.flashColor = type === 'hit' ? '#ff665e' : color;
    }

    function eatPerson(person) {
      const player = state.player;
      const gain = 1 + Math.floor(person.level / 2);
      player.progress += gain;
      state.totalEaten++;
      state.streak++;
      state.bestStreak = Math.max(state.bestStreak, state.streak);
      makeParticles(person.x, person.y, ranks[person.level].accent, 30);
      makeImpact(person.x, person.y, 'eat', ranks[person.level].accent, 1 + person.level * 0.025);
      player.pulse = Math.max(player.pulse, 0.48);
      playSound('eat');
      if (state.streak > 0 && state.streak % 6 === 0) showToast(`威震华夏！连破 ${state.streak}`);
      else if (state.streak > 0 && state.streak % 3 === 0) showToast(`一鼓作气！连破 ${state.streak}`);
      else showToast(`破敌 · ${ranks[person.level].name} · 战功 +${gain}`);

      let upgraded = false;
      while (player.level < ranks.length - 1 && player.progress >= rankRequirement(player.level)) {
        player.progress -= rankRequirement(player.level);
        player.level++;
        upgraded = true;
        player.pulse = 1;
        makeParticles(player.x, player.y, ranks[player.level].accent, 58);
        makeImpact(player.x, player.y, 'upgrade', ranks[player.level].accent, 1.35);
        playSound('upgrade');
        showToast(`拜将封侯 · ${ranks[player.level].name}`);
      }

      if (player.level === ranks.length - 1) {
        finishGame(true);
      }
      updateHud();
      return upgraded;
    }

    function hitBySuperior(person) {
      const player = state.player;
      const difficulty = getDifficulty();
      if (player.invulnerable > 0) return;
      const levelGap = person.level - player.level;
      const damage = levelGap >= difficulty.criticalGap ? 2 : 1;
      player.hearts = Math.max(0, player.hearts - damage);
      player.progress = Math.max(0, player.progress - difficulty.progressPenalty);
      player.invulnerable = difficulty.invulnerability;
      player.pulse = 0.8;
      state.streak = 0;
      const angle = Math.atan2(player.y - person.y, player.x - person.x);
      player.x += Math.cos(angle) * 82;
      player.y += Math.sin(angle) * 82;
      person.angle += Math.PI;
      makeParticles(player.x, player.y, '#f47b71', 42);
      makeImpact(player.x, player.y, 'hit', '#ff665e', 1.25);
      playSound('hit');
      showToast(`${damage > 1 ? '敌将强袭' : '敌将来袭'} · 体力 -${damage} · 战功 -${difficulty.progressPenalty}`);
      updateHud();
      if (player.hearts <= 0) finishGame(false);
    }

    function checkCollisions() {
      const player = state.player;
      const playerRadius = personRadius(player.level);
      let shouldRebalance = false;
      for (let index = state.people.length - 1; index >= 0; index--) {
        const person = state.people[index];
        if (!person) continue;
        const range = playerRadius + personRadius(person.level) - 7;
        if (Math.hypot(player.x - person.x, player.y - person.y) > range) continue;
        if (person.level <= player.level) {
          state.people.splice(index, 1);
          shouldRebalance = eatPerson(person);
        } else {
          hitBySuperior(person);
        }
        if (state.ending || shouldRebalance) break;
      }
      if (shouldRebalance && !state.ending) rebalanceAfterUpgrade();
    }

    function updateParticles(delta) {
      state.particles.forEach(particle => {
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;
        particle.vx *= 0.96;
        particle.vy *= 0.96;
        particle.life -= delta;
        particle.rotation += particle.spin * delta;
      });
      state.particles = state.particles.filter(particle => particle.life > 0);
      state.effects.forEach(effect => { effect.life -= delta; });
      state.effects = state.effects.filter(effect => effect.life > 0);
      state.shake = Math.max(0, state.shake - delta * 34);
      state.shakeX = state.shake > 0 ? (Math.random() - 0.5) * state.shake * 2 : 0;
      state.shakeY = state.shake > 0 ? (Math.random() - 0.5) * state.shake * 2 : 0;
      state.screenFlash = Math.max(0, state.screenFlash - delta * 1.9);
    }

    function drawGround() {
      ctx.fillStyle = '#59543a';
      ctx.fillRect(0, 0, canvasView.width, canvasView.height);
      if (battlefieldImage.complete && battlefieldImage.naturalWidth) {
        const tileSize = 720;
        const left = Math.floor((state.camera.x - canvasView.width / 2 + tileSize / 2) / tileSize) - 1;
        const right = Math.ceil((state.camera.x + canvasView.width / 2 + tileSize / 2) / tileSize) + 1;
        const top = Math.floor((state.camera.y - canvasView.height / 2 + tileSize / 2) / tileSize) - 1;
        const bottom = Math.ceil((state.camera.y + canvasView.height / 2 + tileSize / 2) / tileSize) + 1;
        for (let tileX = left; tileX <= right; tileX++) {
          for (let tileY = top; tileY <= bottom; tileY++) {
            const x = tileX * tileSize - tileSize / 2 - state.camera.x + canvasView.width / 2;
            const y = tileY * tileSize - tileSize / 2 - state.camera.y + canvasView.height / 2;
            const flipX = Math.abs(tileX % 2) === 1;
            const flipY = Math.abs(tileY % 2) === 1;
            ctx.save();
            ctx.translate(x + (flipX ? tileSize : 0), y + (flipY ? tileSize : 0));
            ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
            ctx.drawImage(battlefieldImage, 0, 0, tileSize, tileSize);
            ctx.restore();
          }
        }
      }
      ctx.fillStyle = 'rgba(30, 25, 15, 0.13)';
      ctx.fillRect(0, 0, canvasView.width, canvasView.height);
    }

    function worldToScreen(x, y) {
      return {
        x: x - state.camera.x + canvasView.width / 2 + state.shakeX,
        y: y - state.camera.y + canvasView.height / 2 + state.shakeY
      };
    }

    function drawCharacterLegacy(x, y, level, angle, isPlayer, alpha = 1) {
      const rank = ranks[level];
      const radius = personRadius(level);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);

      if (isPlayer) {
        ctx.strokeStyle = '#ffe27c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, radius + 7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#ffe27c';
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * (radius + 11), Math.sin(angle) * (radius + 11));
        ctx.lineTo(Math.cos(angle + 2.5) * (radius + 4), Math.sin(angle + 2.5) * (radius + 4));
        ctx.lineTo(Math.cos(angle - 2.5) * (radius + 4), Math.sin(angle - 2.5) * (radius + 4));
        ctx.closePath();
        ctx.fill();
      }

      if (level >= 8) {
        const capeColors = ['#304b69', '#744064', '#7a3c34', '#922f3e', '#e7e1cf', '#7c2741'];
        ctx.fillStyle = capeColors[level - 8];
        ctx.beginPath();
        ctx.moveTo(-radius * 0.78, -radius * 0.25);
        ctx.lineTo(-radius * 1.18, radius * 1.05);
        ctx.lineTo(radius * 1.18, radius * 1.05);
        ctx.lineTo(radius * 0.78, -radius * 0.25);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = rank.color;
      ctx.beginPath();
      if (level <= 2) {
        ctx.arc(0, radius * 0.18, radius * 0.78, 0, Math.PI * 2);
      } else if (level <= 6) {
        ctx.moveTo(-radius * 0.92, -radius * 0.08);
        ctx.lineTo(-radius * 0.72, radius * 0.88);
        ctx.lineTo(radius * 0.72, radius * 0.88);
        ctx.lineTo(radius * 0.92, -radius * 0.08);
        ctx.closePath();
      } else if (level <= 10) {
        ctx.moveTo(-radius, 0);
        ctx.lineTo(-radius * 0.62, radius);
        ctx.lineTo(radius * 0.62, radius);
        ctx.lineTo(radius, 0);
        ctx.lineTo(radius * 0.62, -radius * 0.18);
        ctx.lineTo(-radius * 0.62, -radius * 0.18);
        ctx.closePath();
      } else {
        ctx.moveTo(-radius * 0.72, -radius * 0.12);
        ctx.lineTo(-radius * 1.08, radius * 1.02);
        ctx.lineTo(radius * 1.08, radius * 1.02);
        ctx.lineTo(radius * 0.72, -radius * 0.12);
        ctx.closePath();
      }
      ctx.fill();

      if (level >= 3 && level <= 10) {
        ctx.fillStyle = rank.accent;
        ctx.beginPath();
        ctx.arc(-radius * 0.82, radius * 0.05, radius * 0.24, 0, Math.PI * 2);
        ctx.arc(radius * 0.82, radius * 0.05, radius * 0.24, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#f0c8a1';
      ctx.beginPath();
      ctx.arc(0, -radius * 0.45, radius * 0.47, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#20292d';
      ctx.beginPath();
      ctx.arc(-radius * 0.16, -radius * 0.43, 1.6, 0, Math.PI * 2);
      ctx.arc(radius * 0.16, -radius * 0.43, 1.6, 0, Math.PI * 2);
      ctx.fill();

      drawRankGearLegacy(level, radius, rank);

      ctx.fillStyle = '#eef7f2';
      ctx.font = `800 ${Math.max(9, radius * 0.4)}px Arial, Microsoft YaHei, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isPlayer ? '你' : level + 1, 0, radius * 0.18);
      ctx.restore();
    }

    function drawRankGearLegacy(level, radius, rank) {
      ctx.strokeStyle = rank.accent;
      ctx.fillStyle = rank.accent;
      ctx.lineWidth = Math.max(2, radius * 0.11);
      ctx.lineCap = 'round';

      const line = (fromX, fromY, toX, toY) => {
        ctx.beginPath();
        ctx.moveTo(fromX * radius, fromY * radius);
        ctx.lineTo(toX * radius, toY * radius);
        ctx.stroke();
      };
      const helmet = (scale = 0.58) => {
        ctx.beginPath();
        ctx.arc(0, -radius * 0.51, radius * scale, Math.PI, 0);
        ctx.lineTo(radius * scale, -radius * 0.45);
        ctx.lineTo(-radius * scale, -radius * 0.45);
        ctx.closePath();
        ctx.fill();
      };
      const shield = (side = -1) => {
        ctx.beginPath();
        ctx.moveTo(side * radius * 0.72, -radius * 0.06);
        ctx.lineTo(side * radius * 1.18, radius * 0.08);
        ctx.lineTo(side * radius * 1.08, radius * 0.72);
        ctx.lineTo(side * radius * 0.72, radius * 0.88);
        ctx.closePath();
        ctx.fill();
      };

      switch (level) {
      case 0:
        ctx.fillRect(-radius * 0.5, -radius * 0.82, radius, radius * 0.16);
        ctx.fillRect(-radius * 0.28, -radius, radius * 0.66, radius * 0.2);
        break;
      case 1:
        ctx.fillRect(-radius * 0.52, -radius * 0.68, radius * 1.04, radius * 0.14);
        ctx.beginPath();
        ctx.arc(radius * 0.48, -radius * 0.64, radius * 0.13, 0, Math.PI * 2);
        ctx.fill();
        line(0.72, -0.15, 1.02, 0.82);
        break;
      case 2:
        ctx.beginPath();
        ctx.moveTo(-radius * 0.55, -radius * 0.82);
        ctx.lineTo(0, -radius * 1.16);
        ctx.lineTo(radius * 0.55, -radius * 0.82);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(-radius * 0.95, -radius * 0.08, radius * 0.34, radius * 0.3);
        ctx.fillRect(radius * 0.61, -radius * 0.08, radius * 0.34, radius * 0.3);
        break;
      case 3:
        ctx.fillRect(-radius * 0.82, -radius * 0.82, radius * 1.64, radius * 0.16);
        ctx.fillRect(-radius * 0.48, -radius * 1.08, radius * 0.96, radius * 0.28);
        line(0.72, -0.08, 1.15, 0.68);
        ctx.beginPath();
        ctx.arc(radius * 1.18, radius * 0.76, radius * 0.16, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 4:
        helmet();
        line(0.72, -0.35, 1.08, 0.9);
        ctx.beginPath();
        ctx.moveTo(radius * 0.93, -radius * 0.25);
        ctx.lineTo(radius * 1.1, -radius * 0.68);
        ctx.lineTo(radius * 1.22, -radius * 0.2);
        ctx.closePath();
        ctx.fill();
        break;
      case 5:
        helmet(0.62);
        ctx.fillStyle = '#e65f4f';
        ctx.beginPath();
        ctx.moveTo(-radius * 0.32, -radius * 1.02);
        ctx.lineTo(0, -radius * 1.52);
        ctx.lineTo(radius * 0.32, -radius * 1.02);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = rank.accent;
        shield(-1);
        break;
      case 6:
        helmet(0.64);
        ctx.beginPath();
        ctx.arc(0, -radius * 1.03, radius * 0.28, Math.PI, 0);
        ctx.fill();
        line(0.82, -0.42, 1.18, 0.92);
        break;
      case 7:
        ctx.fillRect(-radius * 0.74, -radius * 0.76, radius * 1.48, radius * 0.14);
        ctx.fillRect(-radius * 0.18, -radius * 1.12, radius * 0.36, radius * 0.4);
        ctx.beginPath();
        ctx.moveTo(-radius * 0.72, -radius * 0.72);
        ctx.lineTo(-radius * 1.12, -radius * 0.94);
        ctx.lineTo(-radius * 0.78, -radius * 0.5);
        ctx.closePath();
        ctx.fill();
        line(0.68, 0, 1.08, 0.72);
        break;
      case 8:
        helmet(0.66);
        ctx.fillRect(-radius * 0.09, -radius * 0.53, radius * 0.18, radius * 0.7);
        line(1.0, -0.76, 1.0, 0.92);
        ctx.beginPath();
        ctx.moveTo(radius, -radius * 0.75);
        ctx.lineTo(radius * 1.62, -radius * 0.48);
        ctx.lineTo(radius, -radius * 0.18);
        ctx.closePath();
        ctx.fill();
        break;
      case 9:
        ctx.fillRect(-radius * 0.62, -radius * 0.82, radius * 1.24, radius * 0.16);
        ctx.beginPath();
        ctx.arc(0, -radius * 0.82, radius * 0.3, Math.PI, 0);
        ctx.fill();
        line(-0.92, -0.35, -0.92, 0.92);
        ctx.fillRect(-radius * 1.55, -radius * 0.6, radius * 0.63, radius * 0.5);
        break;
      case 10:
        helmet(0.68);
        ctx.fillStyle = '#e95b4d';
        ctx.fillRect(-radius * 0.1, -radius * 1.42, radius * 0.2, radius * 0.48);
        ctx.fillStyle = rank.accent;
        shield(-1);
        line(0.7, -0.08, 1.18, 0.76);
        break;
      case 11:
        helmet(0.7);
        ctx.beginPath();
        ctx.moveTo(-radius * 0.35, -radius * 0.95);
        ctx.lineTo(-radius * 0.72, -radius * 1.35);
        ctx.lineTo(-radius * 0.62, -radius * 0.82);
        ctx.moveTo(radius * 0.35, -radius * 0.95);
        ctx.lineTo(radius * 0.72, -radius * 1.35);
        ctx.lineTo(radius * 0.62, -radius * 0.82);
        ctx.stroke();
        line(-0.72, -0.02, -1.14, 0.78);
        line(0.72, -0.02, 1.14, 0.78);
        break;
      case 12:
        helmet(0.7);
        ctx.fillStyle = '#f3efe0';
        ctx.beginPath();
        ctx.moveTo(-radius * 0.22, -radius * 1.03);
        ctx.quadraticCurveTo(radius * 0.15, -radius * 1.75, radius * 0.5, -radius * 1.22);
        ctx.lineTo(radius * 0.18, -radius * 0.95);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = rank.accent;
        line(0.86, -0.08, 0.98, 0.9);
        ctx.beginPath();
        ctx.arc(radius * 0.84, -radius * 0.22, radius * 0.18, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 13:
        ctx.beginPath();
        ctx.moveTo(-radius * 0.68, -radius * 0.7);
        ctx.lineTo(-radius * 0.48, -radius * 1.42);
        ctx.lineTo(0, -radius * 0.94);
        ctx.lineTo(radius * 0.48, -radius * 1.42);
        ctx.lineTo(radius * 0.68, -radius * 0.7);
        ctx.closePath();
        ctx.fill();
        line(0.82, -0.05, 1.0, 0.88);
        ctx.beginPath();
        ctx.arc(radius * 0.78, -radius * 0.24, radius * 0.2, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
    }

    function drawWeapon(level, radius, rank) {
      const tier = Math.floor(level / 3);
      const variant = level % 3;
      const steel = tier >= 8 ? '#ffe59a' : tier >= 4 ? '#dce8ea' : '#bcc9c8';
      const wood = tier >= 7 ? '#752f2b' : '#694b32';
      ctx.lineCap = 'round';

      const spear = (side = 1, length = 1.55, halberd = false, ornate = false) => {
        const x = side * radius * 0.94;
        ctx.strokeStyle = wood;
        ctx.lineWidth = Math.max(3, radius * 0.1);
        ctx.beginPath();
        ctx.moveTo(x, radius * 0.98);
        ctx.lineTo(x - side * radius * 0.16, -radius * length);
        ctx.stroke();
        const tipX = x - side * radius * 0.16;
        const tipY = -radius * length;
        ctx.fillStyle = steel;
        ctx.beginPath();
        ctx.moveTo(tipX, tipY - radius * 0.42);
        ctx.lineTo(tipX - radius * 0.16, tipY);
        ctx.lineTo(tipX + radius * 0.16, tipY);
        ctx.closePath();
        ctx.fill();
        if (halberd) {
          ctx.beginPath();
          ctx.moveTo(tipX, tipY + radius * 0.06);
          ctx.quadraticCurveTo(tipX + side * radius * 0.62, tipY - radius * 0.12, tipX + side * radius * 0.38, tipY + radius * 0.38);
          ctx.lineTo(tipX, tipY + radius * 0.25);
          ctx.closePath();
          ctx.fill();
        }
        if (ornate) {
          ctx.fillStyle = '#d84d45';
          ctx.beginPath();
          ctx.moveTo(tipX, tipY + radius * 0.17);
          ctx.lineTo(tipX - radius * 0.34, tipY + radius * 0.44);
          ctx.lineTo(tipX + radius * 0.26, tipY + radius * 0.35);
          ctx.closePath();
          ctx.fill();
        }
      };

      const sword = (side = 1, length = 1.0, curved = false) => {
        const handleX = side * radius * 0.82;
        const handleY = radius * 0.72;
        const tipX = side * radius * (0.98 + length * 0.2);
        const tipY = -radius * length;
        ctx.strokeStyle = steel;
        ctx.lineWidth = Math.max(4, radius * 0.16);
        ctx.beginPath();
        ctx.moveTo(handleX, handleY);
        if (curved) ctx.quadraticCurveTo(side * radius * 1.34, -radius * 0.15, tipX, tipY);
        else ctx.lineTo(tipX, tipY);
        ctx.stroke();
        ctx.strokeStyle = '#5e3727';
        ctx.lineWidth = Math.max(3, radius * 0.11);
        ctx.beginPath();
        ctx.moveTo(handleX - side * radius * 0.08, handleY + radius * 0.28);
        ctx.lineTo(handleX, handleY);
        ctx.stroke();
        ctx.strokeStyle = rank.accent;
        ctx.lineWidth = Math.max(2, radius * 0.08);
        ctx.beginPath();
        ctx.moveTo(handleX - radius * 0.22, handleY - radius * 0.02);
        ctx.lineTo(handleX + radius * 0.22, handleY - radius * 0.02);
        ctx.stroke();
      };

      const shield = (side = -1) => {
        ctx.fillStyle = tier >= 7 ? '#a37027' : '#6c4937';
        ctx.strokeStyle = rank.accent;
        ctx.lineWidth = Math.max(2, radius * 0.08);
        ctx.beginPath();
        ctx.moveTo(side * radius * 0.62, -radius * 0.14);
        ctx.lineTo(side * radius * 1.28, radius * 0.06);
        ctx.lineTo(side * radius * 1.18, radius * 0.82);
        ctx.lineTo(side * radius * 0.68, radius * 1.0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(side * radius * 0.94, radius * 0.38, radius * 0.14, 0, Math.PI * 2);
        ctx.stroke();
      };

      const bow = () => {
        ctx.strokeStyle = '#b88443';
        ctx.lineWidth = Math.max(3, radius * 0.1);
        ctx.beginPath();
        ctx.arc(radius * 0.9, 0, radius * 0.9, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
        ctx.strokeStyle = '#e4ddd0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(radius * 0.9, -radius * 0.9);
        ctx.lineTo(radius * 0.9, radius * 0.9);
        ctx.stroke();
      };

      const mace = () => {
        ctx.strokeStyle = wood;
        ctx.lineWidth = Math.max(4, radius * 0.12);
        ctx.beginPath();
        ctx.moveTo(radius * 0.8, radius * 0.88);
        ctx.lineTo(radius * 1.1, -radius * 0.82);
        ctx.stroke();
        ctx.fillStyle = steel;
        for (let index = 0; index < 6; index++) {
          const angle = index * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(radius * 1.1, -radius * 0.82);
          ctx.lineTo(radius * 1.1 + Math.cos(angle) * radius * 0.36, -radius * 0.82 + Math.sin(angle) * radius * 0.36);
          ctx.lineTo(radius * 1.1 + Math.cos(angle + 0.35) * radius * 0.16, -radius * 0.82 + Math.sin(angle + 0.35) * radius * 0.16);
          ctx.closePath();
          ctx.fill();
        }
      };

      if (tier === 0) {
        if (variant === 1) sword(1, 0.72, true);
        else spear(1, variant === 0 ? 1.08 : 1.38, false, false);
      } else if (tier === 1) {
        if (variant === 0) sword(1, 0.98, true);
        else if (variant === 1) spear(1, 1.48, false, false);
        else bow();
      } else if (tier === 2) {
        if (variant === 0) { sword(-1, 0.9, false); sword(1, 0.9, false); }
        else if (variant === 1) spear(1, 1.65, false, true);
        else sword(1, 1.22, true);
      } else if (tier === 3) {
        spear(1, 1.72, variant === 1, variant !== 0);
      } else if (tier === 4) {
        if (variant === 0) { sword(1, 1.2, false); shield(-1); }
        else if (variant === 1) { bow(); sword(-1, 0.7, false); }
        else spear(1, 1.75, true, true);
      } else if (tier === 5) {
        if (variant === 0) sword(1, 1.48, true);
        else if (variant === 1) { sword(-1, 1.16, false); sword(1, 1.16, false); }
        else spear(1, 1.92, false, true);
      } else if (tier === 6) {
        if (variant === 0) spear(1, 1.92, false, true);
        else if (variant === 1) sword(1, 1.45, true);
        else { spear(-1, 1.38, true, false); spear(1, 1.38, true, false); }
      } else if (tier === 7) {
        if (variant === 0) spear(1, 1.94, true, true);
        else if (variant === 1) mace();
        else spear(1, 2.02, false, true);
      } else if (tier === 8) {
        if (variant === 0) spear(1, 2.08, true, true);
        else sword(1, variant === 1 ? 1.52 : 1.68, true);
      } else {
        if (variant === 0) spear(1, 2.18, false, true);
        else if (variant === 1) spear(1, 2.22, true, true);
        else sword(1, 1.82, false);
      }
    }

    function drawHeadgear(style, variant, radius, rank) {
      ctx.fillStyle = rank.accent;
      ctx.strokeStyle = '#293238';
      ctx.lineWidth = Math.max(1.5, radius * 0.05);
      const brim = () => ctx.fillRect(-radius * 0.62, -radius * 0.76, radius * 1.24, radius * 0.12);

      if (style === 0) {
        if (variant === 0) {
          ctx.fillStyle = '#4b4e46';
          ctx.beginPath();
          ctx.moveTo(-radius * 0.48, -radius * 0.72);
          ctx.lineTo(-radius * 0.2, -radius * 1.04);
          ctx.lineTo(radius * 0.48, -radius * 0.72);
          ctx.closePath();
          ctx.fill();
        } else if (variant === 1) {
          ctx.fillRect(-radius * 0.55, -radius * 0.7, radius * 1.1, radius * 0.14);
          ctx.fillRect(radius * 0.38, -radius * 0.66, radius * 0.44, radius * 0.08);
        } else {
          ctx.beginPath();
          ctx.arc(0, -radius * 0.52, radius * 0.52, Math.PI, 0);
          ctx.fill();
          brim();
        }
      } else if (style === 1) {
        ctx.beginPath();
        ctx.arc(0, -radius * 0.53, radius * 0.56, Math.PI, 0);
        ctx.fill();
        brim();
        if (variant === 2) {
          ctx.fillStyle = '#d75445';
          ctx.fillRect(-radius * 0.08, -radius * 1.36, radius * 0.16, radius * 0.54);
        }
      } else if (style === 2) {
        ctx.fillStyle = '#c8d5d4';
        ctx.beginPath();
        ctx.arc(0, -radius * 0.52, radius * 0.6, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = rank.accent;
        ctx.fillRect(-radius * 0.08, -radius * 1.22, radius * 0.16, radius * 0.42);
        if (variant === 2) {
          ctx.beginPath();
          ctx.moveTo(0, -radius * 1.2);
          ctx.quadraticCurveTo(radius * 0.56, -radius * 1.48, radius * 0.64, -radius * 0.95);
          ctx.lineTo(radius * 0.18, -radius * 0.82);
          ctx.closePath();
          ctx.fill();
        }
      } else if (style === 3) {
        ctx.fillStyle = '#34383d';
        ctx.beginPath();
        ctx.arc(0, -radius * 0.52, radius * 0.62, Math.PI, 0);
        ctx.fill();
        ctx.strokeStyle = rank.accent;
        ctx.lineWidth = radius * 0.09;
        ctx.beginPath();
        ctx.moveTo(-radius * 0.48, -radius * 0.9);
        ctx.lineTo(-radius * 0.72, -radius * 1.24);
        ctx.moveTo(radius * 0.48, -radius * 0.9);
        ctx.lineTo(radius * 0.72, -radius * 1.24);
        ctx.stroke();
      } else if (style === 4) {
        ctx.fillStyle = '#315b3b';
        ctx.fillRect(-radius * 0.52, -radius * 0.77, radius * 1.04, radius * 0.15);
        ctx.beginPath();
        ctx.moveTo(-radius * 0.42, -radius * 0.78);
        ctx.lineTo(0, -radius * 1.18);
        ctx.lineTo(radius * 0.42, -radius * 0.78);
        ctx.closePath();
        ctx.fill();
        if (variant === 2) {
          ctx.fillRect(-radius * 0.76, -radius * 0.74, radius * 1.52, radius * 0.09);
        }
      } else if (style === 5) {
        ctx.beginPath();
        ctx.arc(0, -radius * 0.53, radius * 0.64, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#d84b42';
        ctx.beginPath();
        ctx.moveTo(-radius * 0.18, -radius * 1.03);
        ctx.quadraticCurveTo(radius * 0.1, -radius * 1.65, radius * 0.4, -radius * 1.12);
        ctx.lineTo(radius * 0.18, -radius * 0.9);
        ctx.closePath();
        ctx.fill();
      } else if (style === 6) {
        ctx.fillStyle = '#d5dedd';
        ctx.beginPath();
        ctx.arc(0, -radius * 0.52, radius * 0.66, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = rank.accent;
        ctx.fillRect(-radius * 0.1, -radius * 1.42, radius * 0.2, radius * 0.58);
        ctx.fillRect(-radius * 0.67, -radius * 0.55, radius * 0.18, radius * 0.47);
        ctx.fillRect(radius * 0.49, -radius * 0.55, radius * 0.18, radius * 0.47);
      } else if (style === 7) {
        ctx.fillStyle = '#232a2d';
        ctx.beginPath();
        ctx.arc(0, -radius * 0.52, radius * 0.68, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#b83232';
        ctx.beginPath();
        ctx.moveTo(-radius * 0.22, -radius * 1.04);
        ctx.lineTo(0, -radius * 1.52);
        ctx.lineTo(radius * 0.22, -radius * 1.04);
        ctx.closePath();
        ctx.fill();
      } else if (style === 8) {
        ctx.beginPath();
        ctx.arc(0, -radius * 0.52, radius * 0.7, Math.PI, 0);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-radius * 0.56, -radius * 0.78);
        ctx.lineTo(-radius * 0.98, -radius * 1.1);
        ctx.lineTo(-radius * 0.7, -radius * 0.62);
        ctx.moveTo(radius * 0.56, -radius * 0.78);
        ctx.lineTo(radius * 0.98, -radius * 1.1);
        ctx.lineTo(radius * 0.7, -radius * 0.62);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(-radius * 0.72, -radius * 0.7);
        ctx.lineTo(-radius * 0.5, -radius * 1.42);
        ctx.lineTo(0, -radius * 0.98);
        ctx.lineTo(radius * 0.5, -radius * 1.42);
        ctx.lineTo(radius * 0.72, -radius * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#c9423e';
        ctx.beginPath();
        ctx.arc(0, -radius * 1.03, radius * 0.11, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCharacterPortrait(x, y, level, angle, isPlayer, alpha = 1, renderScale = 1) {
      const rank = ranks[level];
      const radius = personRadius(level);
      const portrait = characterPortraits[Math.min(characterPortraits.length - 1, Math.floor(level / 3))];
      const artSize = radius * 3.15;
      const badgeRadius = Math.max(7, radius * 0.25);
      const badgeY = -radius * 1.23;
      const facingLeft = Math.cos(angle) < 0;
      const badgeColor = isPlayer ? '#ffd369' : level <= state.player.level ? '#7ad891' : '#ff8a7d';

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.scale(renderScale, renderScale);

      ctx.fillStyle = 'rgba(8, 14, 17, 0.36)';
      ctx.beginPath();
      ctx.ellipse(0, radius * 1.04, radius * 0.95, radius * 0.23, 0, 0, Math.PI * 2);
      ctx.fill();

      if (level >= 12) {
        ctx.strokeStyle = level >= 27 ? 'rgba(255, 213, 94, 0.8)' : 'rgba(170, 215, 225, 0.5)';
        ctx.lineWidth = level >= 27 ? 4 : 2;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.35, 0, Math.PI * 2);
        ctx.stroke();
      }

      const threatGap = level - state.player.level;
      if (!isPlayer && threatGap > 0 && state.difficulty !== 'rookie') {
        const difficulty = getDifficulty();
        const lethal = threatGap >= difficulty.criticalGap;
        const pulse = 0.5 + Math.sin(performance.now() / 150 + level) * 0.5;
        ctx.strokeStyle = lethal ? `rgba(255, 58, 48, ${0.72 + pulse * 0.2})` : `rgba(202, 71, 58, ${0.48 + pulse * 0.24})`;
        ctx.lineWidth = lethal ? 5 : 2.5 + Math.min(2, threatGap * 0.18);
        ctx.setLineDash(lethal ? [10, 5] : [6, 7]);
        ctx.lineDashOffset = -performance.now() / (lethal ? 45 : 75);
        ctx.beginPath();
        ctx.arc(0, 0, radius * (1.5 + pulse * 0.06), 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (isPlayer) {
        ctx.strokeStyle = '#ffe27c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.42, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.save();
      if (facingLeft) ctx.scale(-1, 1);
      ctx.drawImage(portrait, -artSize / 2, -artSize / 2, artSize, artSize);
      ctx.restore();

      if (isPlayer) {
        const pointerTip = radius * 1.68;
        const pointerBase = radius * 1.42;
        const pointerHalfWidth = radius * 0.17;
        ctx.fillStyle = '#ffe27c';
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * pointerTip, Math.sin(angle) * pointerTip);
        ctx.lineTo(
          Math.cos(angle) * pointerBase + Math.cos(angle + Math.PI / 2) * pointerHalfWidth,
          Math.sin(angle) * pointerBase + Math.sin(angle + Math.PI / 2) * pointerHalfWidth
        );
        ctx.lineTo(
          Math.cos(angle) * pointerBase + Math.cos(angle - Math.PI / 2) * pointerHalfWidth,
          Math.sin(angle) * pointerBase + Math.sin(angle - Math.PI / 2) * pointerHalfWidth
        );
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#162128';
      ctx.strokeStyle = badgeColor;
      ctx.lineWidth = Math.max(1.5, radius * 0.055);
      ctx.beginPath();
      ctx.arc(0, badgeY, badgeRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f7eee1';
      ctx.font = `800 ${Math.max(9, radius * 0.27)}px Arial, Microsoft YaHei, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(level + 1, 0, badgeY + 0.5);
      ctx.restore();
    }

    function drawCharacter(x, y, level, angle, isPlayer, alpha = 1, renderScale = 1) {
      const portrait = characterPortraits[Math.min(characterPortraits.length - 1, Math.floor(level / 3))];
      if (portrait && portrait.complete && portrait.naturalWidth) {
        drawCharacterPortrait(x, y, level, angle, isPlayer, alpha, renderScale);
        return;
      }
      const rank = ranks[level];
      const radius = personRadius(level);
      const style = rank.style;
      const variant = level % 3;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.scale(renderScale, renderScale);

      ctx.fillStyle = 'rgba(8, 14, 17, 0.34)';
      ctx.beginPath();
      ctx.ellipse(0, radius * 1.08, radius * 0.92, radius * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();

      if (level >= 12) {
        ctx.strokeStyle = level >= 27 ? 'rgba(255, 213, 94, 0.72)' : 'rgba(170, 215, 225, 0.42)';
        ctx.lineWidth = level >= 27 ? 4 : 2;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.25, 0, Math.PI * 2);
        ctx.stroke();
        if (level >= 24) {
          ctx.beginPath();
          ctx.arc(0, 0, radius * 1.42, 0.2, Math.PI * 1.45);
          ctx.stroke();
        }
      }

      if (isPlayer) {
        ctx.strokeStyle = '#ffe27c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, radius + 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#ffe27c';
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * (radius + 13), Math.sin(angle) * (radius + 13));
        ctx.lineTo(Math.cos(angle + 2.55) * (radius + 5), Math.sin(angle + 2.55) * (radius + 5));
        ctx.lineTo(Math.cos(angle - 2.55) * (radius + 5), Math.sin(angle - 2.55) * (radius + 5));
        ctx.closePath();
        ctx.fill();
      }

      drawWeapon(level, radius, rank);

      if (style >= 4) {
        const capeColors = ['#31583b', '#7e3438', '#31526d', '#322c31', '#8b3038', '#6c263f'];
        ctx.fillStyle = capeColors[style - 4];
        ctx.beginPath();
        ctx.moveTo(-radius * 0.72, -radius * 0.16);
        ctx.quadraticCurveTo(-radius * 1.18, radius * 0.52, -radius, radius * 1.14);
        ctx.lineTo(radius, radius * 1.14);
        ctx.quadraticCurveTo(radius * 1.18, radius * 0.52, radius * 0.72, -radius * 0.16);
        ctx.closePath();
        ctx.fill();
      }

      ctx.strokeStyle = '#252b2d';
      ctx.lineWidth = Math.max(4, radius * 0.16);
      ctx.beginPath();
      ctx.moveTo(-radius * 0.28, radius * 0.64);
      ctx.lineTo(-radius * 0.34, radius * 1.06);
      ctx.moveTo(radius * 0.28, radius * 0.64);
      ctx.lineTo(radius * 0.34, radius * 1.06);
      ctx.stroke();

      const shoulder = 0.68 + style * 0.035;
      ctx.fillStyle = rank.color;
      ctx.beginPath();
      if (style === 0) {
        ctx.moveTo(-radius * 0.58, -radius * 0.02);
        ctx.quadraticCurveTo(-radius * 0.8, radius * 0.45, -radius * 0.58, radius * 0.92);
        ctx.lineTo(radius * 0.58, radius * 0.92);
        ctx.quadraticCurveTo(radius * 0.8, radius * 0.45, radius * 0.58, -radius * 0.02);
      } else if (style === 4 || style === 9) {
        ctx.moveTo(-radius * shoulder, -radius * 0.06);
        ctx.lineTo(-radius * 0.95, radius * 1.02);
        ctx.lineTo(radius * 0.95, radius * 1.02);
        ctx.lineTo(radius * shoulder, -radius * 0.06);
      } else {
        ctx.moveTo(-radius * shoulder, -radius * 0.1);
        ctx.lineTo(-radius * 0.78, radius * 0.9);
        ctx.lineTo(radius * 0.78, radius * 0.9);
        ctx.lineTo(radius * shoulder, -radius * 0.1);
      }
      ctx.closePath();
      ctx.fill();

      if (style > 0 && style !== 4 && style !== 9) {
        ctx.fillStyle = rank.accent;
        ctx.beginPath();
        ctx.ellipse(-radius * shoulder, radius * 0.04, radius * 0.3, radius * 0.22, -0.25, 0, Math.PI * 2);
        ctx.ellipse(radius * shoulder, radius * 0.04, radius * 0.3, radius * 0.22, 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = rank.accent;
        ctx.lineWidth = Math.max(1.5, radius * 0.055);
        for (let row = 0; row < 3; row++) {
          ctx.beginPath();
          ctx.moveTo(-radius * 0.48, radius * (0.2 + row * 0.2));
          ctx.lineTo(radius * 0.48, radius * (0.2 + row * 0.2));
          ctx.stroke();
        }
      } else {
        ctx.strokeStyle = rank.accent;
        ctx.lineWidth = Math.max(2, radius * 0.07);
        ctx.beginPath();
        ctx.moveTo(-radius * 0.48, radius * 0.42);
        ctx.lineTo(radius * 0.48, radius * 0.42);
        ctx.stroke();
      }

      ctx.strokeStyle = '#342b27';
      ctx.lineWidth = Math.max(3, radius * 0.11);
      ctx.beginPath();
      ctx.moveTo(-radius * shoulder, radius * 0.12);
      ctx.lineTo(-radius * 0.82, radius * 0.48);
      ctx.moveTo(radius * shoulder, radius * 0.12);
      ctx.lineTo(radius * 0.82, radius * 0.48);
      ctx.stroke();
      ctx.fillStyle = '#e6b98f';
      ctx.beginPath();
      ctx.arc(-radius * 0.82, radius * 0.5, radius * 0.13, 0, Math.PI * 2);
      ctx.arc(radius * 0.82, radius * 0.5, radius * 0.13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#302925';
      ctx.fillRect(-radius * 0.68, radius * 0.66, radius * 1.36, radius * 0.12);
      ctx.fillStyle = rank.accent;
      ctx.fillRect(-radius * 0.1, radius * 0.62, radius * 0.2, radius * 0.2);
      ctx.strokeStyle = rank.accent;
      ctx.lineWidth = Math.max(1.5, radius * 0.05);
      ctx.beginPath();
      if (variant === 0) {
        ctx.moveTo(0, radius * 0.06);
        ctx.lineTo(0, radius * 0.58);
      } else if (variant === 1) {
        ctx.moveTo(-radius * 0.38, radius * 0.08);
        ctx.lineTo(radius * 0.38, radius * 0.55);
        ctx.moveTo(radius * 0.38, radius * 0.08);
        ctx.lineTo(-radius * 0.38, radius * 0.55);
      } else {
        ctx.moveTo(0, radius * 0.07);
        ctx.lineTo(radius * 0.24, radius * 0.3);
        ctx.lineTo(0, radius * 0.55);
        ctx.lineTo(-radius * 0.24, radius * 0.3);
        ctx.closePath();
      }
      ctx.stroke();

      ctx.fillStyle = '#e6b98f';
      ctx.beginPath();
      ctx.ellipse(-radius * 0.47, -radius * 0.42, radius * 0.13, radius * 0.17, 0, 0, Math.PI * 2);
      ctx.ellipse(radius * 0.47, -radius * 0.42, radius * 0.13, radius * 0.17, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e9bd94';
      ctx.beginPath();
      ctx.ellipse(0, -radius * 0.43, radius * 0.48, radius * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#392d29';
      ctx.lineWidth = Math.max(1.5, radius * 0.055);
      ctx.beginPath();
      ctx.moveTo(-radius * 0.31, -radius * 0.55);
      ctx.lineTo(-radius * 0.1, -radius * 0.6);
      ctx.moveTo(radius * 0.1, -radius * 0.6);
      ctx.lineTo(radius * 0.31, -radius * 0.55);
      ctx.stroke();
      ctx.fillStyle = '#252322';
      ctx.beginPath();
      ctx.ellipse(-radius * 0.2, -radius * 0.47, radius * 0.045, radius * 0.065, 0, 0, Math.PI * 2);
      ctx.ellipse(radius * 0.2, -radius * 0.47, radius * 0.045, radius * 0.065, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#a56f59';
      ctx.lineWidth = Math.max(1, radius * 0.035);
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.43);
      ctx.lineTo(-radius * 0.04, -radius * 0.25);
      ctx.lineTo(radius * 0.05, -radius * 0.23);
      ctx.stroke();

      if (style === 3 || style === 7) {
        ctx.fillStyle = '#262321';
        ctx.beginPath();
        ctx.moveTo(-radius * 0.38, -radius * 0.2);
        ctx.quadraticCurveTo(-radius * 0.4, radius * 0.3, 0, radius * (style === 7 ? 0.72 : 0.48));
        ctx.quadraticCurveTo(radius * 0.4, radius * 0.3, radius * 0.38, -radius * 0.2);
        ctx.quadraticCurveTo(0, radius * 0.04, -radius * 0.38, -radius * 0.2);
        ctx.fill();
      } else if (style === 4) {
        ctx.strokeStyle = '#252321';
        ctx.lineWidth = radius * 0.13;
        ctx.beginPath();
        ctx.moveTo(-radius * 0.2, -radius * 0.18);
        ctx.quadraticCurveTo(-radius * 0.14, radius * 0.4, 0, radius * 0.82);
        ctx.quadraticCurveTo(radius * 0.14, radius * 0.4, radius * 0.2, -radius * 0.18);
        ctx.stroke();
      } else if (style >= 8 || (variant === 2 && style > 0)) {
        ctx.strokeStyle = '#302522';
        ctx.lineWidth = Math.max(2, radius * 0.075);
        ctx.beginPath();
        ctx.moveTo(-radius * 0.26, -radius * 0.18);
        ctx.quadraticCurveTo(-radius * 0.12, -radius * 0.05, 0, -radius * 0.16);
        ctx.quadraticCurveTo(radius * 0.12, -radius * 0.05, radius * 0.26, -radius * 0.18);
        ctx.stroke();
      }

      drawHeadgear(style, variant, radius, rank);

      ctx.fillStyle = '#162128';
      ctx.beginPath();
      ctx.arc(0, radius * 0.49, radius * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f7eee1';
      ctx.font = `800 ${Math.max(9, radius * 0.29)}px Arial, Microsoft YaHei, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(level + 1, 0, radius * 0.5);
      ctx.restore();
    }

    function drawParticles() {
      state.particles.forEach(particle => {
        const screen = worldToScreen(particle.x, particle.y);
        ctx.save();
        ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
        ctx.fillStyle = particle.color;
        ctx.translate(screen.x, screen.y);
        ctx.rotate(particle.rotation);
        ctx.fillRect(-particle.size / 2, -particle.size / 2, particle.size, particle.size);
        ctx.restore();
      });
      ctx.globalAlpha = 1;
    }

    function drawEffects() {
      state.effects.forEach(effect => {
        const screen = worldToScreen(effect.x, effect.y);
        const progress = 1 - effect.life / effect.maxLife;
        const reach = (effect.type === 'upgrade' ? 165 : effect.type === 'hit' ? 120 : 92) * effect.power;
        const radius = 14 + progress * reach;
        ctx.save();
        ctx.translate(screen.x, screen.y);
        ctx.globalAlpha = Math.max(0, effect.life / effect.maxLife);
        ctx.strokeStyle = effect.color;
        ctx.lineWidth = effect.type === 'upgrade' ? 8 : 6;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha *= 0.55;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.68, 0, Math.PI * 2);
        ctx.stroke();

        const rays = effect.type === 'upgrade' ? 16 : effect.type === 'hit' ? 10 : 8;
        ctx.globalAlpha = Math.max(0, effect.life / effect.maxLife) * 0.8;
        ctx.lineWidth = effect.type === 'hit' ? 7 : 4;
        for (let index = 0; index < rays; index++) {
          const angle = index * Math.PI * 2 / rays + progress * 0.6;
          const inner = radius * 0.42;
          const outer = radius * (effect.type === 'upgrade' ? 1.14 : 0.92);
          ctx.beginPath();
          ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
          ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
          ctx.stroke();
        }
        if (effect.type === 'hit') {
          ctx.strokeStyle = '#fff3e0';
          ctx.lineWidth = 9;
          ctx.beginPath();
          ctx.moveTo(-radius * 0.55, -radius * 0.55);
          ctx.lineTo(radius * 0.55, radius * 0.55);
          ctx.moveTo(radius * 0.55, -radius * 0.55);
          ctx.lineTo(-radius * 0.55, radius * 0.55);
          ctx.stroke();
        }
        ctx.restore();
      });
    }

    function draw() {
      ctx.setTransform(canvasView.dpr, 0, 0, canvasView.dpr, 0, 0);
      drawGround();
      const renderScale = canvasView.width < 520 ? 1.38 : 1;
      state.people
        .slice()
        .sort((a, b) => a.level - b.level)
        .forEach(person => {
          const screen = worldToScreen(person.x, person.y);
          const margin = personRadius(person.level) * 2 * renderScale;
          if (screen.x < -margin || screen.x > canvasView.width + margin || screen.y < -margin || screen.y > canvasView.height + margin) return;
          drawCharacter(screen.x, screen.y + Math.sin(person.bob) * 2, person.level, person.angle, false, 1, renderScale);
          if (canvasView.width >= 520) {
            ctx.fillStyle = person.level <= state.player.level ? '#d7f5d8' : '#ffc2b8';
            ctx.font = '700 10px Arial, Microsoft YaHei, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(ranks[person.level].name, screen.x, screen.y + personRadius(person.level) * 1.55 + 10);
          }
        });
      const blink = state.player.invulnerable > 0 && Math.floor(state.player.invulnerable * 10) % 2 === 0;
      const playerScreen = worldToScreen(state.player.x, state.player.y);
      const pulseScale = renderScale * (1 + state.player.pulse * 0.26);
      drawCharacter(playerScreen.x, playerScreen.y, state.player.level, state.player.angle, true, blink ? 0.35 : 1, pulseScale);
      drawEffects();
      drawParticles();
      if (state.screenFlash > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(0.24, state.screenFlash * 0.34);
        ctx.fillStyle = state.flashColor;
        ctx.fillRect(0, 0, canvasView.width, canvasView.height);
        ctx.restore();
      }
    }

    function update(delta) {
      if (state.ending) {
        state.player.pulse = Math.max(0, state.player.pulse - delta * 1.2);
        updateParticles(delta);
        return;
      }
      updatePlayer(delta);
      updatePeople(delta);
      maintainPopulation(delta);
      checkCollisions();
      updateParticles(delta);
    }

    function gameLoop(time, token) {
      if (!state.running || state.paused || token !== state.frameToken) return;
      const delta = Math.min((time - state.lastTime) / 1000, 0.04);
      state.lastTime = time;
      update(delta);
      draw();
      if (!state.finished) requestAnimationFrame(nextTime => gameLoop(nextTime, token));
    }

    function finishGame(won) {
      if (state.ending || state.finished) return;
      const difficulty = getDifficulty();
      state.ending = true;
      state.paused = false;
      state.pausedByVisibility = false;
      releaseWakeLock();
      pauseButton.disabled = true;
      playSound(won ? 'win' : 'lose');
      overlay.className = `overlay ${won ? 'victory' : 'defeat'}`;
      overlay.innerHTML = won
        ? `<strong>天下归心</strong><p>主公已登大王之位。<br>${difficulty.name} · 破敌 ${state.totalEaten} · 最高连破 ${state.bestStreak}</p><div class="end-actions"><button class="primary" id="play-again" type="button">再定乾坤</button><button class="secondary" data-action="choose-difficulty" type="button">另择军势</button></div>`
        : `<strong>大势已去</strong><p>主公止步于${ranks[state.player.level].name}。<br>${difficulty.name} · 破敌 ${state.totalEaten} · 最高连破 ${state.bestStreak}</p><div class="end-actions"><button class="primary" id="play-again" type="button">卷土重来</button><button class="secondary" data-action="choose-difficulty" type="button">另择军势</button></div>`;
      overlay.hidden = false;
      const playAgainButton = document.querySelector('#play-again');
      playAgainButton.addEventListener('click', () => {
        resetGame();
        startGame();
      });
      playAgainButton.focus();
      state.endTimer = window.setTimeout(() => {
        if (!state.ending) return;
        state.ending = false;
        state.finished = true;
        state.running = false;
        state.frameToken++;
        draw();
      }, 900);
    }

    function togglePause() {
      if (!state.running || state.finished || state.ending) return;
      state.paused = !state.paused;
      pauseButton.textContent = state.paused ? '▶' : 'Ⅱ';
      pauseButton.title = state.paused ? '再战' : '暂避锋芒';
      pauseButton.setAttribute('aria-label', state.paused ? '继续' : '暂停');
      if (state.paused) {
        releaseWakeLock();
      } else {
        state.pausedByVisibility = false;
        requestWakeLock();
        state.lastTime = performance.now();
        const token = ++state.frameToken;
        requestAnimationFrame(time => gameLoop(time, token));
      }
    }

    function toggleSound() {
      state.muted = !state.muted;
      soundButton.textContent = state.muted ? '🔇' : '🔊';
      soundButton.title = state.muted ? '开启音效' : '静音';
      soundButton.setAttribute('aria-label', state.muted ? '开启音效' : '静音');
      if (state.muted) {
        if (state.audioContext?.state === 'running') state.audioContext.suspend();
      } else {
        getAudioContext();
        playSound('start');
      }
    }

    function canvasPosition(event) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left) * canvasView.width / bounds.width,
        y: (event.clientY - bounds.top) * canvasView.height / bounds.height
      };
    }

    function steerToward(point) {
      const playerScreen = worldToScreen(state.player.x, state.player.y);
      const dx = point.x - playerScreen.x;
      const dy = point.y - playerScreen.y;
      if (Math.hypot(dx, dy) < 8) return;
      setHeading(Math.atan2(dy, dx));
    }

    function endPointerGesture(event, cancelled = false) {
      if (!pointerGesture.active || event.pointerId !== pointerGesture.pointerId) return;
      const point = canvasPosition(event);
      const dx = point.x - pointerGesture.startX;
      const dy = point.y - pointerGesture.startY;
      if (!cancelled) {
        if (pointerGesture.pointerType === 'touch' && pointerGesture.moved && Math.hypot(dx, dy) > 12) {
          setHeading(Math.atan2(dy, dx));
        } else {
          steerToward(point);
        }
      }
      try {
        if (canvas.hasPointerCapture?.(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      } catch {}
      pointerGesture.active = false;
      pointerGesture.pointerId = null;
      arenaShell.classList.remove('steering');
    }

    canvas.addEventListener('pointerdown', event => {
      if (!state.running || state.paused || state.finished || state.ending) return;
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      const point = canvasPosition(event);
      pointerGesture.active = true;
      pointerGesture.pointerId = event.pointerId;
      pointerGesture.pointerType = event.pointerType;
      pointerGesture.startX = point.x;
      pointerGesture.startY = point.y;
      pointerGesture.moved = false;
      arenaShell.classList.add('steering');
      try { canvas.setPointerCapture?.(event.pointerId); } catch {}
      steerToward(point);
    });

    canvas.addEventListener('pointermove', event => {
      if (!pointerGesture.active || event.pointerId !== pointerGesture.pointerId) return;
      event.preventDefault();
      const point = canvasPosition(event);
      const dx = point.x - pointerGesture.startX;
      const dy = point.y - pointerGesture.startY;
      if (Math.hypot(dx, dy) > 12) pointerGesture.moved = true;
      if (pointerGesture.pointerType === 'touch' && pointerGesture.moved) {
        setHeading(Math.atan2(dy, dx));
      } else {
        steerToward(point);
      }
    });

    canvas.addEventListener('pointerup', event => endPointerGesture(event));
    canvas.addEventListener('pointercancel', event => endPointerGesture(event, true));
    canvas.addEventListener('lostpointercapture', event => {
      if (pointerGesture.active && event.pointerId === pointerGesture.pointerId) endPointerGesture(event, true);
    });
    canvas.addEventListener('contextmenu', event => event.preventDefault());

    const keyMap = {
      ArrowUp: 'up', w: 'up', W: 'up',
      ArrowDown: 'down', s: 'down', S: 'down',
      ArrowLeft: 'left', a: 'left', A: 'left',
      ArrowRight: 'right', d: 'right', D: 'right'
    };

    document.addEventListener('keydown', event => {
      if (keyMap[event.key]) {
        event.preventDefault();
        setDirection(keyMap[event.key]);
      }
      if (event.code === 'Space') {
        event.preventDefault();
        togglePause();
      }
    });

    directionButtons.forEach(button => {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        setDirection(button.dataset.direction);
      });
    });

    overlay.addEventListener('click', event => {
      const difficultyButton = event.target.closest('[data-difficulty]');
      if (difficultyButton) {
        state.difficulty = difficultyButton.dataset.difficulty;
        resetGame();
        showStartOverlay();
        return;
      }
      const actionButton = event.target.closest('[data-action]');
      if (!actionButton) return;
      if (actionButton.dataset.action === 'start') startGame();
      if (actionButton.dataset.action === 'choose-difficulty') {
        resetGame();
        showStartOverlay();
      }
    });
    soundButton.addEventListener('click', toggleSound);
    pauseButton.addEventListener('click', togglePause);
    fullscreenButton.addEventListener('click', toggleFullscreen);
    document.querySelector('#restart').addEventListener('click', () => {
      resetGame();
      showStartOverlay();
    });

    document.addEventListener('fullscreenchange', syncFullscreenButton);
    document.addEventListener('webkitfullscreenchange', syncFullscreenButton);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (state.running && !state.paused && !state.finished && !state.ending) {
          state.pausedByVisibility = true;
          togglePause();
        } else {
          releaseWakeLock();
        }
        return;
      }
      scheduleCanvasResize();
      if (state.running && !state.paused && !state.finished && !state.ending) requestWakeLock();
    });

    window.addEventListener('resize', scheduleCanvasResize, { passive: true });
    window.addEventListener('orientationchange', scheduleCanvasResize, { passive: true });
    window.visualViewport?.addEventListener('resize', scheduleCanvasResize, { passive: true });
    mobileLayoutQuery.addEventListener?.('change', scheduleCanvasResize);
    if ('ResizeObserver' in window) new ResizeObserver(scheduleCanvasResize).observe(arenaShell);

    rankRoad.innerHTML = ranks.map(rank => `<span>${rank.name}</span>`).join('');
    syncFullscreenButton();
    resizeCanvas();
    resetGame();
  </script>
</body>
</html>
