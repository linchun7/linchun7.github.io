<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#15100d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="soldier-to-king.webmanifest">
  <link rel="apple-touch-icon" href="assets/three-kingdoms-ui/tiger-command-emblem-cutout.png">
  <title>小兵变大王</title>
  <style>
    :root {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #f4ead6;
      background: #15100d;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #15100d;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 20px 12px;
      display: grid;
      place-items: center;
      overscroll-behavior: none;
      background-color: #15100d;
      background-image: url('assets/three-kingdoms-ui/war-camp-table-game.webp');
      background-position: center;
      background-size: cover;
    }

    button {
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .game {
      position: relative;
      width: min(100%, 840px);
      min-width: 0;
      overflow: hidden;
      padding: clamp(14px, 3vw, 26px);
      border: 2px solid #9b793d;
      border-radius: 8px;
      background-color: #1a1210;
      background-image: url('assets/three-kingdoms-ui/dark-lacquer-texture-game.webp');
      background-repeat: repeat;
      background-size: 320px 320px;
      box-shadow: 0 18px 44px #070403, inset 0 0 0 1px #4d321f;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .title-emblem { width: 58px; height: 58px; flex: 0 0 auto; object-fit: contain; }

    h1 { margin: 0; color: #f1d18a; font-size: clamp(25px, 6vw, 36px); letter-spacing: 0; text-shadow: 0 2px #27130d; }
    .subtitle { margin: 4px 0 0; color: #c8ae82; font-size: 13px; }

    .tools { display: flex; gap: 7px; }

    .icon-button {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid #9b793d;
      border-radius: 6px;
      color: #f5e9d1;
      background: #2c211b;
      font-size: 19px;
      font-weight: 800;
    }

    .icon-button:hover, .icon-button:focus-visible { outline: 3px solid #d4ae5f; outline-offset: 2px; }
    .icon-button:disabled { cursor: default; opacity: 0.45; }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px 18px;
      margin-bottom: 10px;
      padding: 12px 14px;
      border: 1px solid #735631;
      border-radius: 7px;
      background: #17100ee8;
      box-shadow: inset 0 0 0 1px #35251b;
    }

    .rank-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 9px; min-width: 0; }
    #rank-name { color: #e7bd62; font-size: 20px; font-weight: 900; }
    #weapon-name { color: #92baa3; font-size: 13px; font-weight: 800; }
    #record { color: #cdbf9f; font-size: 13px; white-space: nowrap; }
    #hearts { color: #c95549; font-size: 17px; letter-spacing: 0; white-space: nowrap; }

    .progress {
      grid-column: 1 / 3;
      height: 10px;
      overflow: hidden;
      border: 1px solid #60492d;
      border-radius: 5px;
      background: #090706;
    }

    #progress-fill { width: 0; height: 100%; background: #70a37d; transition: width 200ms; }

    .arena-shell {
      position: relative;
      overflow: hidden;
      border: 2px solid #a17d42;
      border-radius: 7px;
      background: #565239;
      box-shadow: 0 0 0 2px #271a12, inset 0 0 22px #17120d;
    }

    canvas {
      width: 100%;
      display: block;
      aspect-ratio: 4 / 3;
      touch-action: none;
      cursor: crosshair;
    }

    .arena-shell.steering { border-color: #e6c66f; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 12px;
      background: #160f0de8;
      text-align: center;
    }

    .overlay::before {
      content: '';
      width: 58px;
      height: 58px;
      margin: 0 auto 4px;
      background: url('assets/three-kingdoms-ui/tiger-command-emblem-cutout.png') center / contain no-repeat;
    }

    .overlay.victory { background: #142014ed; }
    .overlay.defeat { background: #281010ed; }

    .overlay[hidden] { display: none; }
    .overlay strong { color: #e7bd62; font-size: clamp(24px, 7vw, 38px); }
    .overlay p { margin: 4px 0 10px; color: #ded0b5; line-height: 1.45; }

    .difficulty-picker {
      width: min(100%, 370px);
      margin: 0 0 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }

    .difficulty-option {
      min-width: 0;
      min-height: 34px;
      padding: 5px 8px;
      border: 1px solid #72532f;
      border-radius: 4px;
      color: #cbb996;
      background: #211713;
      font-size: 13px;
      font-weight: 800;
    }

    .difficulty-option[aria-pressed="true"] {
      border-color: #dfb95f;
      color: #21150c;
      background: #d2ad60;
      box-shadow: inset 0 -2px #8e6932;
    }

    .primary {
      min-width: 150px;
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      color: #20150d;
      background: #d1ad60;
      font-weight: 900;
      box-shadow: inset 0 -3px #8f6b32;
    }

    .secondary {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid #8e6a38;
      border-radius: 6px;
      color: #ecddc0;
      background: #2b1d16;
      font-weight: 800;
    }

    .end-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }

    .toast {
      position: absolute;
      top: 18px;
      left: 50%;
      z-index: 2;
      min-width: 180px;
      padding: 8px 13px;
      transform: translate(-50%, -15px);
      border: 1px solid #f0d999;
      border-radius: 6px;
      color: #25160d;
      background: #e1c47e;
      font-weight: 900;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms, transform 160ms;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .controls {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 2;
      min-height: 0;
      margin: 0;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(2, 46px);
      gap: 5px;
    }

    .direction {
      border: 1px solid #98733e;
      border-radius: 6px;
      color: #f1e4ca;
      background: #241a16e8;
      box-shadow: 0 3px 10px #0b0706a8;
      font-size: 22px;
      font-weight: 800;
      user-select: none;
      touch-action: none;
    }

    .direction:active, .direction.active { color: #21150c; background: #d2ad60; }
    .up { grid-column: 2; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }

    .rank-road {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      margin-top: 8px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-color: #8a6739 #271a13;
      color: #b9a887;
      font-size: 11px;
      text-align: center;
    }

    .rank-road span { flex: 0 0 76px; padding: 6px 2px; border-bottom: 3px solid #4a3824; overflow-wrap: anywhere; }
    .rank-road span.done { color: #f1d18a; border-color: #d2ad60; font-weight: 800; }

    .game:fullscreen,
    .game:-webkit-full-screen {
      width: 100vw;
      max-width: none;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      border: 0;
      border-radius: 0;
    }

    .game:fullscreen .arena-shell,
    .game:-webkit-full-screen .arena-shell { min-height: 0; height: 100%; }
    .game:fullscreen canvas,
    .game:-webkit-full-screen canvas { height: 100%; aspect-ratio: auto; }

    @media (max-width: 700px), (pointer: coarse) and (max-height: 700px) {
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { padding: 0; place-items: stretch; }
      .game {
        width: 100%;
        max-width: none;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        max-height: 100dvh;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        overflow: hidden;
        border: 0;
        border-radius: 0;
      }
      header { margin-bottom: 7px; gap: 8px; }
      .title-emblem { width: 46px; height: 46px; }
      .subtitle { display: none; }
      .tools { gap: 4px; }
      .icon-button { width: 40px; height: 40px; }
      .hud { margin-bottom: 7px; padding: 9px 10px; }
      .arena-shell { min-height: 170px; height: 100%; }
      canvas { height: 100%; aspect-ratio: auto; cursor: default; }
      .controls { display: none; }
      .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(2, 42px); gap: 4px; }
      .direction { min-width: 42px; min-height: 42px; }
      .rank-road { min-height: 25px; margin-top: 3px; scrollbar-width: none; }
      .rank-road::-webkit-scrollbar { display: none; }
      .rank-road span { flex-basis: 68px; padding: 4px 2px; }
      .toast { top: 12px; width: max-content; max-width: calc(100% - 20px); min-width: 0; }
      .overlay::before { width: 48px; height: 48px; }
      .overlay strong { font-size: 27px; }
      .difficulty-picker { margin-bottom: 8px; }
      .difficulty-option { min-height: 32px; padding: 3px 5px; font-size: 12px; }
      .primary, .secondary { min-height: 40px; }
    }

    @media (max-width: 360px) {
      .title-emblem { display: none; }
      h1 { font-size: 22px; }
      .icon-button { width: 40px; height: 40px; }
    }

    @media (max-width: 700px) and (max-height: 700px) and (orientation: portrait) {
      header { margin-bottom: 5px; }
      .title-emblem { width: 38px; height: 38px; }
      h1 { font-size: 23px; }
      .hud { margin-bottom: 5px; padding: 7px 8px; gap: 5px 10px; }
      #rank-name { font-size: 18px; }
      #weapon-name, #record { font-size: 12px; }
      .progress { height: 8px; }
      .controls { min-height: 84px; margin-top: 3px; }
      .dpad { grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 40px); }
      .direction { min-width: 40px; min-height: 40px; }
      .rank-road { min-height: 23px; }
      .rank-road span { padding-top: 3px; padding-bottom: 3px; }
      .overlay { padding: 8px; }
      .overlay::before { width: 38px; height: 38px; }
      .overlay strong { font-size: 24px; }
      .overlay p { margin-bottom: 6px; font-size: 13px; }
    }

    @media (pointer: coarse) and (orientation: landscape) and (max-height: 600px) {
      .game,
      .game:fullscreen,
      .game:-webkit-full-screen {
        grid-template-columns: minmax(190px, 32vw) minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 6px 8px;
        padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      }
      header {
        grid-column: 1;
        grid-row: 1;
        margin: 0;
        flex-wrap: wrap;
        align-content: start;
        gap: 4px;
      }
      .brand { width: 100%; }
      .title-emblem { display: block; width: 34px; height: 34px; }
      h1 { font-size: 21px; }
      .tools { width: 100%; }
      .icon-button { width: 36px; height: 36px; font-size: 17px; }
      .hud {
        grid-column: 1;
        grid-row: 2;
        align-self: start;
        align-content: start;
        margin: 0;
        padding: 7px 8px;
        gap: 5px 8px;
        overflow: hidden;
      }
      #rank-name { font-size: 17px; }
      #weapon-name, #record { font-size: 11px; }
      #hearts { font-size: 14px; }
      .arena-shell {
        grid-column: 2;
        grid-row: 1 / 4;
        min-height: 0;
        height: 100%;
      }
      .controls {
        position: absolute;
        right: max(14px, calc(env(safe-area-inset-right) + 8px));
        bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px));
        z-index: 4;
        min-height: 0;
        margin: 0;
      }
      .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(2, 42px); }
      .direction { min-width: 42px; min-height: 42px; background: #251a16e8; }
      .rank-road { grid-column: 1; grid-row: 3; margin: 0; }
      .overlay::before { width: 36px; height: 36px; }
      .overlay strong { font-size: 24px; }
      .overlay p { margin-bottom: 5px; font-size: 12px; }
      .difficulty-picker { max-width: 330px; margin-bottom: 6px; }
      .difficulty-option { min-height: 30px; }
      .primary, .secondary { min-height: 36px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div class="brand">
        <img class="title-emblem" src="assets/three-kingdoms-ui/tiger-command-emblem-cutout.png" alt="">
        <div>
          <h1>小兵变大王</h1>
        <p class="subtitle">乱世争雄，问鼎天下</p>
        </div>
      </div>
      <div class="tools">
        <button class="icon-button" id="sound" type="button" aria-label="静音" title="静音">🔊</button>
        <button class="icon-button" id="pause" type="button" aria-label="暂停" title="暂避锋芒">Ⅱ</button>
        <button class="icon-button" id="restart" type="button" aria-label="重整旗鼓" title="重整旗鼓">↻</button>
        <button class="icon-button" id="fullscreen" type="button" aria-label="进入全屏" title="进入全屏">⛶</button>
      </div>
    </header>

    <section class="hud" aria-label="当前状态">
      <div class="rank-line"><span id="rank-name">小兵</span><span id="weapon-name">兵器 · 木杆枪</span><span id="progress-label">战功 0 / 2</span></div>
      <div id="hearts" aria-label="当前体力">♥ ♥ ♥</div>
      <div class="progress"><div id="progress-fill"></div></div>
      <div id="record">破敌 0 · 连破 0</div>
    </section>

    <section class="arena-shell">
      <canvas id="arena" width="640" height="480" aria-label="成长地图"></canvas>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="overlay" id="overlay">
        <strong>主公，请定军势</strong>
        <p>乱世已至，选定一场征伐。</p>
        <div class="difficulty-picker" role="group" aria-label="征战难度">
          <button class="difficulty-option" type="button" data-difficulty="rookie" aria-pressed="false">初出茅庐</button>
          <button class="difficulty-option" type="button" data-difficulty="normal" aria-pressed="true">逐鹿中原</button>
          <button class="difficulty-option" type="button" data-difficulty="heroic" aria-pressed="false">群雄争霸</button>
          <button class="difficulty-option" type="button" data-difficulty="legend" aria-pressed="false">决战赤壁</button>
        </div>
        <button class="primary" id="start" data-action="start" type="button">整军出征</button>
      </div>
      <section class="controls" aria-label="方向控制">
        <div class="dpad">
          <button class="direction up" type="button" data-direction="up" aria-label="向上" title="向上">↑</button>
          <button class="direction left" type="button" data-direction="left" aria-label="向左" title="向左">←</button>
          <button class="direction down" type="button" data-direction="down" aria-label="向下" title="向下">↓</button>
          <button class="direction right" type="button" data-direction="right" aria-label="向右" title="向右">→</button>
        </div>
      </section>
    </section>

    <div class="rank-road" id="rank-road" aria-label="封将之路"></div>
  </main>

  <script>
    const ranks = [
      { name: '小兵', color: '#687b69', accent: '#d7d8c8', need: 2, size: 22, style: 0, weapon: '木杆枪' },
      { name: '精兵', color: '#817158', accent: '#dfc68d', need: 3, size: 23, style: 0, weapon: '短刀' },
      { name: '老兵', color: '#76624c', accent: '#d5b06c', need: 3, size: 24, style: 0, weapon: '铁枪' },
      { name: '伍长', color: '#865c3e', accent: '#e3a66f', need: 4, size: 25, style: 1, weapon: '环首刀' },
      { name: '什长', color: '#416f68', accent: '#8fcfc0', need: 4, size: 26, style: 1, weapon: '长枪' },
      { name: '都伯', color: '#3e667d', accent: '#8fc5dc', need: 5, size: 27, style: 1, weapon: '硬弓' },
      { name: '队率', color: '#6f4b42', accent: '#d89b83', need: 5, size: 28, style: 2, weapon: '双剑' },
      { name: '屯长', color: '#3c6b80', accent: '#9acde0', need: 6, size: 29, style: 2, weapon: '重矛' },
      { name: '都头', color: '#78513a', accent: '#e0ae72', need: 6, size: 30, style: 2, weapon: '朴刀' },
      { name: '军侯', color: '#405b78', accent: '#95b9df', need: 7, size: 31, style: 3, weapon: '虎头枪' },
      { name: '军司马', color: '#5b486f', accent: '#baa1d5', need: 7, size: 32, style: 3, weapon: '长戟' },
      { name: '别部司马', color: '#7a3f45', accent: '#dd8b82', need: 8, size: 33, style: 3, weapon: '铁脊蛇矛' },
      { name: '百夫长', color: '#865142', accent: '#e8a174', need: 8, size: 34, style: 4, weapon: '剑盾' },
      { name: '千夫长', color: '#4e5f75', accent: '#acc1db', need: 9, size: 35, style: 4, weapon: '强弩' },
      { name: '校尉', color: '#496e43', accent: '#9fc58b', need: 9, size: 36, style: 4, weapon: '青龙偃月刀' },
      { name: '骑都尉', color: '#7a3940', accent: '#e08c75', need: 10, size: 37, style: 5, weapon: '斩马刀' },
      { name: '都尉', color: '#725b38', accent: '#d8bd72', need: 10, size: 38, style: 5, weapon: '双股剑' },
      { name: '中郎将', color: '#314f65', accent: '#94c6dc', need: 11, size: 39, style: 5, weapon: '丈八蛇矛' },
      { name: '偏将军', color: '#3b6c54', accent: '#9bc29b', need: 11, size: 40, style: 6, weapon: '龙胆亮银枪' },
      { name: '裨将军', color: '#7a4e32', accent: '#ddb277', need: 12, size: 41, style: 6, weapon: '古锭刀' },
      { name: '牙门将军', color: '#70433c', accent: '#d68d79', need: 12, size: 42, style: 6, weapon: '双铁戟' },
      { name: '荡寇将军', color: '#305f52', accent: '#8fc4a8', need: 13, size: 43, style: 7, weapon: '凤嘴刀' },
      { name: '镇军将军', color: '#4f4f74', accent: '#ada9dd', need: 13, size: 44, style: 7, weapon: '狼牙棒' },
      { name: '前将军', color: '#2f5c7b', accent: '#99cae6', need: 14, size: 45, style: 7, weapon: '龙纹长枪' },
      { name: '卫将军', color: '#7a452d', accent: '#e1a365', need: 14, size: 46, style: 8, weapon: '方天画戟' },
      { name: '骠骑将军', color: '#5d3b72', accent: '#c59de0', need: 15, size: 47, style: 8, weapon: '七星宝刀' },
      { name: '车骑将军', color: '#7c6225', accent: '#e5c76a', need: 16, size: 48, style: 8, weapon: '倚天剑' },
      { name: '大将军', color: '#7b2938', accent: '#e98d7c', need: 18, size: 50, style: 9, weapon: '霸王枪' },
      { name: '大都督', color: '#8b641e', accent: '#f2d16b', need: 20, size: 52, style: 9, weapon: '神威画戟' },
      { name: '大王', color: '#59213a', accent: '#ffd75e', need: 0, size: 55, style: 9, weapon: '王者之剑' }
    ];

    const difficulties = {
      rookie: {
        name: '初出茅庐', hearts: 4, needScale: 0.86, enemySpeed: 0.86,
        edibleChance: 0.88, dangerRange: 2, population: 42,
        initialNearby: 7, initialEdible: 5, nearbySoldiers: 3, nearbyEdible: 5,
        peerChance: 1, progressPenalty: 1, invulnerability: 1.7, pursuit: 0, aggroRange: 0,
        threatPerLevel: 0, criticalGap: 99
      },
      normal: {
        name: '逐鹿中原', hearts: 3, needScale: 1.14, enemySpeed: 1.06,
        edibleChance: 0.75, dangerRange: 4, population: 46,
        initialNearby: 6, initialEdible: 3, nearbySoldiers: 2, nearbyEdible: 3,
        peerChance: 0.85, progressPenalty: 2, invulnerability: 1.35, pursuit: 0.9, aggroRange: 360,

        peerChance: 0.45, progressPenalty: 4, invulnerability: 0.85, pursuit: 1.8, aggroRange: 520,
        threatPerLevel: 0.055, criticalGap: 4

    const characterPortraitSources = [
      'assets/three-kingdoms/militia-cutout.png',

    const canvas = document.querySelector('#arena');

    const state = {

    const pointerGesture = {
